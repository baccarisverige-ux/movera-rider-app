      - from
      - to
      - mode
      properties:
        id:
          type: string
          minLength: 1
        'on':
          type: boolean
        from:
          type: string
          pattern: ^\d\d:\d\d$
        to:
          type: string
          pattern: ^\d\d:\d\d$
        mode:
          type: string
          enum:
          - radar
          - exclusive
    DispatchChoose:
      type: object
