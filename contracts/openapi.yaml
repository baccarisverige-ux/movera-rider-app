      - approved
      - rejected
      - blocked
    Vehicle:
      type: object
      required:
      - vehicleId
      - make
      - model
      - year
      - color
      - plate
      - seats
      - categoryIds
      - status
      - version
      properties:
        vehicleId:
          $ref: '#/components/schemas/Id'
        make:
          type: string
        model:
          type: string
        year:
          type: integer
          minimum: 1950
          maximum: 2100
        color:
          type: string
        plate:
          type: string
        seats:
          type: integer
          minimum: 1
          maximum: 20
        categoryIds:
          type: array
          items:
            $ref: '#/components/schemas/CategoryId'
        status:
          $ref: '#/components/schemas/VehicleStatus'
        version:
          type: integer
          minimum: 1
        fleetId:
          allOf:
          - $ref: '#/components/schemas/Id'
          description: 'v0.5.3: the fleet that owns the car.'
        driverId:
          allOf:
          - $ref: '#/components/schemas/Id'
