  /driver/trips/{tripId}/complete-preview:
    get:
      operationId: previewCompleteTrip
      summary: The final price before completing (read-only)
      description: 'v0.18.1 (CONTRACT.md §26): the trip''s own driver (anyone else 404 not_found); only while the trip is
        on board (rider_onboard, in_trip, approaching_dropoff), else 409 invalid_transition, reason trip_not_on_board. No
        Idempotency-Key; the wallet is not touched; the trip''s version does not change. Each call freezes its price for freezeSeconds
        and replaces the trip''s earlier preview. total and fareLines are computed by the same code as POST /trips/{tripId}/complete
        would at that moment with the driver''s latest fix (pricing.driverEndsEarly): earlyEnd is true when the driver is
        farther than pricing.completeNearDropoffMeters from the drop-off. cashDue = total − the part the rider''s wallet would
        pay. driverEarnings = the driver''s part of that total (as TripProjection.driverEarnings after complete), for the
        sheet''s cash balance. POST /trips/{tripId}/complete { expectedVersion, previewId, cashCollected } with the trip''s
        latest previewId before expiresAt: complete uses the frozen price exactly (total, fareLines, driverEarnings, earlyEnd):
        no early-end flip, no extra minutes or waiting. On a cash trip cashCollected must equal its cashDue (and the wallet
        part must be unchanged); otherwise 409 conflict, reason price_changed, with a fresh preview in the error''s preview
        field. The app sends POST /trips/{tripId}/complete { expectedVersion, previewId, cashCollected = the cashDue it showed
        } on a cash trip. On 409 price_changed it shows the sheet again with error.preview (never resends the old amount).
        After completing the app shows the fare of the returned TripProjection. An older server without the preview (404)
        leaves the app on the old flow (complete without cashCollected).'
