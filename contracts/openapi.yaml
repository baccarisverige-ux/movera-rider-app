      summary: Trip realtime stream (SSE / WebSocket) or JSON replay
      description: 'Resync: GET /trips/{tripId} then GET /trips/{tripId}/events?after={projection.sequence}. Admin uses the
        same stream for the live map.'
      tags:
      - Realtime
      x-actor:
      - rider
      - driver
      - admin
      parameters:
      - $ref: '#/components/parameters/TripId'
      - $ref: '#/components/parameters/After'
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/LastEventId'
      - $ref: '#/components/parameters/RequestId'
      - $ref: '#/components/parameters/ApiVersion'
      responses:
        '200':
          description: '`Accept: text/event-stream` → live stream starting after `after`; `Accept: application/json` → replay
            page of events with sequence > after.'
          headers:
            X-Request-Id:
              description: Echo of the request id (server-generated if absent).
              schema:
                type: string
          content:
            text/event-stream:
              schema:
                type: string
                description: Server-sent events. A WebSocket upgrade on the same URL carries the same JSON frames. Each SSE
                  `data:` line is one JSON RealtimeEvent; `id:` is the sequence; heartbeat comments every 15 s.
              x-sse-data: '#/components/schemas/RealtimeEvent'
            application/json:
              schema:
                $ref: '#/components/schemas/RealtimeEventPage'
        '400':
          $ref: '#/components/responses/BadRequest'
