      type: object
      description: Driver offer feed event.
      required:
      - eventId
      - sequence
      - kind
      - occurredAt
      - serverTime
      - offer
      properties:
        eventId:
          $ref: '#/components/schemas/Id'
        sequence:
          type: integer
          minimum: 1
          description: Per-driver feed cursor for `after` replay.
        kind:
          type: string
          enum:
          - offer_created
          - offer_updated
          - offer_withdrawn
        occurredAt:
          $ref: '#/components/schemas/Timestamp'
        serverTime:
          $ref: '#/components/schemas/Timestamp'
        offer:
          allOf:
          - $ref: '#/components/schemas/Offer'
          description: For offer_withdrawn, offer.status is claimed_elsewhere | expired | withdrawn.
        driverOffline:
          type: boolean
          description: 'v0.8.0: this declined or expired Exclusive offer was the last of the run that set the driver offline
            (contract.json#autoOffline).'
    ConfigEvent:
      type: object
      description: Apps re-fetch the config document on this event.
      required:
      - eventId
      - kind
      - doc
      - zoneId
      - version
      - publishedAt
      - occurredAt
      - serverTime
      properties:
        eventId:
          $ref: '#/components/schemas/Id'
        kind:
          type: string
          const: config_published
        doc:
          $ref: '#/components/schemas/ConfigDocName'
        zoneId:
          $ref: '#/components/schemas/Id'
        version:
          type: integer
          minimum: 1
        publishedAt:
          $ref: '#/components/schemas/Timestamp'
        occurredAt:
          $ref: '#/components/schemas/Timestamp'
        serverTime:
          $ref: '#/components/schemas/Timestamp'
    Error:
      type: object
      required:
      - code
      - message
      - requestId
      - retryable
      properties:
        code:
          $ref: '#/components/schemas/ErrorCode'
        message:
          type: string
        requestId:
          type: string
        retryable:
          type: boolean
        reason:
          type: string
          pattern: ^[a-z][a-z0-9_]{0,63}$
          description: optional machine-readable detail under a code (snake_case), e.g. invalid_request + invalid_phone, invalid_otp_code,
            invalid_otp_session; never shown to users as is
        projection:
          description: Current authoritative resource. Always present for version_mismatch and invalid_transition (TripProjection
            for trip commands; Offer / Driver / Rider / Vehicle / ConfigDraft for their commands).
          anyOf:
          - $ref: '#/components/schemas/TripProjection'
          - $ref: '#/components/schemas/Offer'
          - $ref: '#/components/schemas/Driver'
          - $ref: '#/components/schemas/Rider'
          - $ref: '#/components/schemas/Vehicle'
          - $ref: '#/components/schemas/ConfigDraft'
          - $ref: '#/components/schemas/Incident'
    ConflictError:
      allOf:
      - $ref: '#/components/schemas/Error'
      if:
        properties:
          code:
            enum:
            - version_mismatch
            - invalid_transition
        required:
        - code
      then:
        required:
        - projection
      description: '409 body: version_mismatch | invalid_transition (with projection) or conflict (idempotency key reused
        with another body, offer claimed elsewhere).'
