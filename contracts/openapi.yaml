  /driver/availability:
    post:
      operationId: setDriverAvailability
      summary: Go online / offline
      description: '409 when on a trip, account not active, documents expired or driving limit reached (projection = Driver).
        v0.14.0: a car whose Vehicle.requiredDocuments are not all approved → 409 documents_not_approved (reason vehicle_documents_not_approved,
        details). v0.18.0: settings.expiry.blockAtExpiry true (default): with any document of Driver.requiredDocuments (and
        requiredFleetDocuments for a fleet owner) expired, POST /driver/availability online is 409 documents_not_approved,
        reason documents_expired, details "<scope>:<type>". false: an expired document does not stop going online (it still
        shows red). Car documents follow settings.vehicles.autoHold the same way (reason vehicle_documents_not_approved).
        With no car picked: reason fleet_no_approved_car when the fleet has no car that can be picked, else no_vehicle (contract.json#driverOnboarding.reminders).
        v0.18.4: Decision 2 + G3-R5. POST /driver/availability online needs a fresh position: a location in the body measured
        at most freshSeconds ago, or a position the server received at most freshSeconds ago (POST /driver/location). Otherwise
        409 invalid_transition, reason location_required (checked after every other reason, so the reason card shows the first
        thing to fix). Driver app: with the phone''s location off (or permission denied) Go online is blocked before calling
        the server and shows text + openSettings; with battery saver on it shows batterySaver once (per install) and may still
        go online. Outside the driver''s zones going online still works and the Driver carries outsideArea: true (contract.json#driverHome.outsideArea).
        Slow server: contract.json#auth.slowStart covers this call.'
      tags:
      - Driver · Session
      x-actor:
      - driver
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/RequestId'
      - $ref: '#/components/parameters/ApiVersion'
