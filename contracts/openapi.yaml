      required:
      - lat
      - lng
      - at
      properties:
        lat:
          type: number
          minimum: -90
          maximum: 90
        lng:
          type: number
          minimum: -180
          maximum: 180
        accuracyM:
          type: number
          minimum: 0
          description: Horizontal accuracy, metres.
        at:
          $ref: '#/components/schemas/Timestamp'
    Incident:
      type: object
      required:
      - incidentId
      - kind
      - severity
      - status
      - openedAt
      properties:
        incidentId:
          $ref: '#/components/schemas/Id'
        tripId:
          $ref: '#/components/schemas/Id'
        kind:
          type: string
          pattern: ^[a-z][a-z0-9_]{0,63}$
          examples:
          - sos
          - driver_silent
          - ride_check
          description: 'v0.7.0: contract.json#safety.incidentKinds (sos, driver_silent; ride_check is safety part 2). Older
            rows may hold other snake_case kinds.'
        severity:
          type: string
          enum:
          - low
          - medium
          - high
          - critical
        status:
          type: string
          enum:
          - open
          - investigating
          - resolved
          - dismissed
          description: open = New, investigating = Taken, resolved = Solved, dismissed = False alarm (contract.json#safety.statusLabels).
        version:
          type: integer
          minimum: 1
          description: 'v0.7.0: + 1 on take / resolve / dismiss; commands send it as expectedVersion.'
        reportedBy:
          $ref: '#/components/schemas/Actor'
        raisedBy:
          type: string
          enum:
          - rider
          - driver
          - system
          description: 'v0.7.0: who raised it; system for driver_silent.'
        zoneId:
          $ref: '#/components/schemas/Id'
        riderId:
          $ref: '#/components/schemas/Id'
        driverId:
          $ref: '#/components/schemas/Id'
        position:
          allOf:
          - $ref: '#/components/schemas/IncidentPosition'
          description: 'v0.7.0: the GPS the SOS phone sent (once).'
        driverPosition:
          allOf:
          - $ref: '#/components/schemas/GeoFix'
          description: 'v0.7.0: the car''s latest position the server has (admin view; read live, also after the SOS).'
        openedAt:
          $ref: '#/components/schemas/Timestamp'
        updatedAt:
          $ref: '#/components/schemas/Timestamp'
        escalatedAt:
          allOf:
          - $ref: '#/components/schemas/Timestamp'
          description: 'v0.7.0: set when the incident was not taken within contract.json#safety.escalateAfterSeconds (120
            s); every signed-in admin is alerted from then on.'
        takenBy:
          $ref: '#/components/schemas/Id'
        takenAt:
          $ref: '#/components/schemas/Timestamp'
        resolvedBy:
          allOf:
          - $ref: '#/components/schemas/Id'
          description: 'v0.7.0: the admin who solved it or called it a false alarm; absent when the system closed it.'
        resolvedAt:
          $ref: '#/components/schemas/Timestamp'
        resolution:
          type: string
          maxLength: 1000
          description: 'v0.7.0: the closing note; ''position back'' when the system closes a driver_silent incident.'
