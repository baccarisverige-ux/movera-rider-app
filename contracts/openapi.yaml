- name: Realtime
  description: 'Streams: SSE (or WebSocket) + JSON replay'
- name: Config
- name: Rider · Account
- name: Rider · Payments
- name: Notifications & messages
- name: Support
- name: Driver · Session
- name: Driver · Offers
- name: Driver · Trip
- name: Driver · Money
- name: Driver · Account
- name: Driver · Fleet
- name: Admin · Lists
- name: Admin · Trips
- name: Admin · Dispatch
- name: Admin · Money
- name: Admin · Support
- name: Admin · Reviews
- name: Admin · Safety
- name: Admin · Reports
- name: Safety
- name: Admin · People
- name: Admin · Config
- name: Admin · Governance
- name: Admin · Auth
  description: Admin panel sign-in with e-mail and password (v0.5.1)
- name: Maps
  description: Address search, geocoding and road routes through the server (v0.5.1); read-only, no Idempotency-Key
- name: Telemetry
  description: Fire-and-forget app logs, analytics and crashes (v0.5.1); no auth required
- name: Deprecated
  description: Legacy /rides aliases kept for one release
