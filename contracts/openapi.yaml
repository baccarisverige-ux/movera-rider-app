    CustomDocumentType:
      type: object
      description: 'v0.18.0 (owner item 14): a document type the admin creates for one country. { id, owner: driver | fleet
        | vehicle, kind: file | admin_check, expires: boolean, name: { sv, fr, en }, help: { sv, fr, en } } (all three languages,
        non-empty). The server makes the id (custom_ + 10 lower-case letters or digits) the first time the draft is saved:
        a new entry is sent without id and with draftKey (any short text the panel chooses), and the lists (documents.driver
        / fleet / vehicle, expiringTypes) may name it by "draft:<draftKey>"; the server replaces each with the new id and
        drops draftKey. An id once made never changes; an entry with an id the country does not have is 400 invalid_document.
        expires true puts the type in expiringTypes, false takes it out (the server keeps the two in step). owner fleet is
        a company document of a fleet account (owner_kind driver); owner vehicle a car document. Deleting an entry removes
        the type from the country: it must not stay in a list. Documents already uploaded for it stay stored.'
      required:
      - owner
      - kind
      - expires
      - name
      - help
      properties:
        id:
          type: string
          pattern: ^custom_[a-z0-9]{10}$
          description: Made by the server; leave out for a new type.
        draftKey:
          type: string
          minLength: 1
          maxLength: 40
          description: 'A new type only: lists may name it draft:<draftKey> until the server gives the id.'
        owner:
          type: string
          enum:
          - driver
          - fleet
          - vehicle
        kind:
          type: string
          enum:
          - file
          - admin_check
        expires:
          type: boolean
        name:
          $ref: '#/components/schemas/LocalText'
        help:
          $ref: '#/components/schemas/LocalText'
    DocumentTypeTexts:
      type: object
      description: 'v0.18.0 (owner item 14): texts[type] = { name?: { sv, fr, en }, help?: { sv, fr, en } } replaces the contract
        name, and adds a help / checklist text, of a contract type in this country. A key that is not a contract type of documents.types
        is 400 invalid_document (a custom type carries its own texts).'
      properties:
        name:
          $ref: '#/components/schemas/LocalText'
        help:
          $ref: '#/components/schemas/LocalText'
    DocumentTypeInfo:
