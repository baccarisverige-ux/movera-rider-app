        min:
          oneOf:
          - $ref: '#/components/schemas/Money'
          - type: 'null'
        max:
          oneOf:
          - $ref: '#/components/schemas/Money'
          - type: 'null'
      allOf:
      - if:
          properties:
            type:
              const: percent
          required:
          - type
        then:
          properties:
            value:
              maximum: 100
      - if:
          properties:
            type:
              const: fixed
          required:
          - type
        then:
          properties:
            value:
              type: integer
    CancelFeeTable:
      type: object
