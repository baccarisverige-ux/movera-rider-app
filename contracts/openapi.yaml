      description: 'v0.16.0 (owner 2026-10-29, "Want section on dispatch to show all crash droids and bugs detected from server"):
        POST /telemetry/crashes takes optional app, platform, appVersion, build, screen, kind and occurredAt next to error,
        stack and extra (additive; an older app sends none). The server scrubs again, groups each report and keeps the reports
        keepDays days.'
      required:
      - error
      properties:
        error:
          type: string
          maxLength: 4000
        stack:
          type: string
          maxLength: 12000
        extra:
          type: object
        app:
          type: string
          enum:
          - driver
          - rider
          description: v0.16.0
        platform:
          type: string
          enum:
          - android
          - ios
          - web
          description: v0.16.0
        appVersion:
          type: string
          maxLength: 40
          description: 'v0.16.0: e.g. 1.4.2.'
        build:
          type: string
          maxLength: 40
          description: 'v0.16.0: store build number.'
        screen:
          type: string
          maxLength: 200
          description: 'v0.16.0: route or screen name, no ids.'
        kind:
          type: string
          enum:
          - crash
          - error
          description: 'v0.16.0: crash (the app stopped) or error (caught). Default crash.'
