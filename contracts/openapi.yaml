      type: object
      description: 'v0.7.2: PriceCheck { windowMin: 60, saw, left, leftPct }: saw = quotes of the zone made in the last 60
        minutes with surgeMultiplier above 1.0; left = those of them no trip was created from; leftPct = round(100 × left
