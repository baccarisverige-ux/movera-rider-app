          - incident_updated
          - incident_escalated
          - incident_closed
        incident:
          $ref: '#/components/schemas/Incident'
        occurredAt:
          $ref: '#/components/schemas/Timestamp'
        serverTime:
          $ref: '#/components/schemas/Timestamp'
    PayoutLine:
