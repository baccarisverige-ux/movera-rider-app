          type: string
          format: email
          description: The fleet owner's e-mail as registered (case is forgiven).
    DriverOnboardingRequest:
      type: object
      description: 'v0.5.3: the details screen after the first sign-in. Allowed while accountStatus is pending or on_hold
        (a resend replaces the details); active or suspended → 409 invalid_transition. Moves pending → on_hold.'
      required:
      - firstName
      - lastName
      - dateOfBirth
      - email
      - country
      - cityId
      - language
      - accountType
      - termsAccepted
      properties:
        firstName:
          type: string
          minLength: 1
          maxLength: 60
        lastName:
          type: string
          minLength: 1
          maxLength: 60
        dateOfBirth:
          type: string
          format: date
          description: YYYY-MM-DD; younger than minAge → 400 invalid_request (under_age).
        email:
          type: string
          format: email
        country:
          $ref: '#/components/schemas/DriverCountry'
        cityId:
          type: string
          description: A cityId of the country (invalid_city).
        language:
          type: string
          pattern: ^[a-z]{2}(-[A-Z]{2})?$
        accountType:
          $ref: '#/components/schemas/DriverAccountType'
        termsAccepted:
          type: boolean
          const: true
          description: Must be true (terms_required); stored as the terms document, approved.
        company:
          allOf:
          - $ref: '#/components/schemas/FleetCompany'
          description: Required for accountType fleet (company_required); ignored for driver.
        fleetJoin:
          allOf:
          - $ref: '#/components/schemas/FleetJoinRequest'
          description: 'Optional for accountType driver: join a fleet now (or later with POST /driver/fleet/join).'
    FleetCodeCommand:
      type: object
      description: 'v0.5.3: POST /admin/fleets/{fleetId}/code.'
      required:
      - expectedVersion
      properties:
        expectedVersion:
          type: integer
          minimum: 1
          description: Version the caller last saw; stale → 409 version_mismatch.
    FleetReviewCommand:
      type: object
      description: 'v0.5.3: approved makes the fleet code (first approval) and lets drivers join; blocked takes every linked
        driver offline and withdraws their offers.'
      required:
      - expectedVersion
      - decision
      properties:
        expectedVersion:
          type: integer
          minimum: 1
          description: Version the caller last saw; stale → 409 version_mismatch.
        decision:
          type: string
          enum:
          - approved
          - rejected
          - blocked
        note:
          type: string
          maxLength: 1000
    ConfigDraftUpdate:
      type: object
      required:
      - expectedVersion
      - zoneId
      - document
      properties:
        expectedVersion:
          type: integer
          minimum: 1
          description: Version the caller last saw; stale → 409 version_mismatch.
        zoneId:
          $ref: '#/components/schemas/Id'
        document:
          oneOf:
          - $ref: '#/components/schemas/RiderAppConfig'
          - $ref: '#/components/schemas/DriverAppConfig'
          - $ref: '#/components/schemas/PricingDocument'
          - $ref: '#/components/schemas/DispatchDocument'
    ConfigPublishCommand:
      type: object
      required:
      - expectedVersion
      - zoneId
      properties:
        expectedVersion:
          type: integer
          minimum: 1
          description: Version the caller last saw; stale → 409 version_mismatch.
        zoneId:
          $ref: '#/components/schemas/Id'
        note:
          type: string
          maxLength: 1000
    ApprovalDecision:
      type: object
      properties:
        note:
          type: string
          maxLength: 1000
