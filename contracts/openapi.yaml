    ReminderFix:
      type: object
      description: 'Where a tap on the line goes: document = the upload guide of documentType (vehicleId for a car); info_session
        = the content slot; fleet_vehicles = My fleet › cars; pick_vehicle = the car list.'
      required:
      - target
      properties:
        target:
          type: string
          enum:
          - document
          - info_session
          - fleet_vehicles
          - pick_vehicle
          - join_fleet
          - start_company
        documentType:
          $ref: '#/components/schemas/DocumentType'
        scope:
          type: string
          enum:
          - driver
          - fleet
          - vehicle
        vehicleId:
          $ref: '#/components/schemas/Id'
        contentSlot:
          type: string
          enum:
          - driver-info-session
    DriverReminder:
      type: object
      description: 'v0.18.0: document_needed: blocks_online: a required document has none (fix: document). document_rejected:
        blocks_online: rejected; reviewNote says why (fix: document). document_expired: blocks_online when blockAtExpiry (cars:
        autoHold), else due_soon (fix: document). document_expiring: due_soon: approved, expires within the warning window
        (fix: document). document_in_review: waiting: uploaded, Movera reviews it (no fix). info_session_waiting: waiting:
        the info session (kind admin_check) is not marked held yet; status waiting_for_movera; fix: info_session (content
        slot driver-info-session "How to book your info session"). account_not_active: blocks_online: the account is pending
        / on_hold / suspended and every document is done (v0.18.3 R10: no line document_needed, document_rejected, document_expired,
        document_in_review, info_session_waiting, admin_check_waiting or vehicle_photos_needed is left); Movera activates
        it (no fix). fleet_not_approved: blocks_online: the fleet is pending / rejected / blocked (no fix). no_fleet: v0.18.3
        (owner decisions of 2026-10-30, driver group 2 re-check R4 "Red ''Join a fleet'' line (Recommended)"): blocks_online:
        an account of type driver that is in no fleet; text texts.no_fleet; fix join_fleet (My fleet › Join a fleet) and actions
        [join_fleet, start_company] (two buttons, labels texts.actions); the line goes once the driver is in a fleet (or his
        account becomes a fleet). fleet_no_approved_car: blocks_online: the fleet has no car that can be picked (approved,
        every car document approved); owner fix: fleet_vehicles (add / finish a car); member: no fix ("Your fleet has no approved
        car yet…"). no_vehicle: blocks_online: the fleet has a car that can be picked but this driver has none picked (fix:
        pick_vehicle). admin_check_waiting: waiting: a custom admin_check document not marked yet; status waiting_for_movera
        (no fix). vehicle_photos_needed: blocks_online: a car''s four photos are not all uploaded and approved (fix: document,
        the first photo missing); text "Add 4 photos of your car".'
      required:
      - kind
      - level
      properties:
        kind:
          type: string
          enum:
          - document_needed
          - document_rejected
          - document_expired
          - document_expiring
          - document_in_review
          - info_session_waiting
          - account_not_active
          - fleet_not_approved
          - no_fleet
          - fleet_no_approved_car
          - no_vehicle
          - admin_check_waiting
          - vehicle_photos_needed
        level:
          type: string
          enum:
          - blocks_online
          - due_soon
          - waiting
        scope:
          type: string
          enum:
          - driver
          - fleet
          - vehicle
        documentType:
          $ref: '#/components/schemas/DocumentType'
        documentId:
          $ref: '#/components/schemas/Id'
        vehicleId:
          $ref: '#/components/schemas/Id'
        status:
          type: string
          enum:
          - needed
          - in_review
          - approved
          - rejected
          - expired
          - expiring
          - missing
          - waiting_for_movera
          description: The shown document state (contract.json#documentStatus), e.g. waiting_for_movera.
        expiresAt:
          $ref: '#/components/schemas/Timestamp'
        daysLeft:
          type: integer
          minimum: 0
          description: whole days until expiresAt, rounded up (0 = expired).
        reviewNote:
          type: string
        fix:
          $ref: '#/components/schemas/ReminderFix'
        actions:
          type: array
          items:
            $ref: '#/components/schemas/ReminderFix'
          description: 'v0.18.3: v0.18.3 (owner decisions of 2026-10-30, driver group 2 re-check R4): DriverReminder.actions,
            when present, are the buttons of the line in order (each a ReminderFix); fix stays the tap on the line itself.
            join_fleet = My fleet › Join a fleet (code, owner''s name and e-mail); start_company = My fleet › Start my own
            company (POST /driver/fleet/start-company).'
    DriverReminderList:
      type: object
      description: 'v0.18.0 (owner items 2 and 3: "add on the home page sheet that reminder ! Dont copy it''s only example";
        "Yes, build this (Recommended)"; item 9): GET /driver/reminders → DriverReminderList, what the driver Home sheet "Important
        reminders (N)" shows, one line per issue with tap-to-fix. blocks_online lines first (red), then due_soon (orange),
        then waiting; inside a level by expiresAt then type. Also covers why an account is not active (group 1): the driver
        sees the whole app but cannot go online, with the exact reason and action.'
      required:
      - items
      - blocksOnline
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/DriverReminder'
        blocksOnline:
          type: integer
          minimum: 0
          description: Lines with level blocks_online.
    StartCompanyRequest:
      type: object
      description: 'v0.18.0: v0.18.0 (owner item 7: "First answer but his account become like fleet company account and the
        documents that already exist no need to uppload again only the new documents and procces like fleet account and wait
        for admin approv"): POST /driver/fleet/start-company { expectedVersion, company } ("Start my own company" in My fleet).
        Only an account of type driver, not on a trip (409 invalid_transition, reasons already_fleet, on_trip). The driver
        leaves his fleet (car released, offline), the account becomes type fleet with a new pending fleet he owns, and the
        account goes on_hold. Every document he has stays as it is (approved ones count, nothing is uploaded again); only
        requiredFleetDocuments he does not have yet and the new cars'' documents are needed. An admin then reviews the fleet
        (POST /admin/fleets/{fleetId}/review) and activates the account (POST /admin/drivers/{driverId}/status, the fleet
        documents checked) like a new fleet.'
      required:
      - expectedVersion
      - company
      properties:
        expectedVersion:
          type: integer
          minimum: 1
          description: Version the caller last saw; stale → 409 version_mismatch.
        company:
          $ref: '#/components/schemas/FleetCompany'
    PushWebConfig:
      type: object
      description: 'v0.18.3: the Firebase web app''s public settings.'
      required:
      - apiKey
      - appId
      - messagingSenderId
      - projectId
      properties:
        apiKey:
          type: string
          description: Public Firebase web API key (not a secret).
        appId:
          type: string
        messagingSenderId:
          type: string
        projectId:
          type: string
        authDomain:
          type: string
    PushConfig:
      type: object
      description: 'v0.18.3 (R7): GET /push/config?app=driver|rider needs no token and gives the public Firebase web settings
        so no key is kept in the apps'' code: { provider: fcm, enabled, projectId?, webConfig? { apiKey, appId, messagingSenderId,
        projectId, authDomain? } }. The server reads the web app (display name ''Movera Driver web'' / ''Movera Rider web'')
        from the Firebase Management API with its service account once and keeps it in memory. enabled false (no projectId,
        no webConfig) when the server has no Firebase settings; the app then skips push.'
      required:
