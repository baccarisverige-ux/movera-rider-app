    NearbyVehicle:
      type: object
      description: A free car near the rider (v0.5.2). Nothing that tells who drives it.
      required:
      - key
      - lat
      - lng
      properties:
        key:
          type: string
          minLength: 6
          maxLength: 32
          description: Opaque, the same for one car through the day (it changes every day), so the app can move the car smoothly
            between answers. Not a driver or vehicle id.
        lat:
          type: number
          minimum: -90
          maximum: 90
          description: Moved 100–200 m (v0.18.4, G3-D4), then rounded to 4 decimals.
        lng:
          type: number
          minimum: -180
          maximum: 180
          description: Moved 100–200 m (v0.18.4, G3-D4), then rounded to 4 decimals.
        heading:
          type: number
          minimum: 0
          maximum: 360
          description: Degrees clockwise from north, from the latest fix; absent when unknown.
    NearbyVehicleList:
      type: object
      description: 'CONTRACT.md §13: v0.5.2 (CONTRACT.md §13): the free cars near the rider, drawn on the rider''s map while
        it chooses a ride. No driver id, name, plate or trip; positions rounded; the key changes every day. v0.18.4 (G3-D4):
        positions moved 100–200 m, stable per 10 min (contract.json#driverHome.nearbyBlur). G3-D4 (owner 2026-10-30, ''Slightly
        moved''). GET /rider/nearby-vehicles never gives a driver''s exact position: each car is moved by an offset of minMeters..maxMeters
        in a direction, both taken from an HMAC of the driver id and the time slot of stableMinutes (server clock), so a car
        does not jump between answers inside a slot; the offset changes at the next slot. The answer still carries no identity
        (opaque key, contract.json#riderNearby). The exact position is shown only to the rider of a trip a driver accepted,
        through the existing trip views (TripProjection driver location).'
      required:
      - items
      - refreshSeconds
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/NearbyVehicle'
          maxItems: 15
          description: Nearest first.
        refreshSeconds:
          type: integer
          minimum: 1
          default: 5
        radiusMeters:
          type: integer
          minimum: 1
          default: 3000
    AccountDeletion:
