    CategoryPricingWaiting:
      type: object
      description: Waiting at pickup for one category; RiderAppConfig / DriverAppConfig waiting.byCategory carry the same
        values.
      required:
      - freeWaitMin
      - perMin
      - noShowAfterMin
      - noShowFee
      properties:
        freeWaitMin:
          type: number
          minimum: 0
          maximum: 30
        perMin:
          allOf:
          - $ref: '#/components/schemas/Money'
          description: Per minute after the free wait, charged per second (contract.json#pricing.waiting).
        noShowAfterMin:
          type: number
          minimum: 0
          description: Equals freeWaitMin (owner Q41).
        noShowFee:
          $ref: '#/components/schemas/Money'
    CategoryPricing:
      type: object
      description: One category's prices in a zone (admin Pricing; zonePricing.ts CategoryPrice + commission + rider pickup
        fee).
      required:
      - enabled
      - base
      - perKm
      - perMin
      - minimum
      - maximum
      - appFeePct
      - commissionPct
      - extraStopFee
      - stopWaitPerMin
      - babySeatFee
      - childSeatFee
      - waiting
      - riderPickupFee
      properties:
        enabled:
          type: boolean
          description: The category is offered in this zone.
        base:
          $ref: '#/components/schemas/Money'
        perKm:
          allOf:
          - $ref: '#/components/schemas/Money'
          description: Per km; minor units, e.g. 1200 = 12 kr/km.
        perMin:
          $ref: '#/components/schemas/Money'
        minimum:
          allOf:
          - $ref: '#/components/schemas/Money'
          description: The ride part is raised to this (minimum_adjust line).
        maximum:
          oneOf:
          - $ref: '#/components/schemas/Money'
          - type: 'null'
          description: The ride part is lowered to this (maximum_adjust line); null = no maximum (the admin's 0).
        appFeePct:
          type: number
          minimum: 0
          maximum: 50
          description: 'Added to the rider''s price: % of ride part + extras. Movera keeps it.'
        commissionPct:
          type: number
          minimum: 0
          maximum: 60
          description: Movera's commission on the ride part and the extras except waiting (owner decisions 17, 18).
        extraStopFee:
          $ref: '#/components/schemas/Money'
        stopWaitPerMin:
          allOf:
          - $ref: '#/components/schemas/Money'
          description: Waiting at a stop after stopFreeWaitMin, per minute, charged per second.
        babySeatFee:
          $ref: '#/components/schemas/Money'
        childSeatFee:
          $ref: '#/components/schemas/Money'
        waiting:
          $ref: '#/components/schemas/CategoryPricingWaiting'
        riderPickupFee:
          $ref: '#/components/schemas/RiderPickupFee'
    PricingFees:
      type: object
      required:
      - airportPickup
      - airportDropoff
      - reservationFee
      - cleaningFee
      - tollsPassThrough
      properties:
        airportPickup:
          $ref: '#/components/schemas/Money'
        airportDropoff:
          $ref: '#/components/schemas/Money'
        reservationFee:
          allOf:
          - $ref: '#/components/schemas/Money'
          description: Added to kind=scheduled trips (reservation_fee line).
        cleaningFee:
          allOf:
          - $ref: '#/components/schemas/Money'
          description: Charged afterwards by an admin adjust; not in the fare formula.
        tollsPassThrough:
          type: boolean
          description: Tolls added to the fare; no tolls are priced in v0.5.1.
    FixedRoute:
      type: object
      description: 'A fixed price between two admin-named places: replaces base + distance + time; no surge, minimum or maximum.'
      required:
      - id
      - from
      - to
      - categoryId
      - price
      properties:
        id:
          $ref: '#/components/schemas/Id'
        from:
          type: string
          minLength: 1
        to:
          type: string
          minLength: 1
        categoryId:
          $ref: '#/components/schemas/CategoryId'
        price:
          $ref: '#/components/schemas/Money'
    SurgeStep:
      type: object
      required:
      - ratio
      - multiplier
      properties:
        ratio:
          type: number
          exclusiveMinimum: 0
          description: Requests per free driver at which this step starts.
        multiplier:
          type: number
          minimum: 1
    SurgeProfile:
      type: object
      required:
      - id
      - name
      - days
      - windows
      - steps
      - cap
      - isDefault
      properties:
        id:
          type: string
          minLength: 1
        name:
          type: string
        days:
          type: array
          items:
            type: integer
            minimum: 0
            maximum: 6
          description: 0 = Monday … 6 = Sunday.
        windows:
          type: array
          items:
            type: object
            required:
            - from
            - to
            properties:
              from:
                type: string
                pattern: ^\d\d:\d\d$
              to:
                type: string
                pattern: ^\d\d:\d\d$
        steps:
          type: array
          items:
            $ref: '#/components/schemas/SurgeStep'
        cap:
          type: number
          minimum: 1
        isDefault:
          type: boolean
    SmartSurge:
      type: object
      description: The admin's smart surge settings, kept in the document; the algorithm is not normative in v0.5.1.
      required:
      - enabled
      - profiles
      properties:
        enabled:
          type: boolean
          description: Automatic surge; false in the test week (owner decision 21).
        activeFrom:
          type: string
          pattern: ^\d\d:\d\d$
        activeTo:
          type: string
          pattern: ^\d\d:\d\d$
        checkEveryMin:
          type: integer
          minimum: 1
          maximum: 15
        holdMin:
          type: integer
          minimum: 1
          maximum: 30
        stopAfterMin:
          type: integer
          minimum: 1
          maximum: 60
        cooldownMin:
          type: integer
          minimum: 1
          maximum: 30
        profiles:
          type: array
          items:
            $ref: '#/components/schemas/SurgeProfile'
    ScheduledSurge:
      type: object
      description: A flat surge for a time window, from the pricing document.
      required:
      - id
      - multiplier
      - startsAt
      - endsAt
      properties:
        id:
          type: string
          minLength: 1
        name:
          type: string
        multiplier:
          type: number
          minimum: 1
        startsAt:
          $ref: '#/components/schemas/Timestamp'
        endsAt:
          $ref: '#/components/schemas/Timestamp'
    PricingSurge:
      type: object
      description: 'Surge sources after the zone''s surge schedule (§3.4): first match: the zone''s active surge schedule
        (§3.4, PUT /admin/zones/{zoneId}/surge), then a pricing.surge.scheduled window in force, then smart surge when smart.enabled;
        else 1.0. The quote keeps its multiplier.'
      required:
      - maxMultiplier
      - smart
      - scheduled
      properties:
        maxMultiplier:
          type: number
          minimum: 1
          maximum: 3.0
          default: 3.0
          description: 'Owner decision 21: at most ×3 (the admin slider allows 6).'
        smart:
          $ref: '#/components/schemas/SmartSurge'
        scheduled:
          type: array
          items:
            $ref: '#/components/schemas/ScheduledSurge'
    PricingDocument:
      type: object
      description: 'Server-only (contract.json#configDocs): the zone''s prices, read by the server''s quote engine. Never
        served to the apps. v0.5.1 (CONTRACT.md §3.5). The server prices every quote and fare from the zone''s pricing document
        (admin Pricing, the order of quoteRide), with owner decisions 16-21 applied. Amounts are exact until they become a
        fare line. Cases: fixtures/fares.json. Sample: fixtures/config/pricing_document.json.'
      required:
      - version
      - publishedAt
      - zoneId
      - currency
      - country
      - priceStep
      - categories
      - fees
      - stopFreeWaitMin
      - fixedRoutes
      - surge
      - fleetCommissionPct
      properties:
        version:
          type: integer
          minimum: 1
          description: Admin revision of the zone's live pricing document (contract.json#configVersion).
        publishedAt:
          $ref: '#/components/schemas/Timestamp'
        zoneId:
          $ref: '#/components/schemas/Id'
        currency:
          $ref: '#/components/schemas/CurrencyCode'
        country:
          $ref: '#/components/schemas/CountryCode'
        timeZone:
          type: string
          pattern: ^[A-Za-z_]+(/[A-Za-z0-9_+\-]+)*$
        priceStep:
          allOf:
          - $ref: '#/components/schemas/Money'
          description: The total is rounded once, half-up, to a multiple of this (admin fees.rounding).
        categories:
          type: object
          propertyNames:
            $ref: '#/components/schemas/CategoryId'
          additionalProperties:
            $ref: '#/components/schemas/CategoryPricing'
        fees:
          $ref: '#/components/schemas/PricingFees'
        stopFreeWaitMin:
          type: number
          minimum: 0
          maximum: 30
          default: 3
          description: Free minutes at each stop (owner decision 20).
        fixedRoutes:
          type: array
          items:
            $ref: '#/components/schemas/FixedRoute'
        surge:
          $ref: '#/components/schemas/PricingSurge'
        fleetCommissionPct:
          type: number
          minimum: 0
          maximum: 30
          description: Fleet owner's share (admin Pricing); not in the rider's fare.
      x-server-only: true
    DispatchModeRules:
      type: object
      description: 'Radar: then is widen | exclusive | widen_then_exclusive. Exclusive: then is radar | widen | widen_then_radar.'
      required:
      - 'on'
      - drivers
      - seconds
      - then
      properties:
        'on':
          type: boolean
        drivers:
          type: integer
          minimum: 1
          maximum: 30
          description: 'radar: shown at once (1-30); exclusive: tried one after the other per radius step (1-10).'
        seconds:
          type: integer
          minimum: 5
          maximum: 120
          description: radar 5-120, exclusive 5-60.
        then:
          type: string
          enum:
          - exclusive
          - radar
          - widen
          - widen_then_exclusive
          - widen_then_radar
    DispatchTimeRule:
      type: object
      description: Zone-local [from, to); wraps midnight when from > to.
      required:
      - id
      - 'on'
      - from
      - to
      - mode
      properties:
        id:
          type: string
          minLength: 1
        'on':
          type: boolean
        from:
          type: string
          pattern: ^\d\d:\d\d$
        to:
          type: string
          pattern: ^\d\d:\d\d$
        mode:
          type: string
          enum:
          - radar
          - exclusive
    DispatchChoose:
      type: object
      required:
      - how
      - radarAbove
      - main
      - backup
      - times
      properties:
        how:
          type: string
          enum:
          - auto
          - manual
        radarAbove:
          type: number
          exclusiveMinimum: 0
          maximum: 10
          description: Busy level (requests per free driver) from which Auto uses Radar.
        main:
          type: string
          enum:
          - radar
          - exclusive
        backup:
          type: string
          enum:
          - radar
          - exclusive
          - none
          description: 'Ignored in v0.5.1: `then` decides fallbacks.'
        times:
          type: array
          items:
            $ref: '#/components/schemas/DispatchTimeRule'
    DispatchFactor:
      type: object
      required:
      - id
      - 'on'
      - weight
      properties:
        id:
          type: string
          enum:
          - eta
          - rating
          - acceptance
          - cancel
          - idle
          - finishing
          - favourite
        'on':
          type: boolean
        weight:
          type: number
          minimum: 0
    DispatchWaitingStep:
      type: object
      required:
      - id
      - kind
      - 'on'
      - afterMin
      - message
      properties:
        id:
          type: string
          minLength: 1
        kind:
          type: string
          enum:
          - raise_price
          - upgrade
          - alert_admin
          - keep_waiting
          - busy
          x-skipped-in-test-week:
          - raise_price
          - upgrade
        'on':
          type: boolean
        afterMin:
          type: number
          minimum: 0
          maximum: 30
          description: From search start.
        message:
          type: string
        extraMin:
          type:
          - number
          - 'null'
          description: 'keep_waiting: minutes added on Keep waiting.'
    DispatchDocument:
      type: object
      description: 'Server-only (contract.json#configDocs): the zone''s automatic dispatch rules (admin Dispatch, a subset
        of the movera.dispatch.rules export, admin field names). Never served to the apps; DriverAppConfig.offers timers must
        equal radar/exclusive seconds and on. Algorithm: contract.json#dispatch, CONTRACT.md §3.6. Sample: fixtures/config/dispatch_document.json.'
      required:
      - version
      - publishedAt
      - zoneId
      - country
      - timeZone
      - radar
      - exclusive
      - choose
      - radius
      - factors
      - finishing
      - favourite
      - exclusiveWhileDriving
      - waiting
      properties:
        version:
          type: integer
          minimum: 1
          description: Admin revision of the zone's live dispatch document (contract.json#configVersion).
        publishedAt:
          $ref: '#/components/schemas/Timestamp'
        zoneId:
          $ref: '#/components/schemas/Id'
        country:
          $ref: '#/components/schemas/CountryCode'
        timeZone:
          type: string
          pattern: ^[A-Za-z_]+(/[A-Za-z0-9_+\-]+)*$
          description: IANA zone for the time rules.
        radar:
          $ref: '#/components/schemas/DispatchModeRules'
        exclusive:
          $ref: '#/components/schemas/DispatchModeRules'
        choose:
          $ref: '#/components/schemas/DispatchChoose'
        rulesFrom:
          type: string
          enum:
          - driver
          - pickup
          description: 'Kept, ignored in v0.5.1: the pickup zone''s document governs the search.'
        radius:
          type: object
          required:
          - steps
          - maxWaitMin
          properties:
            steps:
              type: array
              items:
                type: number
                exclusiveMinimum: 0
                maximum: 50
              minItems: 1
              description: km, strictly increasing.
            maxWaitMin:
              type: integer
              minimum: 1
              maximum: 30
        factors:
          type: array
          items:
            $ref: '#/components/schemas/DispatchFactor'
          minItems: 1
        finishing:
          type: object
          required:
          - exclusive
          - withinMin
          - withinKm
          properties:
            exclusive:
              type: boolean
            withinMin:
              type: number
              minimum: 0
            withinKm:
              type: number
              minimum: 0
        favourite:
          type: object
          required:
          - 'on'
          - maxKm
          properties:
            'on':
              type: boolean
            maxKm:
              type: number
              minimum: 0
        exclusiveWhileDriving:
          $ref: '#/components/schemas/ExclusiveWhileDriving'
        waiting:
          type: array
          items:
            $ref: '#/components/schemas/DispatchWaitingStep'
      x-server-only: true
      x-ranges:
        radar.drivers:
        - 1
        - 30
        radar.seconds:
        - 5
        - 120
        exclusive.drivers:
        - 1
        - 10
        exclusive.seconds:
        - 5
        - 60
        choose.radarAbove: '> 0 and <= 10'
        radius.steps: '> 0 and <= 50 km, strictly increasing'
        radius.maxWaitMin:
        - 1
        - 30
        waiting[].afterMin:
        - 0
        - 30
        factors: at least one on with weight > 0
        exclusiveWhileDriving.count:
        - 1
        - 5
        other: auto needs both modes on; manual main must be on; every on time rule needs from != to (HH:MM) and its mode
          on
    DispatchControl:
      type: object
      description: 'Live dispatch switch of a zone (outside publishing). DispatchControl { zoneId, paused, mode: radar | exclusive
        | null, by, at, version } is live state, outside publishing. PUT /admin/zones/{zoneId}/dispatch-control (dispatch.edit).
        Pausing or forcing a mode by an admin who is not Super admin is 202 pending_approval (owner decision 14); resume and
        back to rules apply at once for everyone (the admin panel''s rule).'
      required:
      - zoneId
      - paused
      - mode
      - version
      properties:
        zoneId:
          $ref: '#/components/schemas/Id'
        paused:
          type: boolean
          description: No automatic offers; waiting steps and the search end keep running.
        mode:
          oneOf:
          - type: string
            enum:
            - radar
            - exclusive
          - type: 'null'
          description: Forced mode for new searches; null = the rules.
        by:
          $ref: '#/components/schemas/Id'
        at:
          $ref: '#/components/schemas/Timestamp'
        version:
          type: integer
          minimum: 0
    DispatchControlCommand:
