  /admin/zones/{zoneId}/dispatch-control:
    get:
      operationId: adminGetDispatchControl
      summary: The zone's live dispatch switch
      tags:
      - Admin · Dispatch
      x-actor:
      - admin
      x-permission: trips.read
      parameters:
      - $ref: '#/components/parameters/ZoneId'
      - $ref: '#/components/parameters/RequestId'
      - $ref: '#/components/parameters/ApiVersion'
      responses:
        '200':
          description: OK
          headers:
            X-Request-Id:
              description: Echo of the request id (server-generated if absent).
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DispatchControl'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
    put:
      operationId: adminPutDispatchControl
      summary: Pause dispatch or force a mode in a zone
      description: 'CONTRACT.md §3.6. Pause or force a mode: Super admin at once (200), others 202 pending_approval (owner
        decision 14). Resume / back to rules (paused false, mode null): 200 for everyone. Forcing a mode that is off → 400
        invalid_request (mode_off). Running searches stop new offers while paused; a forced mode applies to new searches.'
      tags:
      - Admin · Dispatch
      x-actor:
      - admin
      x-permission: dispatch.edit
      parameters:
      - $ref: '#/components/parameters/ZoneId'
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/RequestId'
      - $ref: '#/components/parameters/ApiVersion'
      requestBody:
