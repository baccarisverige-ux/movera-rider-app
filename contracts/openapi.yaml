      - Auth
      x-actor:
      - rider
      - driver
      parameters:
      - $ref: '#/components/parameters/RequestId'
      - $ref: '#/components/parameters/ApiVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OtpRequest'
      responses:
        '200':
          description: OK
          headers:
            X-Request-Id:
              description: Echo of the request id (server-generated if absent).
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OtpChallenge'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
      security: []
  /auth/otp/verify:
    post:
      operationId: verifyOtp
      summary: Verify the code and sign in
      description: Wrong code → 400 invalid_request (reason invalid_otp_code; retryable until maxAttempts); unknown session
        → 400 invalid_request (reason invalid_otp_session); expired session → 410 otp_expired; too many attempts → 429. With
        a linkToken the verified phone is linked to the provider account.
