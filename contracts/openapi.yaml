    ConfigDraft:
      type: object
      description: 'v0.8.0: zoneId for a zone''s document, country for a country''s standard or country_rules (v0.8.0: GET,
        PUT and POST …/publish on /admin/config/{doc} name exactly one of zoneId (the zone''s own document) or country (ISO
        alpha-2; the country''s standard). Both or neither → 400 invalid_request (reason scope_required). v0.8.1: country_rules
        too may name a zoneId (the zone''s own tips and limits) or a country (its standard). A country scope is open to any
        admin who covers at least one zone of that country and holds the document''s permission (owner 2026-10-27).)'
      required:
      - doc
      - version
      - liveVersion
      - document
      - updatedAt
      properties:
        doc:
          $ref: '#/components/schemas/ConfigDocName'
        zoneId:
          $ref: '#/components/schemas/Id'
        country:
          $ref: '#/components/schemas/CountryCode'
        usesStandard:
          type: boolean
          description: 'v0.8.0: the zone has no own published document of this kind and uses its country''s standard (configDocs.standard);
            the draft starts from the standard.'
        version:
          type: integer
          minimum: 1
          description: Draft version (expectedVersion for PUT/publish).
        liveVersion:
          type: integer
          minimum: 0
          description: Version of the published document the apps read.
        document:
          oneOf:
          - $ref: '#/components/schemas/RiderAppConfig'
          - $ref: '#/components/schemas/DriverAppConfig'
          - $ref: '#/components/schemas/PricingDocument'
          - $ref: '#/components/schemas/DispatchDocument'
          - $ref: '#/components/schemas/CountryRules'
          - $ref: '#/components/schemas/OnboardingSettings'
        updatedAt:
          $ref: '#/components/schemas/Timestamp'
        updatedBy:
          $ref: '#/components/schemas/Id'
    ConfigPublication:
      type: object
      required:
      - doc
      - version
      - publishedAt
      properties:
        doc:
          $ref: '#/components/schemas/ConfigDocName'
        zoneId:
          $ref: '#/components/schemas/Id'
        country:
          $ref: '#/components/schemas/CountryCode'
        version:
          type: integer
          minimum: 1
          description: Stamped by the server (contract.json#configVersion).
        publishedAt:
          $ref: '#/components/schemas/Timestamp'
    CountryRules:
      type: object
      description: 'v0.8.1, server-only, per zone or per country (its standard): v0.8.1 (owner 2026-10-28: Tips & limits apply
        only to the zones chosen at the top; for the whole country the admin chooses all zones): tips, raiseSteps and driverBonus
        are the country_rules document { version, publishedAt, country, currency, tips: [AmountOption], raiseSteps: [AmountOption],
        driverBonus: { defaultLimit, hardMax } }, like the other documents published per zone (?zoneId, the zone''s own) or
        per country (?country, the country''s standard). A zone''s rules are its own once published for it, else its country''s
        standard (usesStandard: true); a zone with its own rules never uses the standard again until ''Go back to Standard''
        (useStandard, also for country_rules). Publishing a zone''s own rules writes, in the same transaction, RiderAppConfig.tips
        / raiseSteps and DriverAppConfig.driverBonus of that zone''s live and draft app documents; a zone that uses the standard
        app documents gets its own, copied from the standard with the new values (as publishPricing does), each changed one
        as its next version with config_published. Publishing the standard rules writes them into the standard app documents
        and into the own app documents of every zone of the country that has no own rules; zones with their own rules keep
        them. While a zone''s rules (own or standard) are live, PUT and publish of that zone''s app documents take those three
        fields from them, whatever the admin sent; the dispatch driver bonus limit of a trip is its zone''s rules. The admin
        panel publishes to exactly the zones chosen at the top (''All zones'' = every zone of the country it may work in,
        each as its own) and to the standard only when it is chosen.'
      required:
      - version
      - publishedAt
      - country
      - currency
      - tips
      - raiseSteps
      - driverBonus
      properties:
        version:
          type: integer
          minimum: 1
          description: Stamped by the server.
        publishedAt:
          $ref: '#/components/schemas/Timestamp'
        country:
          $ref: '#/components/schemas/CountryCode'
        currency:
          $ref: '#/components/schemas/CurrencyCode'
        tips:
          type: array
          items:
            $ref: '#/components/schemas/AmountOption'
        raiseSteps:
          type: array
          items:
            $ref: '#/components/schemas/AmountOption'
        driverBonus:
          $ref: '#/components/schemas/DriverBonusLimits'
      x-server-only: true
    FeeRule:
      type: object
      required:
      - freeMin
      - type
      - value
      - min
      - max
      description: 'Cancel fee rule. live: freeMin = minutes after accept; reservation: freeMin = minutes before pickup. fixed:
        value is minor units; percent: value is 0–100 of the fare, rounded half-up to a whole minor unit, then clamped to
        min/max.'
      properties:
        freeMin:
          type: integer
          minimum: 0
        type:
          type: string
          enum:
          - fixed
          - percent
        value:
          type: number
          minimum: 0
        min:
          oneOf:
          - $ref: '#/components/schemas/Money'
          - type: 'null'
        max:
          oneOf:
          - $ref: '#/components/schemas/Money'
          - type: 'null'
      allOf:
      - if:
          properties:
            type:
              const: percent
          required:
          - type
        then:
          properties:
            value:
              maximum: 100
      - if:
          properties:
            type:
              const: fixed
          required:
          - type
        then:
          properties:
            value:
              type: integer
    CancelFeeTable:
      type: object
      description: FeeRule per categoryId.
      propertyNames:
        $ref: '#/components/schemas/CategoryId'
      additionalProperties:
        $ref: '#/components/schemas/FeeRule'
    CancelFees:
      type: object
      properties:
        live:
          $ref: '#/components/schemas/CancelFeeTable'
        reservation:
          $ref: '#/components/schemas/CancelFeeTable'
        driverSharePct:
          type: number
          minimum: 0
          maximum: 100
          default: 100
          description: 'DriverAppConfig only. v0.8.0 (owner 2026-10-27): DriverAppConfig.cancelFees.driverSharePct, set in
            Admin › Dispatch per zone: the driver''s share of a rider''s cancel fee, 0–100, default 100. Movera keeps the
            rest.'
    LocalizedLine:
      type: object
      description: 'v0.7.1: a short text in each app language.'
      properties:
        sv:
          type: string
          maxLength: 80
        fr:
          type: string
          maxLength: 80
        en:
          type: string
          maxLength: 80
    CategoryCatalog:
      type: object
      required:
      - categories
      properties:
        categories:
          type: array
          items:
            type: object
            required:
            - id
            - label
            - seats
            - sort
            properties:
              id:
                $ref: '#/components/schemas/CategoryId'
              label:
                type: string
              seats:
                type: integer
                minimum: 1
              sort:
                type: integer
              line:
                allOf:
                - $ref: '#/components/schemas/LocalizedLine'
                description: 'v0.7.1: the sub-line under the name (admin Manage categories), e.g. Movera XL — up to 6 people;
                  the rider app shows it.'
    AppUpdate:
      type: object
      description: Below minimumVersion = forced update; below latestVersion = soft update.
      properties:
        minimumVersion:
          type: string
          pattern: ^\d+\.\d+\.\d+$
        latestVersion:
          type: string
          pattern: ^\d+\.\d+\.\d+$
        storeUrl:
          type: string
          format: uri
    RideCheck:
      type: object
      description: Ride check thresholds (Safety).
      properties:
        stopMinutes:
          type: number
          minimum: 0
        offRouteKm:
          type: number
          minimum: 0
    CategoryWaiting:
      type: object
      description: Waiting terms of one category. Default free wait 5 min, xl 3 min (contract.json#configDefaults).
      properties:
        freeWaitMin:
          type: number
          minimum: 0
        perMin:
          allOf:
          - $ref: '#/components/schemas/Money'
          description: Waiting fee per minute after the free wait.
        noShowAfterMin:
          type: number
          minimum: 0
          description: 'Equals freeWaitMin (owner Q41): the no-show button appears when the free wait ends.'
        noShowFee:
          $ref: '#/components/schemas/Money'
    RiderWaiting:
      type: object
      description: Top-level terms are the headline category's (economy, else the first).
      properties:
        freeWaitMin:
          type: number
          minimum: 0
        perMin:
          $ref: '#/components/schemas/Money'
        noShowAfterMin:
          type: number
          minimum: 0
        noShowFee:
          $ref: '#/components/schemas/Money'
        byCategory:
          type: object
          description: CategoryWaiting per categoryId.
          propertyNames:
            $ref: '#/components/schemas/CategoryId'
          additionalProperties:
            $ref: '#/components/schemas/CategoryWaiting'
    DriverWaiting:
      allOf:
      - $ref: '#/components/schemas/RiderWaiting'
      - type: object
        properties:
          driverSharePct:
            type: number
            minimum: 0
            maximum: 100
            description: Driver's share of the no-show fee, per country (default 80).
          driverShareWaitPct:
            type: number
            minimum: 0
            maximum: 100
            description: Driver's share of the waiting fee (100).
    AmountOption:
      type: object
      description: One admin-editable amount (tip or raise-offer step) in the zone's currency.
      required:
      - amount
      - enabled
      properties:
        amount:
          $ref: '#/components/schemas/Money'
        enabled:
          type: boolean
          description: Disabled options are not shown.
    Languages:
      type: object
      description: App languages and the country's default per app (owner Q48/Q49).
      required:
      - available
      - default
      properties:
        available:
          type: array
          items:
            $ref: '#/components/schemas/Language'
          uniqueItems: true
          minItems: 1
        default:
          type: object
          required:
          - rider
          - driver
          - admin
          properties:
            rider:
              $ref: '#/components/schemas/Language'
            driver:
              $ref: '#/components/schemas/Language'
            admin:
              $ref: '#/components/schemas/Language'
    DriverBonusLimits:
      type: object
      description: Movera-paid driver bonus ("add money to trip") limits per country.
      required:
      - defaultLimit
      - hardMax
      properties:
        defaultLimit:
          allOf:
          - $ref: '#/components/schemas/Money'
          description: Above this the admin is told to adjust the limit in Pricing.
        hardMax:
          allOf:
          - $ref: '#/components/schemas/Money'
          description: The limit can never be set above this.
    ReservationRideType:
      type: object
      description: Times for one kind of scheduled ride.
      properties:
        onlineBeforeMin:
          type: integer
          minimum: 5
          maximum: 240
          description: Be online this many minutes before pickup.
        spareMin:
          type: integer
          minimum: 0
          maximum: 60
          description: Spare minutes in the smart gap and in Leave now.
        reminderMin:
          type: array
          items:
            type: integer
            minimum: 1
            maximum: 1440
          description: Reminder times, minutes before pickup, largest first.
          maxItems: 4
    LateEta:
      type: object
      description: 'Running late: an online driver who would arrive more than toleranceMin late loses the ride early. Otherwise
        an online driver keeps it.'
      properties:
        'on':
          type: boolean
          description: Watch an online driver's ETA from Leave now until arrival at the pickup.
          default: true
        toleranceMin:
          type: integer
          minimum: 0
          maximum: 30
          description: Reassign when now + ETA > pickup time + toleranceMin.
          default: 3
        checkEverySeconds:
          type: integer
          minimum: 15
          maximum: 600
          description: How often the ETA is checked.
          default: 60
        reassignTo:
          type: string
          enum:
          - exclusive
          - radar
          - dispatch
          description: exclusive = Exclusive offer to the nearest available driver; radar = Radar trips; dispatch = back to
            admin dispatch.
          default: exclusive
    DriverReservations:
      type: object
      description: Scheduled-ride rules for the driver app (CONTRACT.md §6). Every field is optional; a missing or invalid
        one keeps the default (contract.json#configDefaults.reservations).
      properties:
        'on':
          type: boolean
          description: 'Reservations for every driver in this zone (same value as features.scheduledRides). Off: no new reservations;
            accepted ones still run.'
          default: true
        lateWarn:
          type: boolean
          description: Island warning "Head to your 07:40 pickup" when Leave now cannot start the trip (driver offline, or
            busy with another screen). Leave now itself always opens the trip; there is no switch for it (v0.4.2).
          default: true
        offlineBackupAfterMin:
          type: integer
          minimum: 1
          maximum: 60
          description: Only an OFFLINE driver loses the ride, this many minutes after Leave now; an online driver keeps it.
          default: 5
        homePopupAfterMin:
          type: integer
          minimum: 1
          maximum: 1440
          description: 'Untaken: the Home popup this many minutes after booking.'
          default: 10
        exclusiveBeforeMin:
          type: integer
          minimum: 1
          maximum: 180
          description: 'Untaken: Exclusive from this many minutes before pickup.'
          default: 20
        radarBeforeMin:
          type: integer
          minimum: 1
          maximum: 180
          description: 'Untaken: Radar trips from this many minutes before pickup.'
          default: 15
        onDriverCancel:
          type: string
          enum:
          - byTime
          - list
          - home
          - exclusive
          description: Where a ride goes after a driver cancels.
          default: byTime
        hideClashing:
          type: boolean
          description: Rides that do not fit the smart gap leave the driver's Scheduled rides list once they take one.
          default: true
        towardPickup:
          type: boolean
          description: Before the ride, offers head toward the scheduled pickup.
          default: true
        towardPickupBeforeMin:
          type: integer
          minimum: 15
          maximum: 240
          default: 60
        longTripKm:
          type: number
          minimum: 10
          maximum: 500
          description: A ride longer than this is a longTrip.
          default: 50
        driverLateCancelHours:
          type: number
          minimum: 0.5
          maximum: 72
          description: A driver cancel with less than this many hours to pickup is a late cancel.
          default: 1
        lateCancelLimit:
          type: integer
          minimum: 1
          maximum: 20
          description: Late cancels within lateCancelPeriodDays before a pause.
          default: 2
        lateCancelPeriodDays:
          type: integer
          minimum: 1
          maximum: 90
          default: 7
        pauseDays:
          type: integer
          minimum: 1
          maximum: 365
          description: No scheduled rides for this many days after the limit.
          default: 7
        assignAcceptSeconds:
          type: integer
          minimum: 10
          maximum: 600
          description: Time to accept a ride assigned by Movera.
          default: 30
        rideTypes:
          type: object
          description: Per kind of ride. Admin ids long and premium are longTrip and comfortPremium.
          properties:
            normal:
              $ref: '#/components/schemas/ReservationRideType'
            airport:
              $ref: '#/components/schemas/ReservationRideType'
            longTrip:
              $ref: '#/components/schemas/ReservationRideType'
            comfortPremium:
              $ref: '#/components/schemas/ReservationRideType'
            event:
              $ref: '#/components/schemas/ReservationRideType'
        lateEta:
          $ref: '#/components/schemas/LateEta'
    PickupRange:
      type: object
      description: 'One pickup-distance range (contract.json#pickupPay.ranges): the first starts at 0, each next one where
        the one before ends.'
      required:
      - fromKm
      - toKm
      - perKm
      - perMin
      properties:
        fromKm:
          type: number
          minimum: 0
        toKm:
          type:
          - number
          - 'null'
          description: null = and above (last range only).
        perKm:
          $ref: '#/components/schemas/Money'
        perMin:
          $ref: '#/components/schemas/Money'
    RiderPickupFee:
      type: object
      description: 'The rider''s fixed pickup fee for one category: live rides (Radar and Exclusive) and reservations; null
        = off. Goes into the quote as the pickup_fee line; Movera keeps it.'
      required:
      - live
      - reservation
      properties:
        live:
          oneOf:
          - $ref: '#/components/schemas/Money'
          - type: 'null'
        reservation:
          oneOf:
          - $ref: '#/components/schemas/Money'
          - type: 'null'
    PickupPayRate:
      type: object
      description: 'One category''s pickup pay (Admin Pricing › Pickup pay). PickupRange { fromKm, toKm: number|null, perKm:
        Money, perMin: Money }. The first starts at 0, each next one starts where the one before ends, only the last may be
        open (toKm null). A km is paid at the rate of the range it is in; a leg beyond a closed last range uses the last range.
        The minutes are split across the ranges in proportion to the km in each (0 km: all in the first range). Rounding:
        each range part: half_up(km × perKm) + half_up(minutes × perMin) in minor units; the parts add up; then min(total,
        maxPerRide). Cases: fixtures/pickup_pay.json.'
      required:
      - enabled
      - maxPerRide
      - ranges
      - riderFee
      properties:
        enabled:
          type: boolean
          description: Driver pickup pay on or off for the category.
        maxPerRide:
          oneOf:
          - $ref: '#/components/schemas/Money'
          - type: 'null'
          description: The driver never gets more than this for one pickup; null = no maximum.
        ranges:
          type: array
          items:
            $ref: '#/components/schemas/PickupRange'
          minItems: 1
        riderFee:
          $ref: '#/components/schemas/RiderPickupFee'
    PickupPayOffers:
      type: object
      description: 'offers[kind] switches each kind on or off (Admin Pricing › Pickup pay). scheduled = a reservation the
        driver took from the Scheduled rides list: never pickup pay. nextTrip = an offer while driving a rider: the leg is
        from the current drop-off.'
      required:
      - radar
      - exclusive
      - exclusiveReservation
      - assigned
      - nextTrip
      properties:
        radar:
          type: boolean
        exclusive:
          type: boolean
        exclusiveReservation:
          type: boolean
        assigned:
          type: boolean
        nextTrip:
          type: boolean
    DriverPickupPay:
      type: object
      description: 'DriverAppConfig.pickupPay (v0.5.0, CONTRACT.md §3.2). v0.5.0 (CONTRACT.md §3.2). Two sides. Rider: a fixed
        pickup fee per category, one amount for live rides (Radar and Exclusive), one for reservations, each on or off (null
        = off), in the rider''s fare as the pickup_fee line; it never depends on the driver. Driver: Movera pays the drive
        to the pickup from its share, per category: tiered km ranges and an optional maximum per ride; the driver sees the
        total only (display total). The server works it out from the driver''s location when the offer is made and sends it
        as Offer.pickupPay; the apps'' own maths (fixtures/pickup_pay.json) is for demo offers and checks.'
      required:
      - offers
      - display
      - byCategory
      properties:
        offers:
          $ref: '#/components/schemas/PickupPayOffers'
        display:
          type: string
          enum:
          - total
        byCategory:
          type: object
          description: PickupPayRate per categoryId; a category not listed has no pickup pay.
          propertyNames:
            $ref: '#/components/schemas/CategoryId'
          additionalProperties:
            $ref: '#/components/schemas/PickupPayRate'
        perKm:
          allOf:
          - $ref: '#/components/schemas/Money'
          deprecated: true
          description: v0.4 shape of the headline category (first paid range); removed in v0.6.
        perMin:
          allOf:
          - $ref: '#/components/schemas/Money'
          deprecated: true
        freeKm:
          type: number
          minimum: 0
          deprecated: true
        freeMin:
          type: number
          minimum: 0
          deprecated: true
        ranges:
          type: array
          items:
            $ref: '#/components/schemas/PickupRange'
          deprecated: true
          description: 'v0.4 shape: the headline category''s ranges; use byCategory.'
        maxPerRide:
          oneOf:
          - $ref: '#/components/schemas/Money'
          - type: 'null'
          deprecated: true
    RiderPickupFees:
      type: object
      description: 'RiderAppConfig.pickupFee (v0.5.0): the fixed pickup fees the quote''s pickup_fee line carries, so the
        app can name them; the server prices.'
      required:
      - byCategory
      properties:
        byCategory:
          type: object
          description: RiderPickupFee per categoryId.
          propertyNames:
            $ref: '#/components/schemas/CategoryId'
          additionalProperties:
            $ref: '#/components/schemas/RiderPickupFee'
    RadarAppLimits:
      type: object
      description: 'Radar offers one driver sees at once (Admin Dispatch › Modes; contract.json#driverMotion, v0.5.0). Defaults:
        {"fullOn": true, "full": 8, "fullLockWhileDriving": true, "popupOn": true, "popup": 2, "popupSplitByDriving": false,
        "popupWhileDriving": 1}. No Radar offers while driving a rider.'
      properties:
        fullOn:
          type: boolean
          description: The full-screen Radar list is available.
        full:
          type: integer
          minimum: 1
          description: Most offers in the full-screen list.
        fullLockWhileDriving:
          type: boolean
          description: The list cannot be opened while the car is moving; it opens again once stopped.
        popupOn:
          type: boolean
          description: Offer cards over the map are shown.
        popup:
          type: integer
          minimum: 1
          description: Most cards at once while stopped.
        popupSplitByDriving:
          type: boolean
          description: The cards have their own limit while driving (popupWhileDriving); false = popup all the time.
        popupWhileDriving:
          type: integer
          minimum: 1
          description: Most cards at once while moving, 1 to popup.
    ExclusiveWhileDriving:
      type: object
      description: 'While driving a rider the driver gets Exclusive offers only, at most count at a time, never Radar (Q18).
        Defaults: {"on": true, "count": 1}.'
      properties:
        'on':
          type: boolean
        count:
          type: integer
          minimum: 1
          maximum: 5
    SurgePoint:
      type: object
      description: 'v0.7.2: SurgePoint { at (bucket start), requests (sum in the bucket), freeDrivers (average, rounded),
        ratio (average, 0.1), multiplier (highest in the bucket) }, oldest first; a bucket without samples is left out.'
      required:
      - at
      - requests
      - freeDrivers
      - ratio
      - multiplier
      properties:
        at:
          $ref: '#/components/schemas/Timestamp'
        requests:
          type: integer
          minimum: 0
        freeDrivers:
          type: integer
          minimum: 0
        ratio:
          type: number
          minimum: 0
        multiplier:
          type: number
          minimum: 1
          maximum: 6
    SurgeSchedule:
      type: object
      description: 'A surge curve over time (v0.5.0, CONTRACT.md §3.4, contract.json#surge). value at minute m = curve value
        at floor(m / stepMinutes) × stepMinutes, rounded half-up to roundTo, clamped to [minMultiplier, cap]; null before
        startAt and from endAt on. Cases: fixtures/surge.json.'
      required:
      - scheduleId
      - zoneId
      - categoryIds
      - startAt
      - endAt
      - stepMinutes
      - cap
      - points
      - status
      - version
      properties:
        scheduleId:
          $ref: '#/components/schemas/Id'
        zoneId:
          $ref: '#/components/schemas/Id'
        categoryIds:
          type: array
          items:
            $ref: '#/components/schemas/CategoryId'
          uniqueItems: true
          description: Empty = every category of the zone.
        startAt:
          $ref: '#/components/schemas/Timestamp'
        endAt:
          $ref: '#/components/schemas/Timestamp'
        stepMinutes:
          type: integer
          minimum: 1
          default: 5
        cap:
          type: number
          minimum: 1
          maximum: 6.0
          description: 'No point and no step is above this: the admin''s maximum, at most capMax (6, v0.6.0; v0.7.1: the server
            sets it to the highest point, the slider value). The quote is also kept within the zone''s pricing surge.maxMultiplier.'
        points:
          type: array
          items:
            $ref: '#/components/schemas/SurgePoint'
          minItems: 2
          description: Sorted by atMin; the first at 0, the last at the end; straight lines between.
        status:
          type: string
          enum:
          - scheduled
          - active
          - ended
          - cancelled
        version:
          type: integer
          minimum: 1
        createdBy:
          $ref: '#/components/schemas/Id'
        createdAt:
          $ref: '#/components/schemas/Timestamp'
    SurgeScheduleCommand:
      type: object
      description: Create or replace the zone's surge schedule. A flat manual surge is two points with the same multiplier.
      required:
      - expectedVersion
      - startAt
      - endAt
      - points
      properties:
        expectedVersion:
          type: integer
          minimum: 0
          description: Version of the schedule being replaced; 0 when the zone has none.
        categoryIds:
          type: array
          items:
            $ref: '#/components/schemas/CategoryId'
          uniqueItems: true
        startAt:
          $ref: '#/components/schemas/Timestamp'
        endAt:
          $ref: '#/components/schemas/Timestamp'
        stepMinutes:
          type: integer
          minimum: 1
          default: 5
        points:
          type: array
          items:
            $ref: '#/components/schemas/SurgePoint'
          minItems: 2
        note:
          type: string
          maxLength: 1000
    QuoteSurge:
      type: object
      description: The surge step this quote was priced in (v0.5.0); display only, the quote total already includes it.
      required:
      - multiplier
      properties:
        multiplier:
          type: number
          minimum: 1
        until:
          allOf:
          - $ref: '#/components/schemas/Timestamp'
          description: When the current step ends (the next step may differ); null for a flat surge.
        scheduleId:
          $ref: '#/components/schemas/Id'
    PhoneE164:
      type: string
      pattern: ^\+[1-9][0-9]{6,14}$
      description: E.164 phone number.
    OtpRequest:
      type: object
      description: 'Start a phone sign-in: the server sends the code by sms (none to a test number, contract.json#auth.testSignIn).'
      required:
      - phone
      - app
      properties:
        phone:
          $ref: '#/components/schemas/PhoneE164'
        app:
          type: string
          enum:
          - rider
          - driver
          description: Which app signs in; decides the actor of the tokens.
        linkToken:
          type: string
          minLength: 1
          description: 'From a PHONE_REQUIRED provider sign-in: links this phone to that account.'
        locale:
          $ref: '#/components/schemas/Language'
    OtpChallenge:
      type: object
      description: The code is 4 digits and lives 300 s; at most 5 attempts.
      required:
      - requestId
      - sessionId
      - expiresAt
      - retryAfterSeconds
      properties:
        requestId:
          type: string
        sessionId:
          $ref: '#/components/schemas/Id'
        expiresAt:
          $ref: '#/components/schemas/Timestamp'
        retryAfterSeconds:
          type: integer
          minimum: 0
          default: 30
    OtpVerifyRequest:
      type: object
      required:
      - phone
      - sessionId
      - code
      properties:
        phone:
          $ref: '#/components/schemas/PhoneE164'
        sessionId:
          $ref: '#/components/schemas/Id'
        code:
          type: string
          pattern: ^[0-9]{4}$
        linkToken:
          type: string
          minLength: 1
    AuthTokens:
      type: object
      description: Signed in. Actor, subject id and zone scope are inside the access token.
      required:
      - accessToken
      - refreshToken
      properties:
        accessToken:
          type: string
          minLength: 1
          description: JWT bearer token.
        refreshToken:
          type: string
          minLength: 1
          description: Opaque, rotated on every refresh.
        expiresIn:
          type: integer
          minimum: 1
          description: Access token lifetime, seconds.
          default: 900
        actor:
          type: string
          enum:
          - rider
          - driver
        isNewRider:
          type: boolean
          description: 'First sign-in: the app asks for the name.'
        isNewDriver:
          type: boolean
          description: 'First sign-in: the app starts onboarding.'
    ProviderSignInRequest:
      type: object
      required:
      - provider
      - idToken
      - app
      properties:
        provider:
          type: string
          enum:
          - apple
          - google
        idToken:
          type: string
          minLength: 1
          description: The provider's identity token, verified server-side.
        app:
          type: string
          enum:
          - rider
          - driver
        name:
          type: string
          maxLength: 120
    PhoneRequired:
      type: object
      description: 'No account is linked to this provider identity yet: verify a phone with this linkToken on the OTP calls
        and the account is created linked.'
      required:
      - code
      - linkToken
      properties:
        code:
          type: string
          const: PHONE_REQUIRED
        linkToken:
          type: string
          minLength: 1
        name:
          type: string
        firstName:
          type: string
          description: 'v0.5.3: what the provider gave, for the driver''s details screen; editable.'
        lastName:
          type: string
          description: v0.5.3
        email:
          type: string
          format: email
          description: 'v0.5.3: may be Apple''s hidden relay address; editable.'
    ProviderSignInResult:
      oneOf:
      - $ref: '#/components/schemas/AuthTokens'
      - $ref: '#/components/schemas/PhoneRequired'
      description: 'POST /auth/provider { provider, idToken, app } signs in an account already linked to that Apple / Google
        identity (AuthTokens), or answers { code: PHONE_REQUIRED, linkToken, firstName?, lastName?, email? } for a new one:
        the app then verifies a phone with the linkToken on the OTP calls (the phone is confirmed once, the first time), the
        account is created linked, and the driver app prefills its details screen with the names and e-mail the provider gave
        (Apple gives them only the first time and may give a hidden relay e-mail; all stay editable). Unset provider keys
        on the server answer 503 unavailable (provider_not_configured).'
    RefreshRequest:
      type: object
      required:
      - refreshToken
      properties:
        refreshToken:
          type: string
          minLength: 1
    WaitlistRequest:
      type: object
      description: 'v0.15.0: join the waiting list after 403 sign_in_restricted (contract.json#auth.waitlist).'
      required:
      - phone
      - app
      properties:
        phone:
          $ref: '#/components/schemas/PhoneE164'
        app:
          type: string
          enum:
          - rider
          - driver
        locale:
          $ref: '#/components/schemas/Language'
    WaitlistReceipt:
      type: object
      description: 'v0.15.0: the number is on the waiting list.'
      required:
      - status
      - requestId
      properties:
        status:
          type: string
          const: saved
        requestId:
          type: string
    WaitlistEntry:
      type: object
      description: 'v0.15.0: one number on the waiting list, per app.'
      required:
      - phone
      - app
      - firstAt
      - lastAt
      - count
      properties:
        phone:
          $ref: '#/components/schemas/PhoneE164'
        app:
          type: string
          enum:
          - rider
          - driver
        locale:
          $ref: '#/components/schemas/Language'
        firstAt:
          $ref: '#/components/schemas/Timestamp'
        lastAt:
          $ref: '#/components/schemas/Timestamp'
        count:
          type: integer
          minimum: 1
          description: How many times this number asked.
    TestAccount:
      type: object
      description: 'v0.15.0: a test number and its account''s status.'
      required:
      - phone
      - app
      - status
      properties:
        phone:
          $ref: '#/components/schemas/PhoneE164'
        app:
          type: string
          enum:
          - rider
          - driver
        status:
          type: string
          enum:
          - test
          - pending
          - active
          - on_hold
          - suspended
          description: 'test: the number has no account in that app yet (the first sign-in creates it); otherwise the account''s
            status: the driver''s accountStatus (pending, active, on_hold, suspended), the rider''s (active, suspended).'
        name:
          type: string
          description: The account's first name, when it has one.
    TestAccountList:
      type: object
      description: 'v0.15.0 (owner 2026-10-29, decision 6, "Only in test builds"): GET /auth/test-accounts → TestAccountList
        { accounts: [TestAccount { phone, app, status, name? }] } lists the test numbers with each one''s account status,
        so the sign-in screen of a staging or test build can show them. No bearer token. It exists only while MOVERA_ENV is
        not production: a production server answers 404 not_found and the store builds never call it.'
      required:
      - accounts
      properties:
        accounts:
          type: array
          items:
            $ref: '#/components/schemas/TestAccount'
    PushDeviceRequest:
      type: object
      description: POST /push/devices { token, provider, platform, appVersion?, locale? } registers the device for push, keyed
        by token and actor; POST /push/devices/unregister { token } on sign-out. The same for rider and driver.
      required:
      - token
      - provider
      - platform
      properties:
        token:
          type: string
          minLength: 1
          description: Push token from the provider.
        provider:
          type: string
          enum:
          - fcm
          - apns
        platform:
          type: string
          enum:
          - ios
          - android
          - web
        appVersion:
          type: string
          pattern: ^\d+\.\d+\.\d+$
        locale:
          $ref: '#/components/schemas/Language'
    PushDeviceAck:
      type: object
      required:
      - status
      properties:
        status:
          type: string
          enum:
          - registered
          - unregistered
        requestId:
          type: string
    PushDeviceUnregister:
      type: object
      required:
      - token
      properties:
        token:
          type: string
          minLength: 1
    RiderAppConfig:
      type: object
      description: Per-zone rider document built by Admin exporters. Unknown keys are ignored; missing keys fall back to the
        app seed.
      required:
      - version
      - publishedAt
      - zoneId
      - currency
      - timeZone
      properties:
        version:
          type: integer
          minimum: 1
          description: Stamped by the server (contract.json#configVersion); only increases; apps keep the last good document.
        publishedAt:
          $ref: '#/components/schemas/Timestamp'
        zoneId:
          $ref: '#/components/schemas/Id'
        currency:
          $ref: '#/components/schemas/CurrencyCode'
        timeZone:
          type: string
          pattern: ^[A-Za-z_]+(/[A-Za-z0-9_+\-]+)*$
          examples:
          - Europe/Stockholm
          - Europe/Paris
          - Africa/Tunis
          description: IANA zone of the zone, for wall-clock rules and booking times.
        country:
          $ref: '#/components/schemas/CountryCode'
        languages:
          $ref: '#/components/schemas/Languages'
        usesStandard:
          type: boolean
          description: 'v0.8.0: set by the server when it serves or uses the country standard for this zone (contract.json#configDocs.standard).'
        catalog:
          $ref: '#/components/schemas/CategoryCatalog'
        features:
          type: object
          properties:
            scheduledRides:
              type: boolean
            wallet:
              type: boolean
            pin:
              type: boolean
            shareTrip:
              type: boolean
          additionalProperties:
            type: boolean
        paymentMethods:
          type: array
          items:
            $ref: '#/components/schemas/ZonePaymentMethod'
          uniqueItems: true
          description: Methods offered in the zone; the wallet is separate.
        wallet:
          type: object
          properties:
            usedFirst:
              type: boolean
              description: The balance (one per currency, no conversion) pays first.
        tips:
          type: array
          items:
            $ref: '#/components/schemas/AmountOption'
          description: Tip options in admin order.
        raiseSteps:
          type: array
          items:
            $ref: '#/components/schemas/AmountOption'
          description: Raise-offer quick steps while searching, in admin order.
        promoCap:
          oneOf:
          - $ref: '#/components/schemas/Money'
          - type: 'null'
          description: Most a promotion may take off one trip in this country; null = no cap set.
        pickupFee:
          $ref: '#/components/schemas/RiderPickupFees'
        booking:
          type: object
          properties:
            maxStops:
              type: integer
              minimum: 0
              maximum: 10
            bookingHorizonDays:
              type: integer
              minimum: 0
            maxPickupMoveMeters:
              type: integer
              minimum: 0
              description: How far the rider may move the pickup after accept; further = cancel and rebook.
        cancelFees:
          $ref: '#/components/schemas/CancelFees'
        waiting:
          $ref: '#/components/schemas/RiderWaiting'
        cancelReasons:
          type: array
          items:
            type: object
            required:
            - code
            - title
            properties:
              code:
                $ref: '#/components/schemas/RiderCancelReasonCode'
              title:
                type: string
                minLength: 1
        rideCheck:
          $ref: '#/components/schemas/RideCheck'
        appUpdate:
          $ref: '#/components/schemas/AppUpdate'
    DriverAppConfig:
      type: object
      description: Per-zone driver document built by Admin exporters. Unknown keys are ignored; missing keys fall back to
        the app seed.
      required:
      - version
      - publishedAt
      - zoneId
      - currency
      - timeZone
      properties:
        version:
          type: integer
          minimum: 1
          description: Stamped by the server (contract.json#configVersion); only increases; apps keep the last good document.
        publishedAt:
          $ref: '#/components/schemas/Timestamp'
        zoneId:
          $ref: '#/components/schemas/Id'
        currency:
          $ref: '#/components/schemas/CurrencyCode'
        timeZone:
          type: string
          pattern: ^[A-Za-z_]+(/[A-Za-z0-9_+\-]+)*$
          examples:
          - Europe/Stockholm
          - Europe/Paris
          - Africa/Tunis
          description: IANA zone of the zone, for wall-clock rules and booking times.
        country:
          $ref: '#/components/schemas/CountryCode'
        languages:
          $ref: '#/components/schemas/Languages'
        usesStandard:
          type: boolean
          description: 'v0.8.0: set by the server when it serves or uses the country standard for this zone (contract.json#configDocs.standard).'
        catalog:
          $ref: '#/components/schemas/CategoryCatalog'
        features:
          type: object
          properties:
            scheduledRides:
              type: boolean
            performance:
              type: boolean
          additionalProperties:
            type: boolean
        paymentMethods:
          type: array
          items:
            $ref: '#/components/schemas/ZonePaymentMethod'
          uniqueItems: true
          description: Methods offered in the zone; the wallet is separate.
        booking:
          type: object
          properties:
            maxStops:
              type: integer
              minimum: 0
              maximum: 10
            maxPickupMoveMeters:
              type: integer
              minimum: 0
              description: Pickup move limit after accept; the driver is notified of a move.
        offers:
          type: object
          properties:
            radarSeconds:
              type: integer
              minimum: 1
            exclusiveSeconds:
              type: integer
              minimum: 1
            radarOn:
              type: boolean
              description: Radar offers in this zone (v0.5.0).
            exclusiveOn:
              type: boolean
              description: Exclusive offers in this zone (v0.5.0).
            assignAcceptSeconds:
              type: integer
              minimum: 1
              description: Time to accept a ride assigned by Movera (v0.5.0; also reservations.assignAcceptSeconds).
            radarApp:
              $ref: '#/components/schemas/RadarAppLimits'
            exclusiveWhileDriving:
              $ref: '#/components/schemas/ExclusiveWhileDriving'
            offerCard:
              type: object
              description: Which fields the offer card shows.
              properties:
                netFare:
                  type: boolean
                pickupAddress:
                  type: boolean
                dropoffAreaOnly:
                  type: boolean
                stops:
                  type: boolean
              additionalProperties:
                type: boolean
            exclusiveReasons:
              type: array
              items:
                type: object
                required:
                - id
                - text
                - 'on'
                properties:
                  id:
                    type: string
                    pattern: ^[a-z][a-z0-9_-]{0,63}$
                  text:
                    type: string
                  'on':
                    type: boolean
            autoOffline:
              type: object
              properties:
                missedExclusive:
                  type: integer
                  minimum: 0
                  description: 'Missed or declined exclusive offers in a row before the driver is set offline (default 10,
                    owner decision 35; 3 before v0.5.6). v0.8.0 (owner 2026-10-27): a driver goes offline after offers.autoOffline.missedExclusive
                    (default 10) Exclusive offers of live trips in a row that were declined or expired. Only kind=exclusive
                    offers of live trips sent while the driver was free count; an Exclusive offer sent while the driver is
                    on a trip never counts; Radar, assigned and reservation (scheduled) offers declined or expired never count.
                    ANY accepted offer (Exclusive or Radar, any kind) and going online set the count back to 0. Both the server
                    (it sets onlineStatus offline and marks the offer event driverOffline: true) and the driver app enforce
                    it; fixtures/settings_flow.json#autoOffline.'
                noFixMinutes:
                  type: integer
                  minimum: 0
                  description: 'v0.18.4 (G3-R1): no position for this many minutes while online (not on a trip) → the server
                    sets the driver offline (default 5; 0 = never). G3-R1 + decision 3. Server: a driver whose onlineStatus
                    is online (not on_trip, no active trip) and whose latest position (driver_locations, received by the server)
                    is older than DriverAppConfig.offers.autoOffline.noFixMinutes minutes of the zone (default configDefaults.noFixMinutesBeforeOffline
                    = 5; 0 = never) is set offline by a server job that runs every jobEverySeconds; a driver online with no
                    position at all counts from online since. The driver''s open offers are withdrawn as when going offline
                    by hand, the Driver.version goes up, a bell notice (GET /notifications, also sent as a push, auth.devices.sending)
                    of kind noticeKind in the driver''s language opens deepLink, and the admin audit gets a line action auditAction
                    (target driver, detail { reason: no_position, lastFixAt|null, minutes }). Driver app (decision 3): an
                    app restarted while the driver was online sets him offline (POST /driver/availability offline) and shows
                    the same text.'
                hiddenComesBackMin:
                  type: number
                  minimum: 0
        pickupPay:
          $ref: '#/components/schemas/DriverPickupPay'
        driverBonus:
          $ref: '#/components/schemas/DriverBonusLimits'
        cancelFees:
          $ref: '#/components/schemas/CancelFees'
        waiting:
          $ref: '#/components/schemas/DriverWaiting'
        destinationMode:
          type: object
          properties:
            perDay:
              type: integer
              minimum: 0
        nextTrips:
          type: object
          properties:
            'on':
              type: boolean
        reservations:
          $ref: '#/components/schemas/DriverReservations'
        cancelReasons:
          type: object
          description: Enabled codes per reason sheet; titles come from `texts`.
          properties:
            driverBeforeTrip:
              type: array
              items:
                $ref: '#/components/schemas/DriverBeforeTripCancelReasonCode'
            driverDuringTrip:
              type: array
              items:
                $ref: '#/components/schemas/DriverDuringTripCancelReasonCode'
            driverNextTrip:
              type: array
              items:
                $ref: '#/components/schemas/DriverNextTripCancelReasonCode'
            scheduled:
              type: array
              items:
                $ref: '#/components/schemas/ScheduledCancelReasonCode'
            noShow:
              type: array
              items:
                $ref: '#/components/schemas/NoShowReasonCode'
        drivingLimits:
          type: object
          properties:
            maxHoursPerDay:
              type: number
              minimum: 0
              maximum: 24
            restMinutes:
              type: number
              minimum: 0
        rideCheck:
          $ref: '#/components/schemas/RideCheck'
        texts:
          type: object
          properties:
            byLanguage:
              type: object
              additionalProperties:
                type: object
        notices:
          type: object
        appUpdate:
          $ref: '#/components/schemas/AppUpdate'
    CategoryPricingWaiting:
      type: object
      description: Waiting at pickup for one category; RiderAppConfig / DriverAppConfig waiting.byCategory carry the same
        values.
      required:
      - freeWaitMin
      - perMin
      - noShowAfterMin
      - noShowFee
      properties:
        freeWaitMin:
          type: number
          minimum: 0
          maximum: 30
        perMin:
          allOf:
          - $ref: '#/components/schemas/Money'
          description: Per minute after the free wait, charged per second (contract.json#pricing.waiting).
        noShowAfterMin:
          type: number
          minimum: 0
          description: Equals freeWaitMin (owner Q41).
        noShowFee:
          $ref: '#/components/schemas/Money'
    CategoryPricing:
      type: object
      description: One category's prices in a zone (admin Pricing; zonePricing.ts CategoryPrice + commission + rider pickup
        fee).
      required:
      - enabled
      - base
      - perKm
      - perMin
      - minimum
      - maximum
      - appFeePct
      - commissionPct
      - extraStopFee
      - stopWaitPerMin
      - waiting
      - riderPickupFee
      properties:
        enabled:
          type: boolean
          description: The category is offered in this zone.
        base:
          $ref: '#/components/schemas/Money'
        perKm:
          allOf:
          - $ref: '#/components/schemas/Money'
          description: Per km; minor units, e.g. 1200 = 12 kr/km.
        perMin:
          $ref: '#/components/schemas/Money'
        minimum:
          allOf:
          - $ref: '#/components/schemas/Money'
          description: The ride part is raised to this (minimum_adjust line).
        maximum:
          oneOf:
          - $ref: '#/components/schemas/Money'
          - type: 'null'
          description: The ride part is lowered to this (maximum_adjust line); null = no maximum (the admin's 0).
        appFeePct:
          type: number
          minimum: 0
          maximum: 50
          description: 'Added to the rider''s price: % of ride part + extras. Movera keeps it.'
        commissionPct:
          type: number
          minimum: 0
          maximum: 60
          description: Movera's commission on the ride part and the extras except waiting (owner decisions 17, 18).
        extraStopFee:
          $ref: '#/components/schemas/Money'
        stopWaitPerMin:
          allOf:
          - $ref: '#/components/schemas/Money'
          description: Waiting at a stop, per minute, charged per second from the driver's arrived-at-stop to leaving-stop;
            no free minutes (v0.7.1).
        childSeatFee:
          allOf:
          - $ref: '#/components/schemas/Money'
          description: 'v0.7.1: the ONE seat fee, only on the child_seat category (owner 2026-10-27): every child_seat trip
            includes one seat and adds it once. On another category: 400 seat_fee_not_child_seat. babySeatFee is gone.'
        waiting:
          $ref: '#/components/schemas/CategoryPricingWaiting'
        riderPickupFee:
          $ref: '#/components/schemas/RiderPickupFee'
    PricingFees:
      type: object
      required:
      - airportPickup
      - airportDropoff
      - reservationFee
      - cleaningFee
      - tollsPassThrough
      properties:
        airportPickup:
          $ref: '#/components/schemas/Money'
        airportDropoff:
          $ref: '#/components/schemas/Money'
        reservationFee:
          allOf:
          - $ref: '#/components/schemas/Money'
          description: Added to kind=scheduled trips (reservation_fee line).
        cleaningFee:
          allOf:
          - $ref: '#/components/schemas/Money'
          description: Charged afterwards by an admin adjust; not in the fare formula.
        tollsPassThrough:
          type: boolean
          description: Tolls added to the fare; no tolls are priced in v0.5.1.
    FixedRoute:
      type: object
      description: 'A fixed price between two admin-named places: replaces base + distance + time; no surge, minimum or maximum.'
      required:
      - id
      - from
      - to
      - categoryId
      - price
      properties:
        id:
          $ref: '#/components/schemas/Id'
        from:
          type: string
          minLength: 1
        to:
          type: string
          minLength: 1
        categoryId:
          $ref: '#/components/schemas/CategoryId'
        price:
          $ref: '#/components/schemas/Money'
    SurgeStep:
      type: object
      required:
      - ratio
      - multiplier
      properties:
        ratio:
          type: number
          exclusiveMinimum: 0
          description: Requests per free driver at which this step starts.
        multiplier:
          type: number
          minimum: 1
          maximum: 6.0
    SurgeProfile:
      type: object
      required:
      - id
      - name
      - days
      - windows
      - steps
      - cap
      - isDefault
      properties:
        id:
          type: string
          minLength: 1
        name:
          type: string
        days:
          type: array
          items:
            type: integer
            minimum: 0
            maximum: 6
          description: 0 = Monday … 6 = Sunday.
        windows:
          type: array
          items:
            type: object
            required:
            - from
            - to
            properties:
              from:
                type: string
                pattern: ^\d\d:\d\d$
              to:
                type: string
                pattern: ^\d\d:\d\d$
        steps:
          type: array
          items:
            $ref: '#/components/schemas/SurgeStep'
        cap:
          type: number
          minimum: 1
          maximum: 6.0
          description: 'The profile''s own maximum (admin, ×1 to ×6; v0.7.1: the only limit of smart surge).'
        isDefault:
          type: boolean
    SmartSurge:
      type: object
      description: 'The admin''s smart surge settings. v0.7.1: the server runs it (contract.json#smartSurge, fixtures/smart_surge.json);
        off until enabled.'
      required:
      - enabled
      - profiles
      properties:
        enabled:
          type: boolean
          description: Automatic surge; false in the test week (owner decision 21).
        activeFrom:
          type: string
          pattern: ^\d\d:\d\d$
        activeTo:
          type: string
          pattern: ^\d\d:\d\d$
        checkEveryMin:
          type: integer
          minimum: 1
          maximum: 15
        holdMin:
          type: integer
          minimum: 1
          maximum: 30
        stopAfterMin:
          type: integer
          minimum: 1
          maximum: 60
        cooldownMin:
          type: integer
          minimum: 1
          maximum: 30
        profiles:
          type: array
          items:
            $ref: '#/components/schemas/SurgeProfile'
    ScheduledSurge:
      type: object
      description: A flat surge for a time window, from the pricing document.
      required:
      - id
      - multiplier
      - startsAt
      - endsAt
      properties:
        id:
          type: string
          minLength: 1
        name:
          type: string
        multiplier:
          type: number
          minimum: 1
          maximum: 6.0
        startsAt:
          $ref: '#/components/schemas/Timestamp'
        endsAt:
          $ref: '#/components/schemas/Timestamp'
    PricingSurge:
      type: object
      description: 'Surge sources after the zone''s surge schedule (§3.4): first match: the zone''s active surge schedule
        (§3.4, PUT /admin/zones/{zoneId}/surge: the manual Start/Stop), then the highest pricing.surge.scheduled window in
        force (v0.7.1: overlapping planned surges, the higher counts; the admin is warned on save), then smart surge when
        smart.enabled (v0.7.1: contract.json#smartSurge, off by default); else 1.0. Every source is clamped to [1, 6]; the
        maximum of each is the value the admin chose on its slider (manual surge, planned window, smart profile cap; v0.7.1,
        no separate maximum). The quote keeps its multiplier; a reservation keeps the price shown at booking (no surge added
        later).'
      required:
      - smart
      - scheduled
      properties:
        maxMultiplier:
          type: number
          minimum: 1
          maximum: 6.0
          deprecated: true
          description: 'Deprecated in v0.7.1 and ignored: the maximum of each surge is the value the admin chose on its slider
            (owner 2026-10-27, no extra box). Kept readable for one release.'
        smart:
          $ref: '#/components/schemas/SmartSurge'
        scheduled:
          type: array
          items:
            $ref: '#/components/schemas/ScheduledSurge'
          description: 'v0.7.1: overlapping windows, the higher multiplier counts.'
        notifyDrivers:
          type: boolean
          description: 'Deprecated in v0.7.2 and ignored: drivers get no surge notice (owner 2026-10-28, contract.json#surgeNoticeRemoved).'
          deprecated: true
          default: false
    PricingDocument:
      type: object
      description: 'Server-only (contract.json#configDocs): the zone''s prices, read by the server''s quote engine. Never
        served to the apps. v0.5.1 (CONTRACT.md §3.5). The server prices every quote and fare from the zone''s pricing document
        (admin Pricing, the order of quoteRide), with owner decisions 16-21 applied. Amounts are exact until they become a
        fare line. Cases: fixtures/fares.json. Sample: fixtures/config/pricing_document.json.'
      required:
      - version
      - publishedAt
      - zoneId
      - currency
      - country
      - priceStep
      - categories
      - fees
      - fixedRoutes
      - surge
      - fleetCommissionPct
      properties:
        version:
          type: integer
          minimum: 1
          description: Server-stamped revision of the zone's live pricing document (contract.json#configVersion).
        publishedAt:
          $ref: '#/components/schemas/Timestamp'
        zoneId:
          $ref: '#/components/schemas/Id'
        currency:
          $ref: '#/components/schemas/CurrencyCode'
        country:
          $ref: '#/components/schemas/CountryCode'
        timeZone:
          type: string
          pattern: ^[A-Za-z_]+(/[A-Za-z0-9_+\-]+)*$
        priceStep:
          allOf:
          - $ref: '#/components/schemas/Money'
          description: The total is rounded once, half-up, to a multiple of this (admin fees.rounding).
        categories:
          type: object
          propertyNames:
            $ref: '#/components/schemas/CategoryId'
          additionalProperties:
            $ref: '#/components/schemas/CategoryPricing'
        fees:
          $ref: '#/components/schemas/PricingFees'
        fixedRoutes:
          type: array
          items:
            $ref: '#/components/schemas/FixedRoute'
        surge:
          $ref: '#/components/schemas/PricingSurge'
        fleetCommissionPct:
          type: number
          minimum: 0
          maximum: 30
          description: Fleet owner's share (admin Pricing); not in the rider's fare.
        usesStandard:
          type: boolean
          description: 'v0.8.0: set by the server when it serves or uses the country standard for this zone (contract.json#configDocs.standard).'
      x-server-only: true
    DispatchModeRules:
      type: object
      description: 'Radar: then is widen | exclusive | widen_then_exclusive. Exclusive: then is radar | widen | widen_then_radar.'
      required:
      - 'on'
      - drivers
      - seconds
      - then
      properties:
        'on':
          type: boolean
        drivers:
          type: integer
          minimum: 1
          maximum: 30
          description: 'radar: shown at once (1-30); exclusive: tried one after the other per radius step (1-10).'
        seconds:
          type: integer
          minimum: 5
          maximum: 120
          description: radar 5-120, exclusive 5-60.
        then:
          type: string
          enum:
          - exclusive
          - radar
          - widen
          - widen_then_exclusive
          - widen_then_radar
    DispatchTimeRule:
      type: object
      description: Zone-local [from, to); wraps midnight when from > to.
      required:
      - id
      - 'on'
      - from
      - to
      - mode
      properties:
        id:
          type: string
          minLength: 1
        'on':
          type: boolean
        from:
          type: string
          pattern: ^\d\d:\d\d$
        to:
          type: string
          pattern: ^\d\d:\d\d$
        mode:
          type: string
          enum:
          - radar
          - exclusive
    DispatchChoose:
      type: object
      required:
      - how
      - radarAbove
      - main
      - backup
      - times
      properties:
        how:
          type: string
          enum:
          - auto
          - manual
        radarAbove:
          type: number
          exclusiveMinimum: 0
          maximum: 10
          description: Busy level (requests per free driver) from which Auto uses Radar.
        main:
          type: string
          enum:
          - radar
          - exclusive
        backup:
          type: string
          enum:
          - radar
          - exclusive
          - none
          description: 'Ignored in v0.5.1: `then` decides fallbacks.'
        times:
          type: array
          items:
            $ref: '#/components/schemas/DispatchTimeRule'
    DispatchFactor:
      type: object
      required:
      - id
      - 'on'
      - weight
      properties:
        id:
          type: string
          enum:
          - eta
          - rating
          - acceptance
          - cancel
          - idle
          - finishing
          - favourite
        'on':
          type: boolean
        weight:
          type: number
          minimum: 0
    DispatchWaitingStep:
      type: object
      required:
      - id
      - kind
      - 'on'
      - afterMin
      - message
      properties:
        id:
          type: string
          minLength: 1
        kind:
          type: string
          enum:
          - raise_price
          - upgrade
          - alert_admin
          - keep_waiting
          - busy
          x-skipped-in-test-week:
          - raise_price
          - upgrade
        'on':
          type: boolean
        afterMin:
          type: number
          minimum: 0
          maximum: 30
          description: From search start.
        message:
          type: string
        extraMin:
          type:
          - number
          - 'null'
          description: 'keep_waiting: minutes added on Keep waiting.'
    DispatchDocument:
      type: object
      description: 'Server-only (contract.json#configDocs): the zone''s automatic dispatch rules (admin Dispatch, a subset
        of the movera.dispatch.rules export, admin field names). Never served to the apps; DriverAppConfig.offers timers must
        equal radar/exclusive seconds and on. Algorithm: contract.json#dispatch, CONTRACT.md §3.6. Sample: fixtures/config/dispatch_document.json.'
      required:
      - version
      - publishedAt
      - zoneId
      - country
      - timeZone
      - radar
      - exclusive
      - choose
      - radius
      - factors
      - finishing
      - favourite
      - exclusiveWhileDriving
      - waiting
      properties:
        version:
          type: integer
          minimum: 1
          description: Server-stamped revision of the zone's live dispatch document (contract.json#configVersion).
        publishedAt:
          $ref: '#/components/schemas/Timestamp'
        zoneId:
          $ref: '#/components/schemas/Id'
        country:
          $ref: '#/components/schemas/CountryCode'
        timeZone:
          type: string
          pattern: ^[A-Za-z_]+(/[A-Za-z0-9_+\-]+)*$
          description: IANA zone for the time rules.
        radar:
          $ref: '#/components/schemas/DispatchModeRules'
        exclusive:
          $ref: '#/components/schemas/DispatchModeRules'
        choose:
          $ref: '#/components/schemas/DispatchChoose'
        rulesFrom:
          type: string
          enum:
          - driver
          - pickup
          description: 'Kept, ignored in v0.5.1: the pickup zone''s document governs the search.'
        radius:
          type: object
          required:
          - steps
          - maxWaitMin
          properties:
            steps:
              type: array
              items:
                type: number
                exclusiveMinimum: 0
                maximum: 50
              minItems: 1
              description: km, strictly increasing.
            maxWaitMin:
              type: integer
              minimum: 1
              maximum: 30
        factors:
          type: array
          items:
            $ref: '#/components/schemas/DispatchFactor'
          minItems: 1
        finishing:
          type: object
          required:
          - exclusive
          - withinMin
          - withinKm
          properties:
            exclusive:
              type: boolean
            withinMin:
              type: number
              minimum: 0
            withinKm:
              type: number
              minimum: 0
        favourite:
          type: object
          required:
          - 'on'
          - maxKm
          properties:
            'on':
              type: boolean
            maxKm:
              type: number
              minimum: 0
        exclusiveWhileDriving:
          $ref: '#/components/schemas/ExclusiveWhileDriving'
        waiting:
          type: array
          items:
            $ref: '#/components/schemas/DispatchWaitingStep'
        usesStandard:
          type: boolean
          description: 'v0.8.0: set by the server when it serves or uses the country standard for this zone (contract.json#configDocs.standard).'
      x-server-only: true
      x-ranges:
        radar.drivers:
        - 1
        - 30
        radar.seconds:
        - 5
        - 120
        exclusive.drivers:
        - 1
        - 10
        exclusive.seconds:
        - 5
        - 60
        choose.radarAbove: '> 0 and <= 10'
        radius.steps: '> 0 and <= 50 km, strictly increasing'
        radius.maxWaitMin:
        - 1
        - 30
        waiting[].afterMin:
        - 0
        - 30
        factors: at least one on with weight > 0
        exclusiveWhileDriving.count:
        - 1
        - 5
        other: auto needs both modes on; manual main must be on; every on time rule needs from != to (HH:MM) and its mode
          on
    DispatchControl:
      type: object
      description: 'Live dispatch switch of a zone (outside publishing). DispatchControl { zoneId, paused, mode: radar | exclusive
        | null, by, at, version } is live state, outside publishing. PUT /admin/zones/{zoneId}/dispatch-control (dispatch.edit).
        Pausing, forcing a mode, resume and back to rules apply at once for every admin with dispatch.edit (v0.7.2, one admin
        is enough).'
      required:
      - zoneId
      - paused
      - mode
      - version
      properties:
        zoneId:
          $ref: '#/components/schemas/Id'
        paused:
