          enum:
          - radar
          - exclusive
        backup:
          type: string
          enum:
          - radar
          - exclusive
          - none
          description: 'Ignored in v0.5.1: `then` decides fallbacks.'
        times:
          type: array
          items:
            $ref: '#/components/schemas/DispatchTimeRule'
    DispatchFactor:
      type: object
