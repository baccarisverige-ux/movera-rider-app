        at:
          $ref: '#/components/schemas/Timestamp'
        fee:
          description: Rider cancel / no-show fee. null = not decided yet or none.
          oneOf:
          - $ref: '#/components/schemas/Money'
          - type: 'null'
        note:
          type: string
          maxLength: 1000
        feeStatus:
          type: string
          enum:
          - paid
          - owed
          - waived
          description: 'v0.5.1 (CONTRACT.md §3.7): owed = an unpaid cash fee, in Rider.outstanding and the next trip''s outstanding_fee
            line.'
    VehicleSummary:
      type: object
      properties:
        vehicleId:
          $ref: '#/components/schemas/Id'
        make:
          type: string
        model:
          type: string
        color:
          type: string
        plate:
          type: string
        categoryId:
          $ref: '#/components/schemas/CategoryId'
    DriverSummary:
      type: object
      description: Driver as shown to the rider.
      required:
      - driverId
      - firstName
      - vehicle
      properties:
        driverId:
          $ref: '#/components/schemas/Id'
        firstName:
          type: string
          minLength: 1
        rating:
          type: number
          minimum: 0
          maximum: 5
        tripCount:
          type: integer
          minimum: 0
        photoUrl:
          type: string
          format: uri
        vehicle:
          $ref: '#/components/schemas/VehicleSummary'
    TripProjection:
      type: object
      description: 'Authoritative trip state. Field visibility depends on the actor (e.g. driverEarnings/commission are not
        shown to riders). v0.5.1: fare and fareLines follow contract.json#pricing (CONTRACT.md §3.5); commission is Movera''s
        share of the fare (fare − driverEarnings).'
      required:
      - tripId
      - status
      - version
      - sequence
      - kind
      - createdAt
      - updatedAt
      - riderId
      - zoneId
      - categoryId
      - pickup
      - dropoff
      - stops
      - fare
      - paymentMethod
      - ratingStatus
      - pinRequired
      properties:
        tripId:
          $ref: '#/components/schemas/Id'
        rideId:
          allOf:
          - $ref: '#/components/schemas/Id'
          readOnly: true
          deprecated: true
          description: Legacy alias of tripId, echoed during migration. Read-only; never sent by clients.
        status:
          $ref: '#/components/schemas/TripStatus'
        version:
          type: integer
          minimum: 1
          description: Per-trip aggregate version; send as expectedVersion.
        sequence:
          type: integer
          minimum: 0
          description: Last realtime sequence included in this projection (resync cursor for `after`).
        kind:
          $ref: '#/components/schemas/TripKind'
        scheduledAt:
          allOf:
          - $ref: '#/components/schemas/Timestamp'
          description: Pickup time for kind=scheduled (UTC).
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        updatedAt:
          $ref: '#/components/schemas/Timestamp'
        acceptedAt:
          oneOf:
          - $ref: '#/components/schemas/Timestamp'
          - type: 'null'
          description: When a driver accepted; null before. The live free-cancel clock (FeeRule.freeMin) counts from it.
        riderId:
          $ref: '#/components/schemas/Id'
        driverId:
          $ref: '#/components/schemas/Id'
        vehicleId:
          $ref: '#/components/schemas/Id'
        zoneId:
          $ref: '#/components/schemas/Id'
        categoryId:
          $ref: '#/components/schemas/CategoryId'
        pickup:
          $ref: '#/components/schemas/Place'
        dropoff:
          $ref: '#/components/schemas/Place'
        stops:
          type: array
          items:
            $ref: '#/components/schemas/Place'
          description: Ordered intermediate stops.
        quote:
          $ref: '#/components/schemas/QuoteRef'
        fare:
          allOf:
          - $ref: '#/components/schemas/Money'
          description: Current authoritative fare (rider pays).
        fareLines:
          type: array
          items:
            $ref: '#/components/schemas/FareLine'
        driverEarnings:
          $ref: '#/components/schemas/Money'
        commission:
          $ref: '#/components/schemas/Money'
        driverBonus:
          allOf:
          - $ref: '#/components/schemas/Money'
          description: Movera-paid extra for the driver (admin / driver view only). Never part of the rider's fare.
        pickupPay:
          allOf:
          - $ref: '#/components/schemas/Money'
          description: Driver pickup pay Movera pays for this trip (admin / driver view only, v0.5.0, contract.json#pickupPay).
            Never part of the rider's fare; the rider's fixed pickup fee is the pickup_fee fare line.
        paymentMethod:
          $ref: '#/components/schemas/PaymentMethod'
        paymentMethodId:
          $ref: '#/components/schemas/Id'
        paymentStatus:
          $ref: '#/components/schemas/PaymentStatus'
        ratingStatus:
          $ref: '#/components/schemas/RatingStatus'
        driver:
          $ref: '#/components/schemas/DriverSummary'
        driverLocation:
          $ref: '#/components/schemas/GeoFix'
        etaSeconds:
          $ref: '#/components/schemas/DurationSeconds'
        waiting:
          $ref: '#/components/schemas/Waiting'
        cancellation:
          $ref: '#/components/schemas/Cancellation'
        pinRequired:
          type: boolean
          description: Driver must verify the rider PIN before `board`.
        searchStep:
          allOf:
          - $ref: '#/components/schemas/SearchStep'
          description: 'v0.5.1 (CONTRACT.md §3.6): the latest rider-waiting step while searching (rider view). Changing it
            does not change version.'
    Offer:
      type: object
      description: One driver's offer for a trip. One trip has many offers; offerId is never a tripId.
      required:
      - offerId
      - tripId
      - kind
      - status
      - version
      - expiresAt
      - fare
      - driverEarnings
      - pickup
      - dropoff
      - stops
      - categoryId
      - paymentMethod
      - pickupEtaSeconds
      - pickupMeters
      - tripSeconds
      - tripMeters
      properties:
        offerId:
          $ref: '#/components/schemas/Id'
        tripId:
          $ref: '#/components/schemas/Id'
        kind:
          $ref: '#/components/schemas/OfferKind'
        status:
          $ref: '#/components/schemas/OfferStatus'
        version:
          type: integer
          minimum: 1
        expiresAt:
          $ref: '#/components/schemas/Timestamp'
        fare:
          allOf:
          - $ref: '#/components/schemas/Money'
          description: Trip fare as the driver sees it, driverBonus included.
        driverEarnings:
          allOf:
          - $ref: '#/components/schemas/Money'
          description: Driver net, driverBonus included.
        pickupPay:
          $ref: '#/components/schemas/Money'
        fareBoost:
          $ref: '#/components/schemas/Money'
        driverBonus:
          allOf:
          - $ref: '#/components/schemas/Money'
          description: Movera-paid extra (admin "add money to trip"), already in fare and driverEarnings. The rider never
            pays it.
        priority:
          type: boolean
          default: false
          description: Show the "Priority" badge (red) on the offer card.
        source:
          type: string
          enum:
          - system
          - admin
          default: system
          description: admin = direct assign (kind=assigned, exclusive) or radar group (kind=radar, groupId).
        groupId:
          allOf:
          - $ref: '#/components/schemas/Id'
          description: Admin radar group this offer belongs to (contract.json#adminDispatch.radarGroup).
        pickup:
          $ref: '#/components/schemas/Place'
        dropoff:
          $ref: '#/components/schemas/Place'
        stops:
          type: array
          items:
            $ref: '#/components/schemas/Place'
        categoryId:
          $ref: '#/components/schemas/CategoryId'
        paymentMethod:
          $ref: '#/components/schemas/PaymentMethod'
        pickupEtaSeconds:
          $ref: '#/components/schemas/DurationSeconds'
        pickupMeters:
          type: integer
          minimum: 0
        tripSeconds:
          $ref: '#/components/schemas/DurationSeconds'
        tripMeters:
          type: integer
          minimum: 0
        riderRating:
          type: number
          minimum: 0
          maximum: 5
        riderTrips:
          type: integer
          minimum: 0
        scheduledAt:
          $ref: '#/components/schemas/Timestamp'
        reasonCode:
          type: string
          pattern: ^[a-z][a-z0-9_-]{0,63}$
          description: Exclusive reason id (driver.offers.exclusiveReasons[].id) for kind=exclusive/assigned.
    Quote:
      type: object
      required:
      - quoteId
      - categoryId
      - total
      - fareLines
      - expiresAt
      - pickup
      - dropoff
      - stops
      properties:
        quoteId:
          $ref: '#/components/schemas/Id'
        categoryId:
          $ref: '#/components/schemas/CategoryId'
        total:
          $ref: '#/components/schemas/Money'
        fareLines:
          type: array
          items:
            $ref: '#/components/schemas/FareLine'
        expiresAt:
          $ref: '#/components/schemas/Timestamp'
        pickup:
          $ref: '#/components/schemas/Place'
        dropoff:
          $ref: '#/components/schemas/Place'
        stops:
          type: array
          items:
            $ref: '#/components/schemas/Place'
        surgeMultiplier:
          type: number
          minimum: 1
          description: The multiplier this quote was priced with; it stays with the quote (contract.json#surge).
        surge:
          $ref: '#/components/schemas/QuoteSurge'
        etaSeconds:
          $ref: '#/components/schemas/DurationSeconds'
    RouteQuote:
      type: object
      description: 'Price for a route change after request; apply with PATCH /trips/{tripId}. Priced from the booking (owner
        decision 5, v0.4.3): a booked stop is counted once and offer raises stay.'
      required:
      - routeQuoteId
      - tripId
      - total
      - difference
      - dropoff
      - stops
      - expiresAt
      properties:
        routeQuoteId:
          $ref: '#/components/schemas/Id'
        tripId:
          $ref: '#/components/schemas/Id'
        total:
          allOf:
          - $ref: '#/components/schemas/Money'
          description: Booked fare + the rider's offer raises + distance price of (new route km − booked route km, the booked
            route going through the booked stops) + the stop fee for each stop that was not booked; never below half of (booked
            fare + raises). CONTRACT.md §3, v0.4.3.
        difference:
          allOf:
          - $ref: '#/components/schemas/Money'
          description: total − current fare (may be negative). Re-quoting the route the trip already has gives 0; a route
            change never refunds an offer raise.
        fareLines:
          type: array
          items:
            $ref: '#/components/schemas/FareLine'
        dropoff:
          $ref: '#/components/schemas/Place'
        stops:
          type: array
          items:
            $ref: '#/components/schemas/Place'
        expiresAt:
          $ref: '#/components/schemas/Timestamp'
    Rider:
