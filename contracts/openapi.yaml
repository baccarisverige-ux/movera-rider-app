      properties:
        minimumVersion:
          type: string
          pattern: ^\d+\.\d+\.\d+$
        latestVersion:
          type: string
          pattern: ^\d+\.\d+\.\d+$
        storeUrl:
          type: string
          format: uri
    RideCheck:
      type: object
      description: Ride check thresholds (Safety).
      properties:
        stopMinutes:
          type: number
          minimum: 0
        offRouteKm:
          type: number
          minimum: 0
    CategoryWaiting:
      type: object
