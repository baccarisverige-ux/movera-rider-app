      properties:
        auditId:
          $ref: '#/components/schemas/Id'
        at:
          $ref: '#/components/schemas/Timestamp'
        actor:
          $ref: '#/components/schemas/Actor'
        actorId:
          $ref: '#/components/schemas/Id'
        actorRole:
          $ref: '#/components/schemas/AdminRole'
        action:
          type: string
        targetType:
          type: string
        targetId:
          $ref: '#/components/schemas/Id'
        reason:
          type: string
        result:
          type: string
          enum:
          - committed
          - rejected
          - denied
          - conflict
          - pending_approval
        before:
          description: Server-written snapshot before the change.
        after:
          description: Server-written snapshot after the change.
        requestId:
          type: string
        idempotencyKey:
          type: string
    ConfigDocName:
      type: string
      enum:
      - rider_app_config
      - driver_app_config
    ConfigDraft:
      type: object
      required:
      - doc
      - zoneId
      - version
      - liveVersion
      - document
      - updatedAt
      properties:
        doc:
          $ref: '#/components/schemas/ConfigDocName'
        zoneId:
          $ref: '#/components/schemas/Id'
        version:
          type: integer
          minimum: 1
          description: Draft version (expectedVersion for PUT/publish).
        liveVersion:
          type: integer
          minimum: 0
          description: Version of the published document the apps read.
        document:
          oneOf:
          - $ref: '#/components/schemas/RiderAppConfig'
          - $ref: '#/components/schemas/DriverAppConfig'
        updatedAt:
          $ref: '#/components/schemas/Timestamp'
        updatedBy:
          $ref: '#/components/schemas/Id'
    ConfigPublication:
      type: object
      required:
      - doc
      - zoneId
      - version
      - publishedAt
      properties:
        doc:
          $ref: '#/components/schemas/ConfigDocName'
        zoneId:
          $ref: '#/components/schemas/Id'
        version:
          type: integer
          minimum: 1
        publishedAt:
          $ref: '#/components/schemas/Timestamp'
    FeeRule:
      type: object
      required:
      - freeMin
      - type
      - value
      - min
      - max
      description: 'Cancel fee rule. live: freeMin = minutes after accept; reservation: freeMin = minutes before pickup. fixed:
        value is minor units; percent: value is 0–100 of the fare, rounded half-up to a whole minor unit, then clamped to
        min/max.'
      properties:
        freeMin:
          type: integer
          minimum: 0
        type:
          type: string
          enum:
          - fixed
          - percent
        value:
          type: number
          minimum: 0
        min:
          oneOf:
          - $ref: '#/components/schemas/Money'
          - type: 'null'
        max:
          oneOf:
          - $ref: '#/components/schemas/Money'
          - type: 'null'
      allOf:
      - if:
          properties:
            type:
              const: percent
          required:
          - type
        then:
          properties:
            value:
              maximum: 100
      - if:
          properties:
            type:
              const: fixed
          required:
          - type
        then:
          properties:
            value:
              type: integer
    CancelFeeTable:
      type: object
      description: FeeRule per categoryId.
      propertyNames:
        $ref: '#/components/schemas/CategoryId'
      additionalProperties:
        $ref: '#/components/schemas/FeeRule'
    CancelFees:
      type: object
      properties:
        live:
          $ref: '#/components/schemas/CancelFeeTable'
        reservation:
          $ref: '#/components/schemas/CancelFeeTable'
    CategoryCatalog:
      type: object
      required:
      - categories
      properties:
        categories:
          type: array
          items:
            type: object
            required:
            - id
            - label
            - seats
            - sort
            properties:
              id:
                $ref: '#/components/schemas/CategoryId'
              label:
                type: string
              seats:
                type: integer
                minimum: 1
              sort:
                type: integer
    AppUpdate:
      type: object
      description: Below minimumVersion = forced update; below latestVersion = soft update.
      properties:
        minimumVersion:
          type: string
          pattern: ^\d+\.\d+\.\d+$
        latestVersion:
          type: string
          pattern: ^\d+\.\d+\.\d+$
        storeUrl:
          type: string
          format: uri
    RideCheck:
      type: object
      description: Ride check thresholds (Safety).
      properties:
        stopMinutes:
          type: number
          minimum: 0
        offRouteKm:
          type: number
          minimum: 0
    CategoryWaiting:
      type: object
      description: Waiting terms of one category. Default free wait 5 min, xl 3 min (contract.json#configDefaults).
      properties:
        freeWaitMin:
          type: number
          minimum: 0
        perMin:
          allOf:
          - $ref: '#/components/schemas/Money'
          description: Waiting fee per minute after the free wait.
        noShowAfterMin:
          type: number
          minimum: 0
          description: 'Equals freeWaitMin (owner Q41): the no-show button appears when the free wait ends.'
        noShowFee:
          $ref: '#/components/schemas/Money'
    RiderWaiting:
      type: object
      description: Top-level terms are the headline category's (economy, else the first).
      properties:
        freeWaitMin:
          type: number
          minimum: 0
        perMin:
          $ref: '#/components/schemas/Money'
        noShowAfterMin:
          type: number
          minimum: 0
        noShowFee:
          $ref: '#/components/schemas/Money'
        byCategory:
          type: object
          description: CategoryWaiting per categoryId.
          propertyNames:
            $ref: '#/components/schemas/CategoryId'
          additionalProperties:
            $ref: '#/components/schemas/CategoryWaiting'
    DriverWaiting:
      allOf:
      - $ref: '#/components/schemas/RiderWaiting'
      - type: object
        properties:
          driverSharePct:
            type: number
            minimum: 0
            maximum: 100
            description: Driver's share of the no-show fee, per country (default 80).
          driverShareWaitPct:
            type: number
            minimum: 0
            maximum: 100
            description: Driver's share of the waiting fee (100).
    AmountOption:
      type: object
      description: One admin-editable amount (tip or raise-offer step) in the zone's currency.
      required:
      - amount
      - enabled
      properties:
        amount:
          $ref: '#/components/schemas/Money'
        enabled:
          type: boolean
          description: Disabled options are not shown.
    Languages:
      type: object
      description: App languages and the country's default per app (owner Q48/Q49).
      required:
      - available
      - default
      properties:
        available:
          type: array
          items:
            $ref: '#/components/schemas/Language'
          uniqueItems: true
          minItems: 1
        default:
          type: object
          required:
          - rider
          - driver
          - admin
          properties:
            rider:
              $ref: '#/components/schemas/Language'
            driver:
              $ref: '#/components/schemas/Language'
            admin:
              $ref: '#/components/schemas/Language'
    DriverBonusLimits:
      type: object
      description: Movera-paid driver bonus ("add money to trip") limits per country.
      required:
      - defaultLimit
      - hardMax
      properties:
        defaultLimit:
          allOf:
          - $ref: '#/components/schemas/Money'
          description: Above this the admin is told to adjust the limit in Pricing.
        hardMax:
          allOf:
          - $ref: '#/components/schemas/Money'
          description: The limit can never be set above this.
    ReservationRideType:
      type: object
      description: Times for one kind of scheduled ride.
      properties:
        onlineBeforeMin:
          type: integer
          minimum: 5
          maximum: 240
          description: Be online this many minutes before pickup.
        spareMin:
          type: integer
          minimum: 0
          maximum: 60
          description: Spare minutes in the smart gap and in Leave now.
        reminderMin:
          type: array
          items:
            type: integer
            minimum: 1
            maximum: 1440
          description: Reminder times, minutes before pickup, largest first.
          maxItems: 4
    LateEta:
      type: object
      description: 'Running late: an online driver who would arrive more than toleranceMin late loses the ride early. Otherwise
        an online driver keeps it.'
      properties:
        'on':
          type: boolean
          description: Watch an online driver's ETA from Leave now until arrival at the pickup.
          default: true
        toleranceMin:
          type: integer
          minimum: 0
          maximum: 30
          description: Reassign when now + ETA > pickup time + toleranceMin.
          default: 3
        checkEverySeconds:
          type: integer
          minimum: 15
          maximum: 600
          description: How often the ETA is checked.
          default: 60
        reassignTo:
          type: string
          enum:
          - exclusive
          - radar
          - dispatch
          description: exclusive = Exclusive offer to the nearest available driver; radar = Radar trips; dispatch = back to
            admin dispatch.
          default: exclusive
    DriverReservations:
      type: object
      description: Scheduled-ride rules for the driver app (CONTRACT.md §6). Every field is optional; a missing or invalid
        one keeps the default (contract.json#configDefaults.reservations).
      properties:
        'on':
          type: boolean
          description: Reservations are enabled in this zone.
          default: true
        leaveNow:
          type: boolean
          description: Open the trip automatically at Leave now (estimated drive time to the pickup + spareMin before pickup).
          default: true
        lateWarn:
          type: boolean
          description: Island warning "Head to your 07:40 pickup" when Leave now cannot start the trip.
          default: true
        offlineBackupAfterMin:
          type: integer
          minimum: 1
          maximum: 60
          description: Only an OFFLINE driver loses the ride, this many minutes after Leave now; an online driver keeps it.
          default: 5
        homePopupAfterMin:
          type: integer
          minimum: 1
          maximum: 1440
          description: 'Untaken: the Home popup this many minutes after booking.'
          default: 10
        exclusiveBeforeMin:
          type: integer
          minimum: 1
          maximum: 180
          description: 'Untaken: Exclusive from this many minutes before pickup.'
          default: 20
        radarBeforeMin:
          type: integer
          minimum: 1
          maximum: 180
          description: 'Untaken: Radar trips from this many minutes before pickup.'
          default: 15
        onDriverCancel:
          type: string
          enum:
          - byTime
          - list
          - home
          - exclusive
          description: Where a ride goes after a driver cancels.
          default: byTime
        hideClashing:
          type: boolean
          description: Rides that do not fit the smart gap leave the driver's Scheduled rides list once they take one.
          default: true
        towardPickup:
          type: boolean
          description: Before the ride, offers head toward the scheduled pickup.
          default: true
        towardPickupBeforeMin:
          type: integer
          minimum: 15
          maximum: 240
          default: 60
        longTripKm:
          type: number
          minimum: 10
          maximum: 500
          description: A ride longer than this is a longTrip.
          default: 50
        driverLateCancelHours:
          type: number
          minimum: 0.5
          maximum: 72
          description: A driver cancel with less than this many hours to pickup is a late cancel.
          default: 1
        lateCancelLimit:
          type: integer
          minimum: 1
          maximum: 20
          description: Late cancels within lateCancelPeriodDays before a pause.
          default: 2
        lateCancelPeriodDays:
          type: integer
          minimum: 1
          maximum: 90
          default: 7
        pauseDays:
          type: integer
          minimum: 1
          maximum: 365
          description: No scheduled rides for this many days after the limit.
          default: 7
        assignAcceptSeconds:
          type: integer
          minimum: 10
          maximum: 600
          description: Time to accept a ride assigned by Movera.
          default: 30
        rideTypes:
          type: object
          description: Per kind of ride. Admin ids long and premium are longTrip and comfortPremium.
          properties:
            normal:
              $ref: '#/components/schemas/ReservationRideType'
            airport:
              $ref: '#/components/schemas/ReservationRideType'
            longTrip:
              $ref: '#/components/schemas/ReservationRideType'
            comfortPremium:
              $ref: '#/components/schemas/ReservationRideType'
            event:
              $ref: '#/components/schemas/ReservationRideType'
        lateEta:
          $ref: '#/components/schemas/LateEta'
    RiderAppConfig:
      type: object
      description: Per-zone rider document built by Admin exporters. Unknown keys are ignored; missing keys fall back to the
        app seed.
      required:
      - version
      - publishedAt
      - zoneId
      - currency
      - timeZone
      properties:
        version:
          type: integer
          minimum: 1
          description: Only increases; apps keep the last good document.
        publishedAt:
          $ref: '#/components/schemas/Timestamp'
        zoneId:
          $ref: '#/components/schemas/Id'
        currency:
          $ref: '#/components/schemas/CurrencyCode'
        timeZone:
          type: string
          pattern: ^[A-Za-z_]+(/[A-Za-z0-9_+\-]+)*$
          examples:
          - Europe/Stockholm
          - Europe/Paris
          - Africa/Tunis
          description: IANA zone of the zone, for wall-clock rules and booking times.
        country:
          $ref: '#/components/schemas/CountryCode'
        languages:
          $ref: '#/components/schemas/Languages'
        catalog:
          $ref: '#/components/schemas/CategoryCatalog'
        features:
          type: object
          properties:
            scheduledRides:
              type: boolean
            wallet:
              type: boolean
            pin:
              type: boolean
            shareTrip:
              type: boolean
          additionalProperties:
            type: boolean
        paymentMethods:
          type: array
          items:
            $ref: '#/components/schemas/ZonePaymentMethod'
          uniqueItems: true
          description: Methods offered in the zone; the wallet is separate.
        wallet:
          type: object
          properties:
            usedFirst:
              type: boolean
              description: The balance (one per currency, no conversion) pays first.
        tips:
          type: array
          items:
            $ref: '#/components/schemas/AmountOption'
          description: Tip options in admin order.
        raiseSteps:
          type: array
          items:
            $ref: '#/components/schemas/AmountOption'
          description: Raise-offer quick steps while searching, in admin order.
        promoCap:
          oneOf:
          - $ref: '#/components/schemas/Money'
          - type: 'null'
          description: Most a promotion may take off one trip in this country; null = no cap set.
        booking:
          type: object
          properties:
            maxStops:
              type: integer
              minimum: 0
              maximum: 10
            bookingHorizonDays:
              type: integer
              minimum: 0
            maxPickupMoveMeters:
              type: integer
              minimum: 0
              description: How far the rider may move the pickup after accept; further = cancel and rebook.
        cancelFees:
          $ref: '#/components/schemas/CancelFees'
        waiting:
          $ref: '#/components/schemas/RiderWaiting'
        cancelReasons:
          type: array
          items:
            type: object
            required:
            - code
            - title
            properties:
              code:
                $ref: '#/components/schemas/RiderCancelReasonCode'
              title:
                type: string
                minLength: 1
        rideCheck:
          $ref: '#/components/schemas/RideCheck'
        appUpdate:
          $ref: '#/components/schemas/AppUpdate'
    DriverAppConfig:
      type: object
      description: Per-zone driver document built by Admin exporters. Unknown keys are ignored; missing keys fall back to
        the app seed.
      required:
      - version
      - publishedAt
      - zoneId
      - currency
      - timeZone
      properties:
        version:
          type: integer
          minimum: 1
          description: Only increases; apps keep the last good document.
        publishedAt:
          $ref: '#/components/schemas/Timestamp'
        zoneId:
          $ref: '#/components/schemas/Id'
        currency:
          $ref: '#/components/schemas/CurrencyCode'
        timeZone:
          type: string
          pattern: ^[A-Za-z_]+(/[A-Za-z0-9_+\-]+)*$
          examples:
          - Europe/Stockholm
          - Europe/Paris
          - Africa/Tunis
          description: IANA zone of the zone, for wall-clock rules and booking times.
        country:
          $ref: '#/components/schemas/CountryCode'
        languages:
          $ref: '#/components/schemas/Languages'
        catalog:
          $ref: '#/components/schemas/CategoryCatalog'
        features:
          type: object
          properties:
            scheduledRides:
              type: boolean
            performance:
              type: boolean
          additionalProperties:
            type: boolean
        paymentMethods:
          type: array
          items:
            $ref: '#/components/schemas/ZonePaymentMethod'
          uniqueItems: true
          description: Methods offered in the zone; the wallet is separate.
        booking:
          type: object
          properties:
            maxStops:
              type: integer
              minimum: 0
              maximum: 10
            maxPickupMoveMeters:
              type: integer
              minimum: 0
              description: Pickup move limit after accept; the driver is notified of a move.
        offers:
          type: object
          properties:
            radarSeconds:
              type: integer
              minimum: 1
            exclusiveSeconds:
              type: integer
              minimum: 1
            offerCard:
              type: object
              description: Which fields the offer card shows.
              properties:
                netFare:
                  type: boolean
                pickupAddress:
                  type: boolean
                dropoffAreaOnly:
                  type: boolean
                stops:
                  type: boolean
              additionalProperties:
                type: boolean
            exclusiveReasons:
              type: array
              items:
                type: object
                required:
                - id
                - text
                - 'on'
                properties:
                  id:
                    type: string
                    pattern: ^[a-z][a-z0-9_-]{0,63}$
                  text:
                    type: string
                  'on':
                    type: boolean
            autoOffline:
              type: object
              properties:
                missedExclusive:
                  type: integer
                  minimum: 0
                  description: Missed or declined exclusive offers in a row before the driver is set offline (default 3).
                hiddenComesBackMin:
                  type: number
                  minimum: 0
        pickupPay:
          type: object
          properties:
            perKm:
              $ref: '#/components/schemas/Money'
            perMin:
              $ref: '#/components/schemas/Money'
            freeKm:
              type: number
              minimum: 0
            freeMin:
              type: number
              minimum: 0
            ranges:
              type: array
              items:
                type: object
                description: Distance band override (shape owned by Admin Pricing).
                properties:
                  fromKm:
                    type: number
                    minimum: 0
                  toKm:
                    type:
                    - number
                    - 'null'
                  amount:
                    $ref: '#/components/schemas/Money'
            display:
              type: string
              enum:
              - total
              - breakdown
        driverBonus:
          $ref: '#/components/schemas/DriverBonusLimits'
        cancelFees:
          $ref: '#/components/schemas/CancelFees'
        waiting:
          $ref: '#/components/schemas/DriverWaiting'
        destinationMode:
          type: object
          properties:
            perDay:
              type: integer
              minimum: 0
        nextTrips:
          type: object
          properties:
            'on':
              type: boolean
        reservations:
          $ref: '#/components/schemas/DriverReservations'
        cancelReasons:
          type: object
          description: Enabled codes per reason sheet; titles come from `texts`.
          properties:
            driverBeforeTrip:
              type: array
              items:
                $ref: '#/components/schemas/DriverBeforeTripCancelReasonCode'
            driverDuringTrip:
              type: array
              items:
                $ref: '#/components/schemas/DriverDuringTripCancelReasonCode'
            driverNextTrip:
              type: array
              items:
                $ref: '#/components/schemas/DriverNextTripCancelReasonCode'
            scheduled:
              type: array
              items:
                $ref: '#/components/schemas/ScheduledCancelReasonCode'
            noShow:
              type: array
              items:
                $ref: '#/components/schemas/NoShowReasonCode'
        drivingLimits:
          type: object
          properties:
            maxHoursPerDay:
              type: number
              minimum: 0
              maximum: 24
            restMinutes:
              type: number
              minimum: 0
        rideCheck:
          $ref: '#/components/schemas/RideCheck'
        texts:
          type: object
          properties:
            byLanguage:
              type: object
              additionalProperties:
                type: object
        notices:
          type: object
        appUpdate:
          $ref: '#/components/schemas/AppUpdate'
    RealtimeEvent:
      type: object
      description: 'Trip event envelope (contract.json#realtime). Client gate: reject sequence < 1 or blank tripId; drop a
        seen eventId or sequence <= last seen; a gap (sequence > last + 1) is accepted and triggers a resync; after a terminal
        lifecycle status only afterTerminal kinds are accepted; a location event never replaces the cached projection; resync:
        GET /trips/{tripId} then GET /trips/{tripId}/events?after={sequence}.'
      required:
      - eventId
      - tripId
      - sequence
      - version
      - kind
      - occurredAt
      - serverTime
      properties:
        eventId:
          allOf:
          - $ref: '#/components/schemas/Id'
          description: Server-assigned, unique per committed change (dedupe key).
        tripId:
          $ref: '#/components/schemas/Id'
        sequence:
          type: integer
          minimum: 1
          description: Server-assigned, contiguous per trip. Clients never number events.
        version:
          type: integer
          minimum: 1
          description: Projection version after this event (unchanged for location).
        kind:
          $ref: '#/components/schemas/RealtimeKind'
        occurredAt:
          $ref: '#/components/schemas/Timestamp'
        serverTime:
          allOf:
          - $ref: '#/components/schemas/Timestamp'
          description: Send time, for clock-skew correction.
        projection:
          $ref: '#/components/schemas/TripProjection'
        location:
          $ref: '#/components/schemas/GeoFix'
        etaSeconds:
          $ref: '#/components/schemas/DurationSeconds'
        cancelFee:
          description: 'rider_cancelled / driver_cancelled: fee charged to the rider (null = none/undecided).'
          oneOf:
          - $ref: '#/components/schemas/Money'
          - type: 'null'
        message:
          $ref: '#/components/schemas/Message'
      x-optional:
      - projection
      - location
      - etaSeconds
      - cancelFee
      - message
    OfferEvent:
      type: object
      description: Driver offer feed event.
      required:
      - eventId
      - sequence
      - kind
      - occurredAt
      - serverTime
      - offer
      properties:
        eventId:
          $ref: '#/components/schemas/Id'
        sequence:
          type: integer
          minimum: 1
          description: Per-driver feed cursor for `after` replay.
        kind:
          type: string
          enum:
          - offer_created
          - offer_updated
          - offer_withdrawn
        occurredAt:
          $ref: '#/components/schemas/Timestamp'
        serverTime:
          $ref: '#/components/schemas/Timestamp'
        offer:
          allOf:
          - $ref: '#/components/schemas/Offer'
          description: For offer_withdrawn, offer.status is claimed_elsewhere | expired | withdrawn.
    ConfigEvent:
      type: object
      description: Apps re-fetch the config document on this event.
      required:
      - eventId
      - kind
      - doc
      - zoneId
      - version
      - publishedAt
      - occurredAt
      - serverTime
      properties:
        eventId:
          $ref: '#/components/schemas/Id'
        kind:
          type: string
          const: config_published
        doc:
          $ref: '#/components/schemas/ConfigDocName'
        zoneId:
          $ref: '#/components/schemas/Id'
        version:
          type: integer
          minimum: 1
        publishedAt:
          $ref: '#/components/schemas/Timestamp'
        occurredAt:
          $ref: '#/components/schemas/Timestamp'
        serverTime:
          $ref: '#/components/schemas/Timestamp'
    Error:
      type: object
      required:
      - code
      - message
      - requestId
      - retryable
      properties:
        code:
          $ref: '#/components/schemas/ErrorCode'
        message:
          type: string
        requestId:
          type: string
        retryable:
          type: boolean
        projection:
          description: Current authoritative resource. Always present for version_mismatch and invalid_transition (TripProjection
            for trip commands; Offer / Driver / Rider / Vehicle / ConfigDraft for their commands).
          anyOf:
          - $ref: '#/components/schemas/TripProjection'
          - $ref: '#/components/schemas/Offer'
          - $ref: '#/components/schemas/Driver'
          - $ref: '#/components/schemas/Rider'
          - $ref: '#/components/schemas/Vehicle'
          - $ref: '#/components/schemas/ConfigDraft'
    ConflictError:
      allOf:
      - $ref: '#/components/schemas/Error'
      if:
        properties:
          code:
            enum:
            - version_mismatch
            - invalid_transition
        required:
        - code
      then:
        required:
        - projection
      description: '409 body: version_mismatch | invalid_transition (with projection) or conflict (idempotency key reused
        with another body, offer claimed elsewhere).'
    Page:
      type: object
      description: Generic cursor page Page<T>. Concrete pages below narrow `items`.
      required:
      - items
      - nextCursor
      properties:
        items:
          type: array
          items: {}
        nextCursor:
          type:
          - string
          - 'null'
          description: Opaque; null on the last page.
    TripProjectionPage:
      allOf:
      - $ref: '#/components/schemas/Page'
      - type: object
        properties:
          items:
            type: array
            items:
              $ref: '#/components/schemas/TripProjection'
      description: Page<TripProjection>
    OfferPage:
      allOf:
      - $ref: '#/components/schemas/Page'
