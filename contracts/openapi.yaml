  /push/devices:
    post:
      operationId: registerPushDevice
      summary: Register this device's push token
      description: 'Keyed by token and actor; registering again updates it. v0.18.3: v0.18.3 (owner decision R7, 2026-10-30):
        the server sends a push for every bell notice (Notification) to the subject''s registered fcm devices through Firebase
        Cloud Messaging HTTP v1, after the notice is stored (never inside its transaction), with one retry. Title and body
        are the notice''s, already in the account''s language. A token FCM reports UNREGISTERED or INVALID_ARGUMENT (invalid
        token) is removed. Without the server''s Firebase service account sending is off and nothing else changes. A rider
        with consents.rideUpdates false gets no push (the bell notice is still stored). Drivers have no push consent: the
        operating system''s permission is the switch.'
      tags:
      - Auth
      x-actor:
      - rider
      - driver
      parameters:
