          $ref: '#/components/schemas/Timestamp'
    ErrorGroup:
      type: object
      description: 'v0.16.0 (owner 2026-10-29): the admin "Crashes & errors" section. Reports with the same fingerprint are
        one ErrorGroup. The server also records its own unhandled 5xx errors as app server (scrubbed, platform server).'
