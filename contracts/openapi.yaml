        inUse:
          type: boolean
          description: 'v0.5.3: that driver is online or on a trip, so another driver cannot pick the car (409 conflict, vehicle_in_use).'
        documents:
          type: array
          items:
            $ref: '#/components/schemas/DocumentSummary'
          description: 'v0.5.3: the car''s documents.'
        requiredDocuments:
          type: array
          items:
            $ref: '#/components/schemas/DocumentType'
          description: 'v0.5.3: contract.json#driverOnboarding.documents.required[country].vehicle.'
        fuel:
          type: string
          enum:
          - petrol
          - diesel
          - hybrid
          - electric
          description: 'v0.18.0: the car''s fuel (contract.json#driverOnboarding.settings.fuels).'
        ruleProblems:
          type: array
          items:
            type: string
          description: 'v0.18.3 (admin and fleet-owner views): v0.18.3 (owner decisions of 2026-10-30, driver group 2 re-check
            R2: "admin sees a red warning and cannot approve a rule-breaking car"): POST /admin/vehicles/{vehicleId}/review
            { decision: approved } of a car that breaks the rules now (base year, a category problem, an extra alone) is 409
            invalid_transition, reason vehicle_rules_not_met, details "<category>:<problem>"; rejected and blocked are always
            allowed. Vehicle.ruleProblems (admin and fleet-owner views) lists the same details while the car breaks the rules,
            so the panel shows them in red and disables Approve. Server migration 0035 put every approved car below its country''s
            base year back to pending (the 2012 test car TST G2A included). v0.18.3 (owner decisions of 2026-10-30, driver
            group 2 re-check R2 "Year rule for every car (Recommended)"): every car must be built in or after the country''s
            base year whatever its categories: the smallest minYear among the country''s settings.vehicles.categories that
            are on and are not extraCategories (defaults: SE 2015, FR 2016, TN 2012). An older car is 400 invalid_request,
            reason category_not_allowed, with details "<category>:year_too_old" for each of its categories ("car:year_too_old"
            when it has none), on POST /driver/vehicles and PATCH /admin/vehicles/{vehicleId}.'
        pickable:
          type: boolean
          description: 'v0.18.0: the asking driver can pick this car now. v0.18.0 (owner decision 19: "Driver dont see documents
            of cars only fleet owner ! Driver can only pick car to drive ! He can see all fleet cars and pick one"): a car''s
            documents (registration, insurance, the four photos and any other car type) are uploaded and read only by the
            owner of the car''s fleet (an owner who also drives sees them as owner). A member gets 403 forbidden, reason fleet_owner_only,
            on POST /driver/documents with a car''s ownerId and on GET /driver/documents/{documentId}/file of a car document;
            GET /driver/documents lists only his own documents; his GET /driver/reminders has no car-document lines (they
            go to the owner). He still lists every car of the fleet (GET /driver/vehicles, GET /driver/fleet) with pickable
            and, when false, notPickableReason, and without the cars'' documents and requiredDocuments.'
        notPickableReason:
          type: string
          enum:
          - vehicle_not_approved
          - vehicle_documents_not_approved
          - vehicle_in_use
          description: 'v0.18.0: why not (pickable false); the app says "Can''t be driven".'
