      - paused
      - mode
      properties:
        expectedVersion:
          type: integer
          minimum: 0
          description: Version of the control being replaced; 0 when the zone has none.
        paused:
          type: boolean
        mode:
          oneOf:
          - type: string
            enum:
            - radar
            - exclusive
          - type: 'null'
        note:
          type: string
          maxLength: 1000
    SearchStep:
