paths:
  /auth/otp/request:
    post:
      operationId: requestOtp
      summary: Start a phone sign-in (SMS code)
      description: 'Rate limited per phone and device (429 rate_limited with Retry-After). A test number (contract.json#auth.testSignIn,
        outside production) gets no SMS and accepts the fixed code. v0.15.0: 429 reasons otp_resend_too_soon and otp_too_many
        (contract.json#auth.limits: per phone and app, per address, in an hour); 403 forbidden, reason sign_in_restricted,
        for a number not open for sign-in (the app offers POST /auth/waitlist).'
      tags:
      - Auth
      x-actor:
      - rider
      - driver
      parameters:
      - $ref: '#/components/parameters/RequestId'
      - $ref: '#/components/parameters/ApiVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OtpRequest'
      responses:
        '200':
          description: OK
          headers:
            X-Request-Id:
              description: Echo of the request id (server-generated if absent).
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OtpChallenge'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
      security: []
  /auth/otp/verify:
    post:
      operationId: verifyOtp
      summary: Verify the code and sign in
      description: 'Wrong code → 400 invalid_request (reason invalid_otp_code; retryable until maxAttempts); unknown session
        → 400 invalid_request (reason invalid_otp_session); expired session → 410 otp_expired; too many attempts → 429 (v0.15.0:
        reason otp_too_many_attempts; ask for a new code). With a linkToken the verified phone is linked to the provider account.'
      tags:
      - Auth
      x-actor:
      - rider
      - driver
      parameters:
      - $ref: '#/components/parameters/RequestId'
      - $ref: '#/components/parameters/ApiVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OtpVerifyRequest'
      responses:
        '200':
          description: OK
          headers:
            X-Request-Id:
              description: Echo of the request id (server-generated if absent).
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokens'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
        '410':
          description: 'otp_expired: the code or the session expired; request a new code.'
          headers:
            X-Request-Id:
              description: Echo of the request id (server-generated if absent).
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security: []
