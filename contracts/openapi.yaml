    SurgeTimelineItem:
      type: object
      description: 'v0.7.2: SurgeTimelineItem { at, kind: manual_start | manual_stop | scheduled_start | scheduled_end | smart_change
        | smart_end, multiplier, previous?, by? (the admin of a manual surge; ''smart'' / ''scheduled'' otherwise), profileId?,
        effect? }, newest first, the last `hours` hours (at most 50). Made from the samples (a change of multiplier or source)
        and the zone''s surge schedules (who started or stopped it). effect, on a start or a rise, compares the 30 minutes
        after it with the 30 minutes before: { drivers (free drivers after − before, average), ridesPct (round(100 × (trips
