      description: 'The latest rider-waiting step of the search (v0.5.1, contract.json#dispatch.searchStep). keep_waiting:
        the app asks Keep waiting / Stop (POST /trips/{tripId}/keep-waiting); busy: the search ended.'
      required:
      - id
      - kind
      - message
      - extraMin
      - at
      properties:
        id:
          type: string
          minLength: 1
        kind:
          type: string
