          - rejected
          - blocked
        note:
          type: string
          maxLength: 1000
    ConfigDraftUpdate:
      type: object
      description: 'Exactly one of zoneId or country (v0.8.0). v0.8.0: GET, PUT and POST …/publish on /admin/config/{doc}
        name exactly one of zoneId (the zone''s own document) or country (ISO alpha-2; the country''s standard). Both or neither
        → 400 invalid_request (reason scope_required). v0.8.1: country_rules too may name a zoneId (the zone''s own tips and
        limits) or a country (its standard). A country scope is open to any admin who covers at least one zone of that country
        and holds the document''s permission (owner 2026-10-27).'
      required:
      - expectedVersion
      - document
      properties:
        expectedVersion:
          type: integer
          minimum: 1
          description: Version the caller last saw; stale → 409 version_mismatch.
        zoneId:
          $ref: '#/components/schemas/Id'
        country:
          $ref: '#/components/schemas/CountryCode'
        document:
          oneOf:
          - $ref: '#/components/schemas/RiderAppConfig'
          - $ref: '#/components/schemas/DriverAppConfig'
          - $ref: '#/components/schemas/PricingDocument'
          - $ref: '#/components/schemas/DispatchDocument'
          - $ref: '#/components/schemas/CountryRules'
    ConfigPublishCommand:
      type: object
      description: Exactly one of zoneId or country (v0.8.0).
      required:
      - expectedVersion
      properties:
        expectedVersion:
          type: integer
          minimum: 1
          description: Version the caller last saw; stale → 409 version_mismatch.
        zoneId:
          $ref: '#/components/schemas/Id'
        country:
          $ref: '#/components/schemas/CountryCode'
        note:
          type: string
          maxLength: 1000
    ApprovalDecision:
      type: object
      properties:
        note:
          type: string
          maxLength: 1000
    UseStandardCommand:
      type: object
      description: 'v0.8.0 (owner 2026-10-27): POST /admin/config/{doc}/use-standard { zoneId, expectedVersion } (the zone''s
        draft version; same permission as publish; the admin confirms first) makes a zone with its own document use its country''s
        standard again. The zone''s own live document and draft are removed (every version stays in the history); the server
        re-stamps the standard as version max(standard live, the zone''s own live) + 1 (a history row, the same content) so
        the zone''s apps never see a lower version, and sends config_published to every zone using the standard. No standard
        published for the country → 409 conflict (reason standard_not_published); a zone already using the standard → 409
        (reason already_standard).  v0.8.1: also for country_rules: the zone''s own rules are removed and the standard rules
        are written into the zone''s app documents (next version).'
      required:
      - expectedVersion
      - zoneId
      properties:
        expectedVersion:
          type: integer
          minimum: 1
          description: Version the caller last saw; stale → 409 version_mismatch.
        zoneId:
          $ref: '#/components/schemas/Id'
    StopVisit:
      type: object
      description: 'v0.7.1: one extra stop the driver arrived at (contract.json#stopWaits); stop_waiting runs from arrivedAt
