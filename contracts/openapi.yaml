          - $ref: '#/components/schemas/RiderAppConfig'
          - $ref: '#/components/schemas/DriverAppConfig'
    ConfigPublishCommand:
      type: object
      required:
      - expectedVersion
      - zoneId
      properties:
        expectedVersion:
          type: integer
          minimum: 1
          description: Version the caller last saw; stale → 409 version_mismatch.
        zoneId:
          $ref: '#/components/schemas/Id'
        note:
          type: string
          maxLength: 1000
    ApprovalDecision:
      type: object
      properties:
        note:
          type: string
          maxLength: 1000
