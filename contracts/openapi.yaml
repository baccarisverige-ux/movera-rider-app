            allOf:
            - $ref: '#/components/schemas/Money'
            description: 'v0.18.1: on a cash trip the cashDue of GET /driver/trips/{tripId}/complete-preview that the app
              showed; at most the fare less the wallet (else 400 cash_above_fare). Absent: the fare less the wallet.'
