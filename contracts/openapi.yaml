      summary: Cancel the trip (rider or driver)
      description: 'rider: requested…arrived → cancelled_by_rider (fee per config cancelFees). driver live: accepted/driver_to_pickup/arrived
        → searching (reassign); driver scheduled: accepted → requested; driver onboard+: → cancelled_by_driver. Anything else
