    ZoneRidersOnline:
      type: object
      description: 'v0.18.4 (G3-R4): G3-R4 (owner ''Real numbers only''): riders online per zone = distinct riders who in
        the last windowSeconds called GET /rider/nearby-vehicles (the open rider map) or POST /quotes (zone of the map point
        / pickup), plus riders with an open request (trip requested, searching or offered) in that zone. Served on GET /admin/live/drivers
        as LiveDriverList.ridersOnline [{ zoneId, count }] (the admin''s zones only, zones with 0 included) — the admin Dashboard''s
        ''Riders online'' shows it; no invented numbers.'
      required:
      - zoneId
      - count
      properties:
        zoneId:
          $ref: '#/components/schemas/Id'
        count:
          type: integer
          minimum: 0
    ZoneSupply:
      type: object
      description: 'v0.18.4 (G3-D5): G3-D5 (owner 2026-10-30, ''Fix it''). LiveDriverList.zoneSupply on GET /admin/live/drivers:
        one row per zone of the answer, the Dashboard''s supply/demand rows AND its shortage alert use these same numbers.
        Every driver online or on_trip counts in his zone (LiveDriver.zoneId: the zone of his latest position, else his first
        own zone), stale position included. online = those drivers; free = online drivers with onlineStatus online and no
        active trip; busy = online − free; waiting = trips of the zone in status requested, searching or offered with no driver
        yet (live rides only, not reservations before their search starts). level: ok when waiting = 0; tight when 0 < waiting
        <= free; short when waiting > free. shortage = level short. The panel shows the shortage alert only when at least
        one row has shortage true and names those rows.'
      required:
      - zoneId
      - online
      - free
      - busy
      - waiting
      - level
      - shortage
      properties:
        zoneId:
          $ref: '#/components/schemas/Id'
        online:
          type: integer
          minimum: 0
        free:
          type: integer
          minimum: 0
        busy:
          type: integer
          minimum: 0
        waiting:
          type: integer
          minimum: 0
        level:
          type: string
          enum:
          - ok
          - tight
          - short
        shortage:
          type: boolean
