      - Auth
      x-actor:
      - rider
      - driver
      parameters:
      - $ref: '#/components/parameters/RequestId'
      - $ref: '#/components/parameters/ApiVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OtpVerifyRequest'
      responses:
        '200':
          description: OK
          headers:
            X-Request-Id:
              description: Echo of the request id (server-generated if absent).
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokens'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
        '410':
          description: 'otp_expired: the code or the session expired; request a new code.'
          headers:
            X-Request-Id:
              description: Echo of the request id (server-generated if absent).
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security: []
