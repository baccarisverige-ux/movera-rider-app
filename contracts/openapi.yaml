      allOf:
      - $ref: '#/components/schemas/TripCommand'
      - type: object
        properties:
          previewId:
            allOf:
            - $ref: '#/components/schemas/Id'
            description: 'v0.18.1: the latest complete-preview''s previewId. POST /trips/{tripId}/complete { expectedVersion,
              previewId, cashCollected } with the trip''s latest previewId before expiresAt: complete uses the frozen price
              exactly (total, fareLines, driverEarnings, earlyEnd): no early-end flip, no extra minutes or waiting. On a cash
              trip cashCollected must equal its cashDue (and the wallet part must be unchanged); otherwise 409 conflict, reason
              price_changed, with a fresh preview in the error''s preview field. previewId missing, unknown or expired: complete
              prices the trip as now. If the app sent previewId with cashCollected and that no longer equals the cash part
              of the new price: 409 conflict, reason price_changed, with a fresh preview (error.preview); the trip is not
              completed and the driver is never trapped by a 400. Without previewId (older apps) cashCollected keeps its old
              rule (at most the fare less the wallet, else 400 cash_above_fare).'
