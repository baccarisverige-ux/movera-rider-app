    post:
      operationId: setCancelReason
      summary: Rider tells the reason after a cancel-first
      description: 'Owner decision 6 (v0.4.4), CONTRACT.md §3 "After-cancel reason". Allowed only while the trip is cancelled_by_rider
        and cancellation.reasonCode is still something_else (the code a cancel-first names): sets cancellation.reasonCode
        and cancellation.note. Not a lifecycle transition: status, version, sequence, fee and fare do not change and no realtime
