      x-permission: trips.read
      parameters:
      - $ref: '#/components/parameters/TripId'
      - $ref: '#/components/parameters/RequestId'
      - $ref: '#/components/parameters/ApiVersion'
      responses:
        '200':
          description: OK
          headers:
            X-Request-Id:
              description: Echo of the request id (server-generated if absent).
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TripTrace'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
  /rides/{rideId}:
    get:
      operationId: getRideDeprecated
      summary: Deprecated alias of GET /trips/{tripId}
      description: Removed after v0.3. Response is the TripProjection (tripId + rideId).
      tags:
      - Deprecated
      deprecated: true
      x-actor:
      - rider
      parameters:
      - $ref: '#/components/parameters/RideId'
      - $ref: '#/components/parameters/RequestId'
      - $ref: '#/components/parameters/ApiVersion'
      responses:
        '200':
          description: OK
          headers:
            X-Request-Id:
              description: Echo of the request id (server-generated if absent).
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TripProjection'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
