      type: object
      description: 'POST /admin/vehicles/{vehicleId}/driver { expectedVersion, driverId: Id | null } (vehicles.edit) → Vehicle.
        driverId: a driver of the car''s fleet (else 400 invalid_request, reason driver_not_in_fleet) gets the car picked
        as if he picked it himself (PATCH /driver/profile { vehicleId }): the car approved (409 invalid_transition, vehicle_not_approved)
        with its documents (409 documents_not_approved, vehicle_documents_not_approved; the photos not asked of a test account),
        not in use by another driver who is online or on a trip (409 conflict, vehicle_in_use); the target driver not online
        or on a trip (409 invalid_transition, driver_online); any car he had goes back to the fleet. null takes the car from
        its driver (not while he is online or on a trip, driver_online).'
