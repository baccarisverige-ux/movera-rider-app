# Movera API v0.5.5 — generated from contract.json (+ CONTRACT.md §7). PROPOSED; no backend exists.
openapi: 3.1.0
info:
  title: Movera API
  version: 0.5.5
  description: '**Proposed contract — no backend exists yet.** One future backend serves the Rider (Flutter), Driver (Flutter)
    and Admin (React/TS) apps. Source of truth for names, enums, transitions, realtime and errors is `contract.json` + `CONTRACT.md`
    v0.5.5 in this folder; this file must agree with them.


    Wire rules: ids match `^[A-Za-z0-9_-]{1,64}$`; times are RFC 3339 UTC with `Z`; durations are integer seconds; money is
    `Money {amountMinor, currency}`; keys camelCase, enum values snake_case. Success responses are the bare resource; errors
    are `Error`.


    Every mutation needs `Idempotency-Key`. Trip, offer, driver, rider, vehicle and config commands send `expectedVersion`;
    a stale version is `409 version_mismatch` and a command not allowed from the current status is `409 invalid_transition`,
    both with the current `projection`.


    Extensions: `x-actor` = actors allowed (derived from the token); `x-transition` = contract.json transition command; `x-permission`
    = admin permission (AdminPermission, v0.5.1); `x-permission-v050` = the v0.5.0 value it replaced; `x-permission-by-doc`
    = the permission per config document; `x-read-only` = a POST that changes nothing and takes no Idempotency-Key (v0.5.1);
    `x-server-only` = a document the apps never get; `x-terminal` on TripStatus = terminal set.


    Auth: bearer JWT. Actor (rider|driver|admin), subject id, zone scope and admin role/permissions come from the token, never
    from the body. Token issuance: the Auth tag (v0.5.0, contract.json#auth): phone + SMS code, Apple / Google, refresh rotation;
    test numbers accept a fixed code outside production. Admin: the Admin · Auth tag (v0.5.1, contract.json#auth.admin): e-mail
    and password, a one-time setup link, refresh rotation.'
servers:
- url: https://api.dev.movera.invalid/api/v1
  description: Placeholder; no backend exists.
security:
- bearerAuth: []
tags:
- name: Auth
  description: Sign-in, tokens and push devices for the rider and driver apps (v0.5.0)
- name: Rider · Booking
- name: Trips
  description: Shared trip resource (rider, driver, admin)
- name: Realtime
  description: 'Streams: SSE (or WebSocket) + JSON replay'
- name: Config
- name: Rider · Account
- name: Rider · Payments
- name: Notifications & messages
- name: Support
- name: Driver · Session
- name: Driver · Offers
- name: Driver · Trip
- name: Driver · Money
- name: Driver · Account
- name: Driver · Fleet
- name: Admin · Lists
- name: Admin · Trips
- name: Admin · Dispatch
- name: Admin · People
- name: Admin · Config
- name: Admin · Governance
- name: Admin · Auth
  description: Admin panel sign-in with e-mail and password (v0.5.1)
- name: Maps
  description: Address search, geocoding and road routes through the server (v0.5.1); read-only, no Idempotency-Key
- name: Telemetry
  description: Fire-and-forget app logs, analytics and crashes (v0.5.1); no auth required
- name: Deprecated
  description: Legacy /rides aliases kept for one release
