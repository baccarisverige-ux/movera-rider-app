      description: 'PATCH /admin/vehicles/{vehicleId} { expectedVersion, make?, model?, year?, color?, plate?, seats?, fuel?,
        categoryIds? } (vehicles.edit) → Vehicle. The car after the change must fit every one of its categories (driverOnboarding.vehicleRules:
        400 invalid_request, reason category_not_allowed, details "<category>:<problem>"); a plate another car has is 409
