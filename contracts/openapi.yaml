    DriverPerformance:
      type: object
      description: 'v0.18.4 (G3-D2): G3-D2 (owner 2026-10-30, ''Real numbers''). The server computes the driver''s own numbers
        over the last windowDays days (rolling, server clock) and sends them as Driver.performance on GET /driver/profile
        (the driver himself) and GET /admin/drivers/{driverId} (admin). Same counts as the dispatch score inputs (CONTRACT.md
        §3.6 factors acceptance and cancel): offersAnswerable = the driver''s offers of kind exclusive or assigned sent in
        the window that ended claimed, declined or expired (withdrawn and claimed_elsewhere are not counted: he could not
        answer them); offersAccepted = those claimed; acceptancePct = round(offersAccepted / offersAnswerable × 100); tripsCancelled
        = the driver''s cancels after accepting (driver_cancels) in the window; cancellationPct = round(min(100, tripsCancelled
        / offersAccepted × 100)). acceptancePct is null while offersAnswerable < minOffers; cancellationPct is null while
        offersAccepted < minTrips. rating = the average of the riders'' visible ratings (hidden ratings not counted, 2 decimals),
        null while ratingCount < minRatings. The app shows ''—'' for null (sv/fr/en: same dash). Dispatch (§3.6) uses these
        same counts unrounded as soon as there is any data (the minimums only decide what the apps show); with no data at
        all it uses the §3.6 defaults (rating 4.7, acceptance 85 %, cancels 5 %).'
      required:
      - windowDays
      - from
      - offersAnswerable
      - offersAccepted
      - tripsCancelled
      - ratingCount
      - acceptancePct
      - cancellationPct
      - rating
      properties:
        windowDays:
          type: integer
          minimum: 1
          default: 30
        from:
          $ref: '#/components/schemas/Timestamp'
        offersAnswerable:
          type: integer
          minimum: 0
        offersAccepted:
          type: integer
          minimum: 0
        tripsCancelled:
          type: integer
          minimum: 0
        ratingCount:
          type: integer
          minimum: 0
        acceptancePct:
          type:
          - integer
          - 'null'
          minimum: 0
          maximum: 100
          description: null while offersAnswerable < 10.
        cancellationPct:
          type:
          - integer
          - 'null'
          minimum: 0
          maximum: 100
          description: null while offersAccepted < 10.
        rating:
          type:
          - number
          - 'null'
          minimum: 0
          maximum: 5
          description: null while ratingCount < 1.
