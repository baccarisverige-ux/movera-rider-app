      description: 'v0.18.3: name is the country''s (v0.18.3 (owner decisions of 2026-10-30, driver group 2 re-check R5 "Name
        per country (Recommended)"): a type may carry nameByCountry[country] = { en, sv, fr }; the name shown for a document
        is, in order: the admin''s settings.texts[type].name of the country, nameByCountry[country], name. So the Swedish
        bank statement reads "Relevé bancaire de l’entreprise" in French and the French one "RIB de la société"; the Swedish
        company registration is not called Kbis. The server already puts the country''s name in DocumentTypeInfo.name (GET
        /driver/onboarding/settings documentTypes) and in its notices; the admin panel shows and edits names per country (settings.texts).)'
    AdminCheckCommand:
      type: object
      description: 'v0.18.0 (owner items 8 and 13): an admin marks a kind admin_check document (the info session, or a custom
        one) with POST /admin/drivers/{driverId}/documents/{type}/check { decision: approved | rejected, note? } (documents.approve);
        approved counts for activation like any approved document. Until then the driver sees waiting_for_movera.'
      required:
      - decision
      properties:
        decision:
          type: string
          enum:
          - approved
          - rejected
        note:
          type: string
          maxLength: 1000
    OnboardingSettings:
      type: object
      description: 'v0.18.0, per country only: v0.18.0 (owner decisions of 2026-10-29, driver group 2 "Onboarding", items
        1, 3, 10, 11 and the note check "Use admin''s settings (Recommended)"): the admin''s Drivers › Onboarding and Vehicles
        › Rules settings are one config document per country, onboarding (configDocs.rules, configDocs.countryOnly), saved
        and published with GET/PUT /admin/config/onboarding?country and POST /admin/config/onboarding/publish { country }
        (settings.edit / settings.publish), the same draft / publish / version rule as the other documents. Until a country
        has one published, the server and the apps use defaults[country] (the admin''s own defaults). Publishing changes at
        once: the documents each new and existing account needs (Driver.requiredDocuments, requiredFleetDocuments, Vehicle.requiredDocuments),
        the expiry warnings, the sign-up reminders and the car rules. Tunisia stays present but closed (no documents). v0.18.0
        (owner item 14: "First answer , and admin can change text and add or delete documents so must add on contract and
        server and admin ! Also same for Sweden"): per country the admin also creates new document types (customTypes), changes
        the name and help text of any type (texts), sets which expire (expiringTypes), and adds or removes types in each list.
        Rules: documents.driver, documents.fleet: types whose owner is driver; documents.vehicle: types whose owner is vehicle
        (documents.types). An unknown type or one of the wrong owner is 400 invalid_document. A new type needs a contract
        change (it has names in sv / fr / en and a kind). documents.driver always contains driving_license (admin rule "The
        driving licence is always needed"). expiringTypes: the listed types need an expiry date when an admin approves them
        (documentExpiry). steps: every id of stepIds once, at least one on, days within limits.stepDays. The server stores
        and serves them; the admin panel shows the funnel with them. signUpReminders.everyDays within limits.remindEveryDays,
        stuckAfterDays within limits.stuckAfterDays. expiry.warnDays: 1 to 3 numbers within limits.warnDays, largest first,
        each smaller than the one before. vehicles.categories: each category of the catalog at most once; minYear, minSeats
        within limits; a category that is on allows at least one fuel of fuels; vehicles.warnDays within limits.vehicleWarnDays.
        customTypes: ids unique and of idPattern; the scope list a custom type is in matches its owner (driver → documents.driver,
        fleet → documents.fleet, vehicle → documents.vehicle); names and help in sv, fr and en. v0.18.3: guides and validMonths
        keys are types of the country (contract types or its customTypes); guide lines within guideLimits; validMonths within
        limits.validMonths.'
      required:
      - version
      - country
      - documents
      - expiringTypes
      - steps
      - signUpReminders
      - expiry
      - vehicles
      properties:
        version:
          type: integer
          minimum: 0
          description: Stamped by the server; 0 = the contract defaults (nothing published).
        publishedAt:
          $ref: '#/components/schemas/Timestamp'
        country:
          $ref: '#/components/schemas/CountryCode'
        documents:
          $ref: '#/components/schemas/OnboardingDocumentLists'
        expiringTypes:
          type: array
          items:
            anyOf:
            - $ref: '#/components/schemas/DocumentType'
            - type: string
              pattern: ^draft:.{1,40}$
              description: A new custom type of this draft, named by its draftKey; the server puts the id in its place.
          uniqueItems: true
          description: Types that need an expiry date when approved (contract.json#driverOnboarding.documentExpiry).
        steps:
          type: array
          items:
            $ref: '#/components/schemas/OnboardingStep'
          minItems: 1
        signUpReminders:
          type: object
          description: 'v0.18.0 (note check: "Sign-up reminders to stuck drivers (every 2 days, stuck after 10 days) also
            go live (push ''Finish your sign-up''), editable in admin"): while settings.signUpReminders.on, an account that
            is pending or on_hold and still waits on itself (details not sent, or a required file document of Driver.requiredDocuments
            / requiredFleetDocuments missing or rejected) gets the notice kind finish_sign_up (GET /notifications, deepLink
            movera-driver://home) every everyDays days counted from sign-up, then from the last one. From stuckAfterDays after
            sign-up the admin driver view shows signUp.stuck true. No reminder while Movera is the one to act (documents in
            review, info session, activation).'
          required:
          - 'on'
          - everyDays
          - stuckAfterDays
          properties:
            'on':
              type: boolean
            everyDays:
              type: integer
              minimum: 1
              maximum: 30
            stuckAfterDays:
              type: integer
              minimum: 2
              maximum: 90
        expiry:
          type: object
          description: 'From the largest of settings.expiry.warnDays (cars: settings.vehicles.warnDays) before expiresAt the
            document is expiring (shown orange). Push (GET /notifications, kind document_expiring, data { documentId, type,
            scope, vehicleId?, daysLeft, expiresAt }) once per warning day reached (30, 7, 1 by default; when several are
            reached at once only the smallest is sent); at expiry one notice kind document_expired. deepLink movera-driver://documents/{type}
            (cars: ?vehicleId=).'
          required:
          - warnDays
          - blockAtExpiry
          properties:
            warnDays:
              type: array
              items:
                type: integer
                minimum: 1
                maximum: 90
              minItems: 1
              maxItems: 3
            blockAtExpiry:
              type: boolean
              description: 'settings.expiry.blockAtExpiry true (default): with any document of Driver.requiredDocuments (and
                requiredFleetDocuments for a fleet owner) expired, POST /driver/availability online is 409 documents_not_approved,
                reason documents_expired, details "<scope>:<type>". false: an expired document does not stop going online
                (it still shows red). Car documents follow settings.vehicles.autoHold the same way (reason vehicle_documents_not_approved).'
        customTypes:
          type: array
          items:
            $ref: '#/components/schemas/CustomDocumentType'
          description: 'v0.18.0 (owner item 14): a document type the admin creates for one country. { id, owner: driver |
            fleet | vehicle, kind: file | admin_check, expires: boolean, name: { sv, fr, en }, help: { sv, fr, en } } (all
            three languages, non-empty). The server makes the id (custom_ + 10 lower-case letters or digits) the first time
            the draft is saved: a new entry is sent without id and with draftKey (any short text the panel chooses), and the
            lists (documents.driver / fleet / vehicle, expiringTypes) may name it by "draft:<draftKey>"; the server replaces
            each with the new id and drops draftKey. An id once made never changes; an entry with an id the country does not
            have is 400 invalid_document. expires true puts the type in expiringTypes, false takes it out (the server keeps
            the two in step). owner fleet is a company document of a fleet account (owner_kind driver); owner vehicle a car
            document. Deleting an entry removes the type from the country: it must not stay in a list. Documents already uploaded
            for it stay stored.'
        texts:
          type: object
          description: 'v0.18.0 (owner item 14): texts[type] = { name?: { sv, fr, en }, help?: { sv, fr, en } } replaces the
            contract name, and adds a help / checklist text, of a contract type in this country. A key that is not a contract
            type of documents.types is 400 invalid_document (a custom type carries its own texts).'
          additionalProperties:
            $ref: '#/components/schemas/DocumentTypeTexts'
        documentTypes:
          type: object
          readOnly: true
          description: 'Only in GET /driver/onboarding/settings. GET /driver/onboarding/settings → OnboardingSettings of the
            driver''s country (published, else defaults; version 0 = defaults), so the app offers only the car categories
            a car fits, asks the photos and shows the warnings the server uses. A driver with no country yet names it: ?country=SE.
            v0.18.0 (item 14): the answer also has documentTypes: { [type]: { owner, kind, expires, name, help? } } for every
            type in the country''s lists, contract types with the admin''s texts and the custom types, so the app renders
            a type it does not know from this data. v0.18.3: DocumentTypeInfo.name is the country''s name (documents.namesByCountry);
            DocumentTypeInfo.guide (R8) and validMonths (R9) when the country has them.'
          additionalProperties:
            $ref: '#/components/schemas/DocumentTypeInfo'
        vehicles:
          type: object
          description: 'v0.18.0 (owner item 11: "Make them real (Recommended)"): POST /driver/vehicles is checked against
            settings.vehicles of the fleet''s country. Each categoryId must fit: the category on, year ≥ minYear, seats ≥
            minSeats, fuel in fuels; else 400 invalid_request, reason category_not_allowed, details "<category>:<problem>"
            with problem category_off, year_too_old, too_few_seats, fuel_not_allowed or fuel_required (fuel missing while
            the category does not allow every fuel). v0.18.3: a category with no rule in the document (e.g. child_seat) is
            no longer skipped: the car must still meet the base year (baseYear) and an extra needs a ride category (extraCategories).
            With photosNeeded the four photo types (settings.photoTypes) are added to Vehicle.requiredDocuments, uploaded
            like other car documents (POST /driver/documents, ownerId = vehicleId) and approved by an admin; the car cannot
            be picked or driven without them.'
          required:
          - categories
          - warnDays
          - autoHold
          - photosNeeded
          properties:
            categories:
              type: array
              items:
                $ref: '#/components/schemas/VehicleCategoryRule'
            warnDays:
              type: integer
              minimum: 1
              maximum: 120
            autoHold:
              type: boolean
              description: An expired car document takes the car off the road.
            photosNeeded:
              type: boolean
              description: The four photo types are required car documents.
        guides:
          type: object
          description: 'v0.18.3 (owner decisions of 2026-10-30, driver group 2 re-check R8 "Admin edits all text (Recommended)"):
            guides[type] = { checklist: LocalText[], tips: LocalText[] } (each 0 to 10 lines, every line in sv, fr and en,
            at most 300 characters) is the upload guide of that document type in this country (a contract type or the country''s
            own custom type; any other key is 400 invalid_document). The driver app shows the admin''s lines; a type with
            no guide (or an empty list) falls back to the app''s built-in text; the drawing stays Movera''s. Served to the
            app in DocumentTypeInfo.guide.'
          additionalProperties:
            $ref: '#/components/schemas/DocumentGuide'
        validMonths:
          type: object
          description: 'v0.18.3 (owner decisions of 2026-10-30, driver group 2 re-check R9 "Auto 6 months, editable (Recommended)"):
            validMonths[type] = N (1 to 120) is how long a document of that type is valid from its issue date in this country
            (default FR urssaf_certificate 6). When an admin approves it with issuedAt (the date on the paper, not in the
            future) and no expiresAt, the server sets expiresAt = issuedAt + N months; an expiresAt the admin types wins.
            A type of expiringTypes still needs one of the two (400 expiry_required). Any key must be a type of the country
            (400 invalid_document).'
