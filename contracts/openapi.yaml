      description: Wrong code → 400 invalid_request (reason invalid_otp_code; retryable until maxAttempts); unknown session
        → 400 invalid_request (reason invalid_otp_session); expired session → 410 otp_expired; too many attempts → 429. With
        a linkToken the verified phone is linked to the provider account.
