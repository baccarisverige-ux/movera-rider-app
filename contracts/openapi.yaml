  /admin/config/{doc}/use-standard:
    post:
      operationId: adminUseStandardConfig
      summary: Go back to the country standard (v0.8.0)
      description: 'v0.8.0 (owner 2026-10-27): POST /admin/config/{doc}/use-standard { zoneId, expectedVersion } (the zone''s
        draft version; same permission as publish; the admin confirms first) makes a zone with its own document use its country''s
        standard again. The zone''s own live document and draft are removed (every version stays in the history); the server
        re-stamps the standard as version max(standard live, the zone''s own live) + 1 (a history row, the same content) so
        the zone''s apps never see a lower version, and sends config_published to every zone using the standard. No standard
        published for the country → 409 conflict (reason standard_not_published); a zone already using the standard → 409
        (reason already_standard).  v0.8.1: also for country_rules: the zone''s own rules are removed and the standard rules
        are written into the zone''s app documents (next version). The answer names the zone and the standard''s new version.'
      tags:
      - Admin · Config
      x-actor:
      - admin
      x-permission: settings.publish
      x-permission-by-doc:
        rider_app_config: settings.publish
        driver_app_config: settings.publish
        pricing: settings.publish
        dispatch: dispatch.edit
      parameters:
      - $ref: '#/components/parameters/ConfigDoc'
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/RequestId'
      - $ref: '#/components/parameters/ApiVersion'
      requestBody:
