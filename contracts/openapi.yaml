    RealtimeEvent:
      type: object
      description: 'Trip event envelope (contract.json#realtime). Client gate: reject sequence < 1 or blank tripId; drop a
        seen eventId or sequence <= last seen; a gap (sequence > last + 1) is accepted and triggers a resync; after a terminal
        lifecycle status only afterTerminal kinds are accepted; a location event never replaces the cached projection; resync:
        GET /trips/{tripId} then GET /trips/{tripId}/events?after={sequence}.'
      required:
      - eventId
      - tripId
      - sequence
      - version
      - kind
      - occurredAt
      - serverTime
      properties:
        eventId:
          allOf:
          - $ref: '#/components/schemas/Id'
          description: Server-assigned, unique per committed change (dedupe key).
        tripId:
          $ref: '#/components/schemas/Id'
        sequence:
          type: integer
          minimum: 1
          description: Server-assigned, contiguous per trip. Clients never number events.
        version:
          type: integer
          minimum: 1
          description: Projection version after this event (unchanged for location).
        kind:
          $ref: '#/components/schemas/RealtimeKind'
        occurredAt:
          $ref: '#/components/schemas/Timestamp'
        serverTime:
          allOf:
          - $ref: '#/components/schemas/Timestamp'
          description: Send time, for clock-skew correction.
        projection:
          $ref: '#/components/schemas/TripProjection'
        location:
          $ref: '#/components/schemas/GeoFix'
        etaSeconds:
          $ref: '#/components/schemas/DurationSeconds'
        cancelFee:
          description: 'rider_cancelled / driver_cancelled: fee charged to the rider (null = none/undecided).'
          oneOf:
          - $ref: '#/components/schemas/Money'
          - type: 'null'
        message:
          $ref: '#/components/schemas/Message'
      x-optional:
      - projection
      - location
      - etaSeconds
      - cancelFee
      - message
