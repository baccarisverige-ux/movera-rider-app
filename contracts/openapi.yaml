    ConfigDocName:
      type: string
      enum:
      - rider_app_config
      - driver_app_config
      - pricing
      - dispatch
      - country_rules
      x-server-only:
      - pricing
      - dispatch
      - country_rules
      description: app documents are served to the apps; pricing and dispatch (v0.5.1) are server-only (x-server-only, contract.json#configDocs).
    ConfigDraft:
      type: object
      description: 'v0.8.0: zoneId for a zone''s document, country for a country''s standard or country_rules (v0.8.0: GET,
        PUT and POST …/publish on /admin/config/{doc} name exactly one of zoneId (the zone''s own document) or country (ISO
        alpha-2; the country''s standard). Both or neither → 400 invalid_request (reason scope_required). v0.8.1: country_rules
        too may name a zoneId (the zone''s own tips and limits) or a country (its standard). A country scope is open to any
        admin who covers at least one zone of that country and holds the document''s permission (owner 2026-10-27).)'
      required:
      - doc
      - version
      - liveVersion
      - document
      - updatedAt
      properties:
        doc:
          $ref: '#/components/schemas/ConfigDocName'
        zoneId:
          $ref: '#/components/schemas/Id'
        country:
          $ref: '#/components/schemas/CountryCode'
        usesStandard:
          type: boolean
          description: 'v0.8.0: the zone has no own published document of this kind and uses its country''s standard (configDocs.standard);
            the draft starts from the standard.'
        version:
          type: integer
          minimum: 1
          description: Draft version (expectedVersion for PUT/publish).
        liveVersion:
          type: integer
          minimum: 0
          description: Version of the published document the apps read.
        document:
          oneOf:
          - $ref: '#/components/schemas/RiderAppConfig'
          - $ref: '#/components/schemas/DriverAppConfig'
          - $ref: '#/components/schemas/PricingDocument'
          - $ref: '#/components/schemas/DispatchDocument'
          - $ref: '#/components/schemas/CountryRules'
        updatedAt:
          $ref: '#/components/schemas/Timestamp'
        updatedBy:
          $ref: '#/components/schemas/Id'
    ConfigPublication:
      type: object
      required:
      - doc
      - version
      - publishedAt
      properties:
        doc:
          $ref: '#/components/schemas/ConfigDocName'
        zoneId:
          $ref: '#/components/schemas/Id'
        country:
          $ref: '#/components/schemas/CountryCode'
        version:
          type: integer
          minimum: 1
          description: Stamped by the server (contract.json#configVersion).
        publishedAt:
          $ref: '#/components/schemas/Timestamp'
    CountryRules:
      type: object
      description: 'v0.8.1, server-only, per zone or per country (its standard): v0.8.1 (owner 2026-10-28: Tips & limits apply
        only to the zones chosen at the top; for the whole country the admin chooses all zones): tips, raiseSteps and driverBonus
        are the country_rules document { version, publishedAt, country, currency, tips: [AmountOption], raiseSteps: [AmountOption],
        driverBonus: { defaultLimit, hardMax } }, like the other documents published per zone (?zoneId, the zone''s own) or
        per country (?country, the country''s standard). A zone''s rules are its own once published for it, else its country''s
        standard (usesStandard: true); a zone with its own rules never uses the standard again until ''Go back to Standard''
        (useStandard, also for country_rules). Publishing a zone''s own rules writes, in the same transaction, RiderAppConfig.tips
        / raiseSteps and DriverAppConfig.driverBonus of that zone''s live and draft app documents; a zone that uses the standard
        app documents gets its own, copied from the standard with the new values (as publishPricing does), each changed one
        as its next version with config_published. Publishing the standard rules writes them into the standard app documents
        and into the own app documents of every zone of the country that has no own rules; zones with their own rules keep
        them. While a zone''s rules (own or standard) are live, PUT and publish of that zone''s app documents take those three
        fields from them, whatever the admin sent; the dispatch driver bonus limit of a trip is its zone''s rules. The admin
        panel publishes to exactly the zones chosen at the top (''All zones'' = every zone of the country it may work in,
        each as its own) and to the standard only when it is chosen.'
      required:
      - version
      - publishedAt
      - country
      - currency
      - tips
      - raiseSteps
      - driverBonus
      properties:
        version:
          type: integer
          minimum: 1
          description: Stamped by the server.
        publishedAt:
          $ref: '#/components/schemas/Timestamp'
        country:
          $ref: '#/components/schemas/CountryCode'
        currency:
          $ref: '#/components/schemas/CurrencyCode'
        tips:
          type: array
          items:
            $ref: '#/components/schemas/AmountOption'
        raiseSteps:
          type: array
          items:
            $ref: '#/components/schemas/AmountOption'
        driverBonus:
          $ref: '#/components/schemas/DriverBonusLimits'
      x-server-only: true
    FeeRule:
      type: object
      required:
      - freeMin
      - type
      - value
      - min
      - max
      description: 'Cancel fee rule. live: freeMin = minutes after accept; reservation: freeMin = minutes before pickup. fixed:
        value is minor units; percent: value is 0–100 of the fare, rounded half-up to a whole minor unit, then clamped to
        min/max.'
      properties:
        freeMin:
          type: integer
          minimum: 0
        type:
          type: string
          enum:
          - fixed
          - percent
        value:
          type: number
          minimum: 0
        min:
          oneOf:
          - $ref: '#/components/schemas/Money'
          - type: 'null'
        max:
          oneOf:
          - $ref: '#/components/schemas/Money'
          - type: 'null'
      allOf:
      - if:
          properties:
            type:
              const: percent
          required:
          - type
        then:
          properties:
            value:
              maximum: 100
      - if:
          properties:
            type:
              const: fixed
          required:
          - type
        then:
          properties:
            value:
              type: integer
