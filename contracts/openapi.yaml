      required:
      - 'on'
      properties:
        'on':
          type: boolean
          description: false = no new reservations for this driver; true = on, and the late-cancel pause is skipped while
            it lasts.
        until:
          description: When the admin's choice ends; null = until an admin changes it.
          oneOf:
          - $ref: '#/components/schemas/Timestamp'
          - type: 'null'
    VehicleStatus:
      type: string
