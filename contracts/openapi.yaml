      - payment_updated
      - rating_updated
      - message
      description: Trip event kinds. After a terminal status only x-after-terminal kinds pass the client gate.
    FareLineCode:
      type: string
      enum:
      - base
      - distance
      - time
      - stops
      - waiting
      - pickup_fee
      - surge
      - discount
      - cancel_fee
      - app_fee
      - minimum_adjust
      - maximum_adjust
      - stop_waiting
      - extras
      - airport
      - reservation_fee
      - fixed_route
      - rounding
      - outstanding_fee
      - rider_raise
      - pickup_pay
      - driver_bonus
      x-rider:
      - base
      - distance
      - time
      - stops
      - waiting
      - pickup_fee
      - surge
      - discount
      - cancel_fee
      - app_fee
      - minimum_adjust
      - maximum_adjust
      - stop_waiting
      - extras
      - airport
      - reservation_fee
      - fixed_route
      - rounding
      - outstanding_fee
      - rider_raise
      x-driver-only:
      - pickup_pay
      - driver_bonus
      x-aliases:
        pickup_pay: pickup_fee
      description: 'Fare line codes (contract.json#fareLines). x-rider lines make the rider''s fare; x-driver-only lines (pickup_pay,
        driver_bonus) are shown to the driver and admin only and never paid by the rider. v0.4 documents named the rider''s
        pickup line pickup_pay: x-aliases.'
    FareLine:
      type: object
      description: 'One fare line; the meaning of each code: contract.json#fareLines.meaning (v0.5.1).'
      required:
      - code
      - amount
      properties:
        code:
          $ref: '#/components/schemas/FareLineCode'
        amount:
          $ref: '#/components/schemas/Money'
        sourceTripId:
          allOf:
          - $ref: '#/components/schemas/Id'
          description: 'outstanding_fee only: the earlier trip whose unpaid fee this is (v0.5.1, CONTRACT.md §3.7).'
    QuoteRef:
      type: object
      required:
      - quoteId
      - total
      - expiresAt
      properties:
        quoteId:
          $ref: '#/components/schemas/Id'
        total:
          $ref: '#/components/schemas/Money'
        expiresAt:
          $ref: '#/components/schemas/Timestamp'
    Waiting:
      type: object
      required:
      - arrivedAt
      - freeUntil
