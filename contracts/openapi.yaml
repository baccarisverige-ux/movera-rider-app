            $ref: '#/components/schemas/SurgeTimelineItem'
    SurgeLevel:
      type: string
      enum:
      - low
      - medium
      - high
      description: 'v0.7.2: low: multiplier above 1.0 and below 1.5 (×1.1–×1.4); medium: 1.5 to 2.5 inclusive; high: above
        2.5. A zone at 1.0 is not listed (no colour).'
    ZoneBounds:
      type: object
      required:
      - south
      - west
      - north
      - east
      properties:
        south:
          type: number
          minimum: -90
          maximum: 90
        west:
          type: number
          minimum: -180
          maximum: 180
        north:
          type: number
          minimum: -90
          maximum: 90
        east:
          type: number
          minimum: -180
          maximum: 180
    DriverSurgeZone:
      type: object
      description: 'v0.7.2: never the multiplier.'
      required:
      - zoneId
      - level
      - bounds
      properties:
        zoneId:
          $ref: '#/components/schemas/Id'
        level:
          $ref: '#/components/schemas/SurgeLevel'
        bounds:
          $ref: '#/components/schemas/ZoneBounds'
    DriverSurgeMap:
      type: object
      description: 'v0.7.2: v0.7.2 (owner 2026-10-28): the driver app shows surges ONLY as coloured zones on the Home map.
        No text, no number and no money on the map; the driver never sees the multiplier.'
      required:
      - at
      - zones
      properties:
        at:
          $ref: '#/components/schemas/Timestamp'
        zones:
          type: array
          items:
            $ref: '#/components/schemas/DriverSurgeZone'
    ContentSlot:
      type: string
      enum:
      - driver-home
      - driver-event
      - rider-banner-1
      - rider-banner-2
      - rider-banner-3
      - rider-banner-4
      - rider-banner-5
      - rider-banner-6
      - help
      - legal
      - app-versions
      - driver-info-session
    ContentText:
      type: object
      required:
      - sv
      - fr
      - en
      properties:
        sv:
          type: string
          minLength: 1
          maxLength: 4000
        fr:
          type: string
          minLength: 1
          maxLength: 4000
        en:
          type: string
          minLength: 1
          maxLength: 4000
    AppVersionPair:
      type: object
      required:
      - min
      - recommended
      properties:
        min:
          type: string
          pattern: ^\d+\.\d+\.\d+$
        recommended:
          type: string
          pattern: ^\d+\.\d+\.\d+$
    AppVersions:
      type: object
      required:
      - rider
      - driver
      properties:
        rider:
          $ref: '#/components/schemas/AppVersionPair'
        driver:
          $ref: '#/components/schemas/AppVersionPair'
    ContentItem:
      type: object
      description: 'v0.10.0: ContentItem { slot, zoneId, version, publishedAt, publishedBy, title, text: { sv, fr, en } (all
        three required, non-empty), image? (https URL), expiresAt? (future Timestamp; after it the apps hide the item), reaccept?
        (legal only), versions? (app-versions only: { rider: { min, recommended }, driver: { min, recommended } }, semantic
        x.y.z, recommended ≥ min) }'
      required:
      - slot
      - zoneId
      - version
      - publishedAt
      - title
      - text
      properties:
        slot:
          $ref: '#/components/schemas/ContentSlot'
        zoneId:
          $ref: '#/components/schemas/Id'
        version:
          type: integer
          minimum: 1
        publishedAt:
          $ref: '#/components/schemas/Timestamp'
        publishedBy:
          $ref: '#/components/schemas/Id'
        title:
          type: string
          minLength: 1
          maxLength: 200
        text:
          $ref: '#/components/schemas/ContentText'
        image:
          type: string
          format: uri
          pattern: ^https://
        expiresAt:
          $ref: '#/components/schemas/Timestamp'
        reaccept:
          type: boolean
          description: legal only
        versions:
          $ref: '#/components/schemas/AppVersions'
    ContentList:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ContentItem'
    ContentPublishCommand:
      type: object
      required:
      - zoneIds
      - title
      - text
      properties:
        zoneIds:
          type: array
          items:
            $ref: '#/components/schemas/Id'
          minItems: 1
        title:
          type: string
          minLength: 1
          maxLength: 200
        text:
          $ref: '#/components/schemas/ContentText'
        image:
          type: string
          pattern: ^https://
        expiresAt:
          $ref: '#/components/schemas/Timestamp'
        reaccept:
          type: boolean
        versions:
          $ref: '#/components/schemas/AppVersions'
    ContentRollbackCommand:
      type: object
      required:
      - zoneId
      - version
      properties:
        zoneId:
          $ref: '#/components/schemas/Id'
        version:
          type: integer
          minimum: 1
    TermsAcceptCommand:
      type: object
      required:
      - contentVersion
      properties:
        contentVersion:
          type: integer
          minimum: 1
    TermsAcceptance:
      type: object
      required:
      - actor
      - subjectId
      - zoneId
      - contentVersion
      - acceptedAt
      properties:
        actor:
          type: string
          enum:
          - rider
          - driver
        subjectId:
          $ref: '#/components/schemas/Id'
        zoneId:
          $ref: '#/components/schemas/Id'
        contentVersion:
          type: integer
          minimum: 1
        acceptedAt:
          $ref: '#/components/schemas/Timestamp'
    TermsAcceptanceList:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/TermsAcceptance'
    ZoneNames:
      type: object
      description: names.sv, names.fr and names.en are all required (1-80 characters). The apps show the name in the app language.
      required:
      - sv
      - fr
      - en
      properties:
        sv:
          type: string
          minLength: 1
          maxLength: 80
        fr:
          type: string
          minLength: 1
          maxLength: 80
        en:
          type: string
          minLength: 1
          maxLength: 80
    ZoneKind:
      type: string
      enum:
      - operating
      - airport
    ZonePoint:
      type: array
      items:
        type: number
      minItems: 2
      maxItems: 2
      description: '[lat, lng]'
    ZonePolygon:
      type: array
      items:
        $ref: '#/components/schemas/ZonePoint'
      minItems: 3
      maxItems: 500
      description: 'The outline as the admin draws it: 3 to 500 points [lat, lng] (lat -90..90, lng -180..180), in order,
        not closed (the last point is not the first again), not self-crossing. The server computes bounds (the polygon''s
        bounding rectangle) and, on create and on a new outline, center (the middle of bounds); both are ignored in a request.
        A point on the edge is inside.'
    Zone:
      type: object
      description: 'v0.11.0: Zone { zoneId, names: { sv, fr, en }, country (ISO 3166 alpha-2), currency (SEK | EUR | TND),
        timeZone (IANA), kind: operating | airport, polygon: [[lat, lng], ...], bounds: { south, west, north, east }, center:
        { lat, lng }, open, version, createdAt, updatedAt, updatedBy? } Ids are fixed at creation and never change (^[A-Za-z0-9_-]{1,64}$).
        Existing ids stay (Stockholm Z001-Z009). A new city zone is <country>-<two capital letters> (FR-PC Paris & Ile-de-France,
        TN-TC Grand Tunis, the ids the apps already use); an airport zone is the IATA code (ARN, BMA, CDG, ORY).'
      required:
      - zoneId
      - names
      - country
      - currency
      - timeZone
      - kind
      - polygon
      - bounds
      - center
      - open
      - version
      properties:
        zoneId:
          $ref: '#/components/schemas/Id'
        names:
          $ref: '#/components/schemas/ZoneNames'
        country:
          $ref: '#/components/schemas/CountryCode'
        currency:
          $ref: '#/components/schemas/CurrencyCode'
        timeZone:
          type: string
          pattern: ^[A-Za-z_]+(/[A-Za-z0-9_+\-]+)*$
        kind:
          $ref: '#/components/schemas/ZoneKind'
        polygon:
          $ref: '#/components/schemas/ZonePolygon'
        bounds:
          $ref: '#/components/schemas/ZoneBounds'
        center:
          type: object
          required:
          - lat
          - lng
          properties:
            lat:
              type: number
            lng:
              type: number
        open:
          type: boolean
        version:
          type: integer
          minimum: 1
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        updatedAt:
          $ref: '#/components/schemas/Timestamp'
        updatedBy:
          $ref: '#/components/schemas/Id'
    ZoneList:
      type: object
      required:
      - zones
      properties:
        zones:
          type: array
          items:
            $ref: '#/components/schemas/Zone'
    ZoneCreateCommand:
      type: object
      description: A new zone starts closed unless open is true. 409 conflict zone_exists when the id is taken.
      required:
      - zoneId
      - names
      - country
      - currency
      - timeZone
      - polygon
      properties:
        zoneId:
          $ref: '#/components/schemas/Id'
        names:
          $ref: '#/components/schemas/ZoneNames'
        country:
          $ref: '#/components/schemas/CountryCode'
        currency:
          $ref: '#/components/schemas/CurrencyCode'
        timeZone:
          type: string
          pattern: ^[A-Za-z_]+(/[A-Za-z0-9_+\-]+)*$
        kind:
          $ref: '#/components/schemas/ZoneKind'
        polygon:
          $ref: '#/components/schemas/ZonePolygon'
        open:
          type: boolean
          description: default false
    ZoneUpdateCommand:
      type: object
      description: Zone.version starts at 1 and goes up by one with every change; PUT, open and close send expectedVersion
        (409 version_mismatch with the current zone otherwise). country, currency and timeZone cannot change after creation
        (400 invalid_request zone_field_fixed).
      required:
      - expectedVersion
      properties:
        expectedVersion:
          type: integer
          minimum: 1
          description: Version the caller last saw; stale → 409 version_mismatch.
        names:
          $ref: '#/components/schemas/ZoneNames'
        kind:
          $ref: '#/components/schemas/ZoneKind'
        polygon:
          $ref: '#/components/schemas/ZonePolygon'
    ZoneOpenCommand:
      type: object
      required:
      - expectedVersion
      properties:
        expectedVersion:
          type: integer
          minimum: 1
          description: Version the caller last saw; stale → 409 version_mismatch.
        note:
          type: string
          maxLength: 1000
