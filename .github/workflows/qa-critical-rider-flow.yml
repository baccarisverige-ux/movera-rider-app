name: QA critical Rider flow

on:
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'web/**'
      - '.github/workflows/qa-critical-rider-flow.yml'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/qa-critical-rider-flow.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  critical-rider-flow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install --save-dev playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null

      - name: Wait for target Pages build
        env:
          TARGET_LIVE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.sha }}
        run: |
          SHORT="${TARGET_LIVE_SHA::8}"
          for i in $(seq 1 48); do
            HTML=$(curl -fsSL -H 'Cache-Control: no-cache' "https://baccarisverige-ux.github.io/movera-rider-app/?qa_wait=$RANDOM" || true)
            if printf '%s' "$HTML" | grep -q "flutter_bootstrap.${SHORT}.js"; then
              # index.html alone is not enough: right after a deploy the
              # versioned bootstrap or main bundle can still be missing from
              # the CDN edge, and the page then never starts.
              BOOT=$(curl -fsSL -H 'Cache-Control: no-cache' "https://baccarisverige-ux.github.io/movera-rider-app/flutter_bootstrap.${SHORT}.js?qa_wait=$RANDOM" || true)
              if printf '%s' "$BOOT" | grep -q "main.${SHORT}.dart.js" &&
                curl -fsSI -H 'Cache-Control: no-cache' "https://baccarisverige-ux.github.io/movera-rider-app/main.${SHORT}.dart.js?qa_wait=$RANDOM" >/dev/null; then
                echo "LIVE_BUILD=$SHORT" >> "$GITHUB_ENV"
                echo "Testing live Pages build $SHORT"
                exit 0
              fi
            fi
            sleep 10
          done
          echo "Target deployed bundle for $SHORT was not found" >&2
          exit 1

      - name: Payment, Finding to Waiting, standalone Cancel, and standalone Wallet
        run: |
          cat > qa-critical.mjs <<'JS'
          import { chromium } from 'playwright';
          import fs from 'fs';

          const base = 'https://baccarisverige-ux.github.io/movera-rider-app/';
          const evidence = {};

          // Flutter parks its 'Enable accessibility' placeholder at (-1,-1), outside
          // the viewport, so a Playwright click on it never lands and every
          // label lookup silently fell back to fixed coordinates. Click it
          // through the DOM and wait for the semantics tree instead.
          async function enableA11y(page) {
            await page.evaluate(() => document.querySelector('flt-semantics-placeholder')?.click());
            await page.waitForFunction(() => document.querySelector('flt-semantics'), null, { timeout: 5000 }).catch(() => {});
            await page.waitForTimeout(400);
          }

          async function waitOwner(page, expected, label, timeout = 15000) {
            await page.waitForFunction(
              owner => window.moveraMapOwner === owner,
              expected,
              { timeout },
            ).catch(async error => {
              const actual = await page.evaluate(() => window.moveraMapOwner || 'none');
              throw new Error(`${label}: expected map owner ${expected}, got ${actual}`, { cause: error });
            });
          }

          async function newContext(browser, { standalone = false } = {}) {
            const context = await browser.newContext({
              viewport: { width: 390, height: 844 },
              deviceScaleFactor: 1,
              isMobile: true,
              hasTouch: true,
              locale: 'en-US',
              geolocation: { latitude: 59.33258, longitude: 18.0649 },
              permissions: ['geolocation'],
            });
            // Round 4: the app speaks the zone's language (sv in Stockholm); these
            // checks read the English copy, so pin the rider's choice to English.
            await context.addInitScript(() => localStorage.setItem('flutter.movera_app_language', '"en"'));
            if (standalone) {
              await context.addInitScript(() => {
                Object.defineProperty(navigator, 'standalone', {
                  configurable: true,
                  get: () => true,
                });
              });
            }
            return context;
          }

          async function openHome(page, name) {
            const errors = [];
            page.on('pageerror', error => errors.push(String(error)));
            await page.goto(base + `?critical=${name}&v=${Date.now()}`, {
              waitUntil: 'networkidle',
              timeout: 120000,
            });
            await page.waitForTimeout(4500);
            await enableA11y(page);
            if (errors.length) throw new Error(`${name}: page errors: ${errors.join(' | ')}`);
          }

          async function openSelection(page, name) {
            await openHome(page, name);
            const where = page.getByText('Where to', { exact: false });
            if (await where.count()) await where.last().click();
            else await page.mouse.click(190, 708);
            await page.waitForTimeout(1200);

            let inputs = page.locator(
              'input:not([type="submit"]):not([type="hidden"]):visible, textarea:visible',
            );
            let count = await inputs.count().catch(() => 0);
            if (!count) {
              await page.mouse.click(185, 274);
              await page.waitForTimeout(400);
              inputs = page.locator(
                'input:not([type="submit"]):not([type="hidden"]):visible, textarea:visible',
              );
              count = await inputs.count();
            }
            if (!count) throw new Error(`${name}: visible destination input missing`);
            await inputs.last().pressSequentially('Stockholm Central Station', { delay: 10 });
            await page.waitForTimeout(700);

            const next = page.getByText('Next', { exact: true });
            if (await next.count()) await next.last().click();
            else await page.mouse.click(195, 804);
            await page.waitForTimeout(3500);
            await waitOwner(page, 'pickup', `${name}: pickup`);

            await page.mouse.click(195, 797);
            await page.waitForTimeout(7000);
            await waitOwner(page, 'select_ride', `${name}: selection`);
          }

          async function bookFromSelection(page, name) {
            const select = page.getByText('Select Movera', { exact: true });
            if (await select.count()) await select.last().click();
            else {
              await page.mouse.click(195, 808);
              await page.waitForTimeout(900);
              await page.mouse.click(195, 808);
            }
            await waitOwner(page, 'finding', `${name}: finding`, 15000);
          }

          async function enterFinding(page, name) {
            await openSelection(page, name);
            await bookFromSelection(page, name);
          }

          function decodeStoredJson(raw) {
            let value = raw;
            for (let i = 0; i < 3 && typeof value === 'string'; i++) {
              try {
                const decoded = JSON.parse(value);
                if (decoded === value) break;
                value = decoded;
              } catch (_) {
                break;
              }
            }
            return value;
          }

          async function activeRideSnapshot(page) {
            const raw = await page.evaluate(() => localStorage.getItem('flutter.movera_active_ride'));
            if (raw == null) throw new Error('Active ride snapshot missing from localStorage');
            const decoded = decodeStoredJson(raw);
            if (!decoded || typeof decoded !== 'object') {
              throw new Error(`Active ride snapshot malformed: ${raw}`);
            }
            return decoded;
          }

          async function walletStorage(page) {
            return page.evaluate(() => Object.fromEntries(
              Object.entries(localStorage).filter(([key]) => key.includes('movera_wallet_balance')),
            ));
          }

          function balanceFromStorage(snapshot) {
            const entries = Object.entries(snapshot);
            if (!entries.length) return 0;
            const raw = entries[0][1];
            const candidates = [raw];
            try { candidates.push(JSON.parse(raw)); } catch (_) {}
            for (const candidate of candidates) {
              const value = Number(candidate);
              if (Number.isFinite(value)) return value;
            }
            const match = String(raw).match(/-?\d+(?:\.\d+)?/);
            if (match) return Number(match[0]);
            throw new Error(`Could not parse wallet balance from ${JSON.stringify(snapshot)}`);
          }

          async function runScenario(name, fn) {
            try {
              const value = await fn();
              evidence[name] = { ...value, status: 'PASS' };
              console.log(`PASS ${name}`);
            } catch (error) {
              evidence[name] = { status: 'FAIL', error: String(error?.stack || error) };
              console.error(`FAIL ${name}:`, error);
            }
          }

          const browser = await chromium.launch({ headless: true });

          await runScenario('payment', async () => {
            const context = await newContext(browser);
            const page = await context.newPage();
            await openSelection(page, 'payment');
            await page.screenshot({ path: 'qa-critical-payment-before.png', fullPage: true });

            await page.touchscreen.tap(350, 666);
            await page.waitForTimeout(700);
            await page.screenshot({ path: 'qa-critical-payment-picker.png', fullPage: true });

            await page.touchscreen.tap(180, 792);
            await page.waitForTimeout(700);
            await page.screenshot({ path: 'qa-critical-payment-cash.png', fullPage: true });

            await bookFromSelection(page, 'payment');
            const snapshot = await activeRideSnapshot(page);
            if (snapshot.paymentMethod !== 'Cash') {
              throw new Error(`Payment: expected ride snapshot Cash, got ${snapshot.paymentMethod}`);
            }
            await page.screenshot({ path: 'qa-critical-payment-finding.png', fullPage: true });
            await context.close();
            return { paymentMethod: snapshot.paymentMethod, rideStatus: snapshot.status };
          });

          await runScenario('finding_waiting', async () => {
            const context = await newContext(browser);
            const page = await context.newPage();
            await enterFinding(page, 'waiting');
            await page.screenshot({ path: 'qa-critical-waiting-finding.png', fullPage: true });
            await waitOwner(page, 'waiting', 'Finding to Waiting', 45000);
            const owner = await page.evaluate(() => window.moveraMapOwner || 'none');
            if (owner !== 'waiting') throw new Error(`Finding to Waiting: got ${owner}`);
            await page.screenshot({ path: 'qa-critical-waiting.png', fullPage: true });
            await context.close();
            return { owner };
          });

          await runScenario('cancel_standalone', async () => {
            const context = await newContext(browser, { standalone: true });
            const page = await context.newPage();
            await enterFinding(page, 'cancel-standalone');
            await page.screenshot({ path: 'qa-critical-cancel-finding.png', fullPage: true });

            async function openCurrentCancel() {
              const owner = await page.evaluate(() => window.moveraMapOwner || 'none');
              if (owner === 'waiting') {
                const cancel = page.getByLabel('Cancel ride', { exact: true });
                if (await cancel.count()) await cancel.last().click();
                else await page.touchscreen.tap(36, 32);
              } else {
                await page.touchscreen.tap(36, 32);
              }
              await page.waitForTimeout(700);
            }

            async function confirmFirstCancelStep() {
              const request = page.getByText('Cancel request', { exact: true });
              if (await request.count()) {
                await request.last().click();
                return;
              }
              const ride = page.getByText('Cancel ride', { exact: true });
              if (await ride.count()) {
                await ride.last().click();
                return;
              }
              // Flutter canvas semantics do not always expose modal button text.
              // The viewport is fixed at 390x844 and this is the proven
              // destructive-button center used by the existing live QA.
              await page.touchscreen.tap(195, 739);
            }

            // First pass: abandon cancellation. The active ride must survive.
            await openCurrentCancel();
            await page.screenshot({ path: 'qa-critical-cancel-confirm.png', fullPage: true });
            await confirmFirstCancelStep();
            await page.waitForTimeout(1000);
            await page.screenshot({ path: 'qa-critical-cancel-reason.png', fullPage: true });
            await page.keyboard.press('Escape');
            await page.waitForTimeout(1500);

            const afterAbortOwner = await page.evaluate(() => window.moveraMapOwner || 'none');
            if (!['finding', 'waiting'].includes(afterAbortOwner)) {
              throw new Error(
                `Standalone Cancel: abandoning cancel must keep active ride, got ${afterAbortOwner}`,
              );
            }
            const afterAbortSnapshot = await activeRideSnapshot(page);
            if (String(afterAbortSnapshot.status || '').toLowerCase().includes('cancel')) {
              throw new Error(
                `Standalone Cancel: abandoning cancel mutated status to ${afterAbortSnapshot.status}`,
              );
            }
            await page.screenshot({ path: 'qa-critical-cancel-aborted.png', fullPage: true });

            // Second pass: complete cancellation explicitly, then Home must be stable.
            await openCurrentCancel();
            await confirmFirstCancelStep();
            await page.waitForTimeout(700);
            const skip = page.getByText('Skip', { exact: true });
            if (await skip.count()) {
              await skip.last().click();
            } else {
              // Flutter canvas semantics may hide the header action. The
              // critical QA viewport is fixed at 390x844; evidence from this
              // exact sheet places Skip safely at this stable target.
              await page.touchscreen.tap(48, 254);
            }

            await page.waitForFunction(
              () => (window.moveraMapOwner || 'none') === 'home',
              null,
              { timeout: 10000 },
            );
            const afterCancelOwner = await page.evaluate(() => window.moveraMapOwner || 'none');

            await page.waitForTimeout(28000);
            const stableOwner = await page.evaluate(() => window.moveraMapOwner || 'none');
            if (stableOwner !== 'home') {
              throw new Error(`Standalone Cancel: expected stable Home, got ${stableOwner}`);
            }
            await page.screenshot({ path: 'qa-critical-cancel-home.png', fullPage: true });
            await context.close();
            return { afterAbortOwner, afterCancelOwner, stableOwner };
          });

          await runScenario('wallet_standalone', async () => {
            const context = await newContext(browser, { standalone: true });
            const page = await context.newPage();
            await openHome(page, 'wallet-standalone');
            const beforeStorage = await walletStorage(page);
            const before = balanceFromStorage(beforeStorage);

            // Tap controls by their accessible name: the side menu (Phase 97)
            // and the wallet page (Phase 76) have both moved since this
            // scenario was written, and fixed coordinates silently landed on
            // Ride History instead of Wallet.
            async function tapButton(name, label) {
              const button = page.getByRole('button', { name, exact: true });
              await button.first().waitFor({ state: 'visible', timeout: 10000 }).catch(() => {
                throw new Error(`Standalone Wallet: ${label} button '${name}' not found`);
              });
              await button.first().click();
            }
            async function openAddFunds(tag) {
              await page.touchscreen.tap(300, 88);
              await page.waitForTimeout(700);
              await page.screenshot({ path: `qa-critical-wallet-menu${tag}.png`, fullPage: true });
              await tapButton('Wallet', 'side menu');
              await page.waitForTimeout(1500);
              await page.screenshot({ path: `qa-critical-wallet-page${tag}.png`, fullPage: true });
              await tapButton('Add funds (demo)', 'wallet page');
              await page.waitForTimeout(800);
            }

            await openAddFunds('');
            await page.screenshot({ path: 'qa-critical-wallet-add-sheet.png', fullPage: true });

            // Phase 76: picking an amount only selects it; the simulated
            // payment runs on 'Simulate top-up'.
            await tapButton('kr 200', 'amount');
            await page.waitForTimeout(400);
            const selected = balanceFromStorage(await walletStorage(page));
            if (selected !== before) {
              throw new Error(`Standalone Wallet: selecting an amount changed balance ${before} -> ${selected}`);
            }
            await tapButton('Simulate top-up', 'add-funds sheet');
            await page.waitForTimeout(1800);
            const afterStorage = await walletStorage(page);
            const after = balanceFromStorage(afterStorage);
            if (after !== before + 200) {
              throw new Error(
                `Standalone Wallet: expected ${before + 200}, got ${after}; ` +
                `before=${JSON.stringify(beforeStorage)} after=${JSON.stringify(afterStorage)}`,
              );
            }
            await page.screenshot({ path: 'qa-critical-wallet-funded.png', fullPage: true });

            await page.reload({ waitUntil: 'networkidle', timeout: 120000 });
            await page.waitForTimeout(4500);
            await enableA11y(page);
            const persistedStorage = await walletStorage(page);
            const persisted = balanceFromStorage(persistedStorage);
            if (persisted !== after) {
              throw new Error(`Standalone Wallet: persistence failed ${after} -> ${persisted}`);
            }

            // Dismissing the sheet, even with an amount picked, must not pay.
            await openAddFunds('-dismiss');
            await tapButton('kr 500', 'amount');
            await page.waitForTimeout(400);
            await page.screenshot({ path: 'qa-critical-wallet-dismiss-before.png', fullPage: true });
            await page.keyboard.press('Escape');
            await page.waitForTimeout(800);

            const afterDismissStorage = await walletStorage(page);
            const afterDismiss = balanceFromStorage(afterDismissStorage);
            if (afterDismiss !== persisted) {
              throw new Error(`Standalone Wallet: dismiss changed balance ${persisted} -> ${afterDismiss}`);
            }
            await page.screenshot({ path: 'qa-critical-wallet-persisted.png', fullPage: true });
            await context.close();
            return { before, after, persisted, afterDismiss };
          });

          fs.writeFileSync('qa-critical-result.json', JSON.stringify(evidence, null, 2));
          await browser.close();

          const failed = Object.entries(evidence).filter(([, value]) => value.status !== 'PASS');
          if (failed.length) {
            console.error('FAILED SCENARIOS:', failed.map(([name]) => name).join(', '));
            process.exit(1);
          }
          console.log('PASS: all critical Rider live scenarios');
          JS
          node qa-critical.mjs

      - name: Upload critical-flow evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-critical-rider-flow
          path: |
            qa-critical-*.png
            qa-critical-*.json
          if-no-files-found: warn
