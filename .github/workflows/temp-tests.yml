name: TEMP tests for the iOS crash fix
# TEMPORARY (branch only, removed before ready): the draft PR skips the CI gate tests.
on:
  push:
    branches: [claude/laund-rule-review-j04dj5-ios]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.7'
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: dart format --output=none --set-exit-if-changed lib/core/notifications/firebase_push_service.dart test/notifications/r7_push_config_test.dart
      - run: flutter analyze
      - run: flutter test test/notifications
      - run: flutter test
