name: Backend Readiness Gate

on:
  pull_request:
    paths:
      - 'lib/**'
      - 'test/**'
      - 'integration_test/**'
      - 'web/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Linux desktop + display dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ninja-build libgtk-3-dev libsecret-1-dev libjsoncpp-dev xvfb

      - run: flutter pub get
      - run: flutter config --enable-linux-desktop

      - name: Unsafe architecture source guards
        shell: bash
        run: |
          set -euo pipefail

          if grep -R --line-number --fixed-strings 'ApiSafetyRemoteDataSource(ApiClient())' lib; then
            echo 'Safety networking bypasses authenticated AppScope.api'
            exit 1
          fi

          # Owner decision 11 (2026-10-22): the demo build may ask the public
          # road router from one web-only file, like the driver app's demo.
          # Release flavors never reach it (road_route_public_fallback_test).
          if grep -R --line-number --fixed-strings 'router.project-osrm.org' lib web \
            | grep -v '^lib/core/maps/web_road_route.dart:'; then
            echo 'Rider still calls uncontrolled public routing provider'
            exit 1
          fi

          if grep -R --line-number --fixed-strings \
            'package:flutter_sliding_up_panel/' lib test integration_test 2>/dev/null; then
            echo 'Removed duplicate panel dependency is still imported'
            exit 1
          fi

          test -f lib/features/trips/domain/trip_status.dart
          test -f lib/features/trips/domain/trip.dart
          test -f lib/core/observability/observability.dart
          test -f lib/app/config/transport_composition.dart

      - name: Static analysis
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Backend contract and architecture gates
        run: |
          flutter test test/booking/trip_contract_projection_test.dart
          flutter test test/reservations/scheduled_trip_contract_test.dart
          flutter test test/safety/safety_test.dart
          flutter test test/architecture/release_observability_test.dart
          flutter test test/architecture/transport_composition_test.dart
          flutter test test/architecture/phase72_actual_release_composition_test.dart
          flutter test test/auth/phase73_auth_contract_test.dart
          flutter test test/profile/phase74_account_security_test.dart
          flutter test test/ride/realtime_contract_test.dart
          flutter test test/maps/routing_privacy_test.dart
          flutter test test/performance/performance_budget_test.dart

      - name: Critical correctness race gates
        run: |
          flutter test test/ride/ride_snapshot_store_race_test.dart
          flutter test test/booking/ride_session_reconcile_test.dart
          flutter test test/ride/realtime_terminal_resync_test.dart
          flutter test test/ride/waiting_external_terminal_test.dart
          flutter test test/quotes/parallel_quotes_test.dart

      - name: Full unit + widget suite
        run: flutter test

      - name: Critical Rider integration UAT
        run: |
          xvfb-run -a flutter test -d linux integration_test/ride_flow_test.dart
          xvfb-run -a flutter test -d linux integration_test/rider_full_uat_test.dart
          xvfb-run -a flutter test -d linux integration_test/pre15_all_lifecycle_paths_test.dart
          xvfb-run -a flutter test -d linux integration_test/global_uat_flow_test.dart

      - name: Production web build
        run: |
          flutter build web --release --pwa-strategy=none \
            -t lib/main_production.dart \
            --dart-define=MOVERA_FLAVOR=production \
            --dart-define=MOVERA_API_BASE_URL=https://api.movera.example
