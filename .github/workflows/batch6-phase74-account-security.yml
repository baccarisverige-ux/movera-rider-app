name: Batch 6 Phase 74 Account Security Certification

on:
  pull_request:
    paths:
      - 'lib/features/profile/**'
      - 'lib/core/api/**'
      - 'lib/app/di.dart'
      - 'backend/src/**'
      - 'test/profile/**'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  account-security:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.7'
          cache: true

      - run: flutter pub get

      - name: Strict analysis
        run: flutter analyze

      - name: Security truth source guards
        run: |
          ! grep -q "ProfileController" lib/features/profile/presentation/security.dart
          ! grep -q "_profile.update" lib/features/profile/presentation/security.dart
          ! grep -q "SharedPreferences" lib/features/profile/presentation/security.dart

      - name: Account security contracts and UI effects
        run: |
          flutter test test/profile/phase74_account_security_test.dart
          flutter test test/profile/phase74_account_security_ui_test.dart
          flutter test test/profile/account_flow_test.dart

      - name: Backend account-security smoke
        run: |
          node --check backend/src/index.js
          node backend/src/index.js >/tmp/movera-backend.log 2>&1 &
          BACKEND_PID=$!
          trap 'kill $BACKEND_PID' EXIT
          sleep 1
          node <<'NODE'
          (async () => {
            const base = 'http://127.0.0.1:8787';
            const beforeRes = await fetch(base + '/api/v1/account/security');
            if (!beforeRes.ok) throw new Error('security GET failed');
            const before = await beforeRes.json();
            if (!before.security) throw new Error('missing security payload');
            if (before.security.phone !== '' || before.security.email !== '') {
              throw new Error('backend seeded a fake rider identity');
            }
            if (before.security.capabilities.reauthentication !== false) {
              throw new Error('reauthentication must be unavailable by default');
            }

            const revokeRes = await fetch(
              base + '/api/v1/account/security/sessions/sign-out-others',
              {
                method: 'POST',
                headers: { 'content-type': 'application/json' },
              },
            );
            if (revokeRes.status !== 403) {
              throw new Error('sensitive session revoke did not require reauth');
            }
            const rejected = await revokeRes.json();
            if (rejected.code !== 'REAUTH_REQUIRED') {
              throw new Error('wrong rejection for missing reauthentication');
            }

            const afterRes = await fetch(base + '/api/v1/account/security');
            const after = await afterRes.json();
            if (
              JSON.stringify(after.security.sessions) !==
              JSON.stringify(before.security.sessions)
            ) {
              throw new Error('rejected revoke mutated server sessions');
            }
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Production build
        run: |
          flutter build web --release \
            -t lib/main_production.dart \
            --dart-define=MOVERA_FLAVOR=production \
            --dart-define=MOVERA_API_BASE_URL=https://api.movera.example
          test -f build/web/main.dart.js
