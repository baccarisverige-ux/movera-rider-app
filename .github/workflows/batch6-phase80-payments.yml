name: Batch 6 Phase 80 Payment Transport Certification

on:
  pull_request:
    paths:
      - 'lib/core/payments/**'
      - 'lib/core/api/in_process_mock_client.dart'
      - 'lib/app/di.dart'
      - 'lib/app/config/transport_composition.dart'
      - 'backend/src/**'
      - 'test/payments/**'
      - 'test/wallet/**'
      - 'test/architecture/**'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  payment-transport:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.7'
          cache: true

      - run: flutter pub get

      - name: Strict analysis
        run: flutter analyze

      - name: Phase 80 payment transport and wallet regression
        run: |
          flutter test test/payments/phase80_payment_transport_test.dart
          flutter test test/wallet/gateway_test.dart
          flutter test test/wallet/ops_test.dart
          flutter test test/architecture/phase72_actual_release_composition_test.dart
          flutter test test/architecture/transport_composition_test.dart

      - name: Release payment composition guards
        run: |
          grep -q "ApiPaymentGateway(api: api)" lib/app/di.dart
          ! grep -A5 "paymentGateway = environment.allowsMockTransport" lib/app/di.dart | grep -q "UnavailablePaymentGateway"
          grep -q "paymentGateway is UnavailablePaymentGateway" lib/app/config/transport_composition.dart

      - name: Backend payment lifecycle smoke
        run: |
          node --check backend/src/index.js
          node backend/src/index.js >/tmp/movera-backend.log 2>&1 &
          BACKEND_PID=$!
          trap 'kill $BACKEND_PID' EXIT
          sleep 1
          node <<'NODE'
          (async () => {
            const base = 'http://127.0.0.1:8787';
            const headers = {
              'content-type': 'application/json',
              'idempotency-key': 'phase80-smoke',
            };
            const create = await fetch(base + '/api/v1/payments', {
              method: 'POST',
              headers,
              body: JSON.stringify({ amountMinor: 12500, currency: 'SEK' }),
            });
            if (!create.ok) throw new Error('payment create failed');
            const created = await create.json();
            if (
              created.code !== 'OK' ||
              created.intent?.status !== 'requires_confirmation' ||
              created.intent?.amountMinor !== 12500 ||
              created.intent?.currency !== 'SEK'
            ) throw new Error('invalid payment intent');
            const id = created.intent.id;

            const statusBefore = await fetch(base + '/api/v1/payments/' + id);
            const before = await statusBefore.json();
            if (before.status !== 'requires_confirmation') {
              throw new Error('payment became successful before confirmation');
            }

            const confirm = await fetch(
              base + '/api/v1/payments/' + id + '/confirm',
              { method: 'POST', headers: { 'content-type': 'application/json' } },
            );
            if (!confirm.ok) throw new Error('payment confirm failed');
            const confirmed = await confirm.json();
            if (confirmed.status !== 'succeeded') {
              throw new Error('payment confirmation not acknowledged');
            }

            const statusAfter = await fetch(base + '/api/v1/payments/' + id);
            const after = await statusAfter.json();
            if (after.status !== 'succeeded') {
              throw new Error('payment status not persisted');
            }
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Production web build
        run: |
          flutter build web --release             -t lib/main_production.dart             --dart-define=MOVERA_FLAVOR=production             --dart-define=MOVERA_API_BASE_URL=https://api.movera.example             --dart-define=MOVERA_FIREBASE_API_KEY=ci-api-key             --dart-define=MOVERA_FIREBASE_APP_ID=ci-app-id             --dart-define=MOVERA_FIREBASE_MESSAGING_SENDER_ID=ci-sender             --dart-define=MOVERA_FIREBASE_PROJECT_ID=ci-project             --dart-define=MOVERA_FIREBASE_VAPID_KEY=ci-vapid
          test -f build/web/main.dart.js
