name: Batch 7 Phase 83 Chat Honest State Certification

on:
  pull_request:
    paths:
      - 'lib/features/messages/**'
      - 'test/messages/**'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phase83:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Strict analysis
        run: flutter analyze

      - name: Phase 83 chat behavior
        run: |
          flutter test test/messages/messages_controller_test.dart
          flutter test test/messages/phase83_chat_honest_state_test.dart

      - name: No fabricated Rider send
        run: |
          # Live wire: the chat sends through the server (transport). Demo: no
          # transport, so nothing is appended locally to look sent.
          grep -q "canSendMessages => _transport != null" lib/features/messages/application/messages_controller.dart
          grep -q "if (_transport == null) return false;" lib/features/messages/application/messages_controller.dart
          # Round 4: the copy lives in l10n; check the code uses it and that
          # English still reads the same.
          grep -q "sendUnavailableMessage => L10n.current.chatSendUnavailable" lib/features/messages/application/messages_controller.dart
          grep -q "\"chatSendUnavailable\": \"Sending messages to your driver isn't available yet.\"" lib/l10n/app_en.arb
          grep -q "label: context.l10n.chatSendUnavailableSemantics" lib/features/messages/presentation/chat.dart
          grep -q '"chatSendUnavailableSemantics": "Send message unavailable"' lib/l10n/app_en.arb
