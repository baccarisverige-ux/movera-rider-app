name: Publish Rider Web Preview (test server only)

# Owner 2026-11-23 ("Want see is test first"): a look-only preview of this
# branch at /movera-rider-app/preview/, built against the TEST server
# (MOVERA_LIVE_API_URL). GitHub Pages replaces the whole site on every deploy,
# so this run takes the EXACT site of the last successful "Publish Rider Web
# Live" run (its github-pages artifact: /live/, /app/, index.html, 404.html,
# byte for byte) and only adds the preview/ folder. Nothing in /live/ or /app/
# is rebuilt or changed. The next main publish removes /preview/ again.
# Runs only on pushes to the preview branch; never on main.
on:
  push:
    branches: [claude/laund-rule-review-j04dj5-dprofile]
  # Manual re-run of the preview (a re-run attempt of run 45169937408 could not
  # find its own github-pages artifact at the deploy step).
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # The same group as publish-web-live.yml's main deploys: never two Pages
  # deploys at once; a newer main publish cancels this one (safe).
  group: movera-rider-pages-main
  cancel-in-progress: false

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Take the current published site unchanged
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          busy="$(gh run list -R "$REPO" --workflow publish-web-live.yml --limit 5 --json status --jq '[.[]|select(.status!="completed")]|length')"
          if [ "$busy" != "0" ]; then echo "::error::A live publish is running; try again after it."; exit 1; fi
          run_id="$(gh run list -R "$REPO" --workflow publish-web-live.yml --status success --limit 1 --json databaseId --jq '.[0].databaseId')"
          test -n "$run_id" || { echo "::error::No successful live publish found."; exit 1; }
          echo "Base site: publish run $run_id"
          rm -rf /tmp/base /tmp/site && mkdir -p /tmp/base /tmp/site
          gh run download "$run_id" -R "$REPO" -n github-pages -D /tmp/base
          tar -xf /tmp/base/artifact.tar -C /tmp/site
          test -f /tmp/site/live/index.html || { echo "::error::base site has no /live/"; exit 1; }
          if [ -d /tmp/site/preview ]; then rm -rf /tmp/site/preview; fi
          ls -la /tmp/site

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.7'
          cache: true

      - name: Build the preview (test server)
        env:
          LIVE_API: ${{ vars.MOVERA_LIVE_API_URL }}
          PROD_API: ${{ vars.MOVERA_PROD_API_URL }}
          RIDER_MAP_ID: ${{ vars.RIDER_MAP_ID || '9fdc5d9e56d4a0916c77a424' }}
          MAPS_WEB_API_KEY: ${{ secrets.MAPS1 || secrets.MAPS || secrets.GOOGLE_MAPS_WEB_API_KEY || secrets.GOOGLE_MAPS_API_KEY || secrets.MAPS_API_KEY }}
        run: |
          flutter pub get
          LIVE_API="$(printf '%s' "$LIVE_API" | tr -d '[:space:][:cntrl:]')"
          PROD_API="$(printf '%s' "$PROD_API" | tr -d '[:space:][:cntrl:]')"
          case "$LIVE_API" in https://*) ;; *) echo "::error::MOVERA_LIVE_API_URL must start with https://"; exit 1 ;; esac
          # Never a preview that talks to the real server.
          if [ -n "$PROD_API" ] && [ "${PROD_API%/}" = "${LIVE_API%/}" ]; then echo "::error::test and real server are the same"; exit 1; fi
          printf '%s' "$RIDER_MAP_ID" | grep -Eq '^[A-Za-z0-9]+$' || { echo "::error::Invalid RIDER_MAP_ID"; exit 1; }
          app_version="$(sed -n 's/^version: *//p' pubspec.yaml)"
          flutter build web --release \
            -t lib/main_staging.dart \
            --dart-define=MOVERA_FLAVOR=staging \
            --dart-define=MOVERA_API_BASE_URL="$LIVE_API" \
            --dart-define=MOVERA_AUTH_REQUIRED=true \
            --dart-define=MOVERA_APP_VERSION="$app_version" \
            --dart-define=MOVERA_GOOGLE_MAP_ID="$RIDER_MAP_ID"
          printf '%s\n' '{"flavor":"staging","production":false,"server":"test","preview":true}' > build/web/movera-environment.json
          python3 - <<'PY'
          import os
          from pathlib import Path
          p = Path('build/web/index.html')
          s = p.read_text()
          bootstrap = '  <script src="flutter_bootstrap.js" defer onerror="window.moveraBootFailed && window.moveraBootFailed()"></script>'
          key = os.environ.get('MAPS_WEB_API_KEY', '')
          if key and bootstrap in s and 'maps.googleapis.com/maps/api/js' not in s:
              s = s.replace(bootstrap, f'  <script>window.moveraMapsSrc = "https://maps.googleapis.com/maps/api/js?key={key}";</script>\n' + bootstrap)
          if '<base href="/">' not in s:
              raise SystemExit('base href not found')
          s = s.replace('<base href="/">', '<base href="/movera-rider-app/preview/">')
          p.write_text(s)
          PY
          cp -a build/web /tmp/site/preview

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages site
        uses: actions/upload-pages-artifact@v3
        with:
          path: /tmp/site

      - name: Deploy GitHub Pages
        id: pages
        uses: actions/deploy-pages@v4
