name: QA Book now two paths

on:
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'test/ride/book_now_two_paths_e2e_test.dart'
      - '.github/workflows/qa-book-now-e2e.yml'
  # A change to this robot is proven on its PR against the base branch's
  # deployed Pages build (as qa-critical-rider-flow.yml).
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/qa-book-now-e2e.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  book-now-two-paths:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install --save-dev playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null

      - name: Wait for this exact Pages build
        env:
          TARGET_LIVE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.sha }}
        run: |
          SHORT="${TARGET_LIVE_SHA::8}"
          for i in $(seq 1 48); do
            HTML=$(curl -fsSL -H 'Cache-Control: no-cache' "https://baccarisverige-ux.github.io/movera-rider-app/?qa_wait=$RANDOM" || true)
            if printf '%s' "$HTML" | grep -q "flutter_bootstrap.${SHORT}.js"; then
              # index.html alone is not enough: right after a deploy the
              # versioned bootstrap or main bundle can still be missing from
              # the CDN edge, and the page then never starts.
              BOOT=$(curl -fsSL -H 'Cache-Control: no-cache' "https://baccarisverige-ux.github.io/movera-rider-app/flutter_bootstrap.${SHORT}.js?qa_wait=$RANDOM" || true)
              if printf '%s' "$BOOT" | grep -q "main.${SHORT}.dart.js" &&
                curl -fsSI -H 'Cache-Control: no-cache' "https://baccarisverige-ux.github.io/movera-rider-app/main.${SHORT}.dart.js?qa_wait=$RANDOM" >/dev/null; then
                echo "LIVE_BUILD=$SHORT" >> "$GITHUB_ENV"
                exit 0
              fi
            fi
            sleep 10
          done
          echo "Exact deployed bundle for $SHORT was not found" >&2
          exit 1

      - name: Book now with GPS on and GPS off
        run: |
          cat > qa-book-now.mjs <<'JS'
          import { chromium } from 'playwright';
          import fs from 'fs';

          const base = process.env.QA_BASE || 'https://baccarisverige-ux.github.io/movera-rider-app/';

          // Diagnostics for a failed step: the page's recent console errors and the
          // map generation (window.moveraMapGeneration).
          const consoleTail = new WeakMap();
          function watchConsole(page) {
            const tail = [];
            consoleTail.set(page, tail);
            page.on('console', m => {
              if (m.type() === 'error' || /map/i.test(m.text())) tail.push(`${m.type()}: ${m.text().slice(0, 200)}`);
              if (tail.length > 15) tail.shift();
            });
          }
          async function diagnostics(page) {
            const generation = await page.evaluate(() => window.moveraMapGeneration ?? null).catch(() => null);
            return `map generation ${generation}; recent console: ${JSON.stringify(consoleTail.get(page) || [])}`;
          }

          async function visibleButtons(page) {
            return page.evaluate(() => [...document.querySelectorAll('flt-semantics[role=button]')]
              .map(e => (e.getAttribute('aria-label') || e.textContent || '').trim().replace(/\s+/g, ' ').slice(0, 60))
              .filter(Boolean).slice(0, 25)).catch(() => []);
          }

          async function waitForMapOwner(page, expected, name, timeout = 15000) {
            try {
              await page.waitForFunction(
                owner => window.moveraMapOwner === owner,
                expected,
                { timeout },
              );
            } catch (error) {
              const actual = await page.evaluate(() => window.moveraMapOwner || '');
              throw new Error(`${name}: expected map owner ${expected}, got ${actual || 'none'}; screen buttons: ${JSON.stringify(await visibleButtons(page))}; ${await diagnostics(page)}`, { cause: error });
            }
          }

          // Tap a control by its accessible name (string = exact, RegExp = pattern).
          // Fixed coordinates silently land on whatever moved there.
          async function tapNamed(page, name, label, timeout = 10000) {
            const button = page.getByRole('button', typeof name === 'string' ? { name, exact: true } : { name });
            await button.first().waitFor({ state: 'visible', timeout }).catch(() => {
              throw new Error(`${label}: button ${name} not found`);
            });
            await button.first().click();
          }

          // A touch drag across the map, as a rider moves the pickup pin.
          async function dragMap(page) {
            const cdp = await page.context().newCDPSession(page);
            const touch = (type, x, y) => cdp.send('Input.dispatchTouchEvent', {
              type,
              touchPoints: type === 'touchEnd' ? [] : [{ x, y, radiusX: 8, radiusY: 8, force: 1 }],
            });
            const [x, fromY, toY, steps] = [195, 300, 160, 16];
            await touch('touchStart', x, fromY);
            for (let i = 1; i <= steps; i++) {
              await touch('touchMove', x, fromY + (toY - fromY) * (i / steps));
              await page.waitForTimeout(20);
            }
            await touch('touchEnd');
            await cdp.detach();
            await page.waitForTimeout(2500);
          }

          // The current Book now path (rider home and booking screens, 2026-10):
          // Home 'Where to?' -> type -> pick the suggestion (no Next button) ->
          // Select ride (categories) -> 'Select Movera' -> pickup ->
          // 'Confirm and search' -> Finding.
          async function bookNowPath(browser, { gps, name }) {
            const context = await browser.newContext({
              viewport: { width: 390, height: 844 },
              deviceScaleFactor: 1,
              isMobile: true,
              hasTouch: true,
              locale: 'en-US',
              geolocation: gps ? { latitude: 59.33258, longitude: 18.0649 } : undefined,
              permissions: gps ? ['geolocation'] : [],
            });
            // Round 4: the app speaks the zone's language (sv in Stockholm); these
            // checks read the English copy, so pin the rider's choice to English.
            await context.addInitScript(() => localStorage.setItem('flutter.movera_app_language', '"en"'));
            const page = await context.newPage();
            watchConsole(page);
            const errors = [];
            page.on('pageerror', e => errors.push(String(e)));
            // 'load', not 'networkidle': the map keeps fetching tiles. Wait for Home.
            await page.goto(base + `?booknow=${name}&v=${Date.now()}`, { waitUntil: 'load', timeout: 120000 });
            await waitForMapOwner(page, 'home', `${name}: Home`, 90000);
            await page.waitForTimeout(1500);
            // Flutter parks 'Enable accessibility' at (-1,-1): click it through the DOM.
            await page.evaluate(() => document.querySelector('flt-semantics-placeholder')?.click());
            await page.waitForFunction(() => document.querySelector('flt-semantics'), null, { timeout: 5000 }).catch(() => {});
            await page.waitForTimeout(400);

            await tapNamed(page, 'Where to?', `${name}: Home`);
            await page.waitForTimeout(1200);
            await page.screenshot({ path: `qa-book-now-${name}-destination.png`, fullPage: true });
            const inputs = page.locator('input:not([type="submit"]):not([type="hidden"]):visible, textarea:visible');
            await inputs.last().waitFor({ state: 'visible', timeout: 10000 }).catch(() => {
              throw new Error(`${name}: visible destination input missing`);
            });
            await inputs.last().pressSequentially('Stockholm Central Station', { delay: 10 });
            await page.waitForTimeout(1500);
            await tapNamed(page, /^Stockholm Central Station\b/, `${name}: destination suggestion`);

            // Book now opens the categories, never Ride scheduled.
            await page.waitForFunction(
              () => ['select_ride', 'schedule'].includes(window.moveraMapOwner || ''),
              null,
              { timeout: 20000 },
            ).catch(() => {});
            const categoryOwner = await page.evaluate(() => window.moveraMapOwner || '');
            await page.screenshot({ path: `qa-book-now-${name}-categories.png`, fullPage: true });
            if (categoryOwner === 'schedule') throw new Error(`${name}: Book now opened Ride scheduled`);
            if (categoryOwner !== 'select_ride') {
              throw new Error(`${name}: expected ride selection, got map owner ${categoryOwner || 'none'}; screen buttons: ${JSON.stringify(await visibleButtons(page))}; ${await diagnostics(page)}`);
            }

            await tapNamed(page, 'Select Movera', `${name}: Select ride`);
            await waitForMapOwner(page, 'pickup', name);
            await page.waitForTimeout(1500);
            await page.screenshot({ path: `qa-book-now-${name}-pickup.png`, fullPage: true });
            const onPickup = true;

            const confirm = page.getByRole('button', { name: 'Confirm and search', exact: true }).first();
            await confirm.waitFor({ state: 'visible', timeout: 10000 }).catch(() => {
              throw new Error(`${name}: 'Confirm and search' missing on pickup`);
            });
            let gateHeld = null;
            if (!gps) {
              // Phase 98 (D-002): with location off the pin sits on a fallback point,
              // so Confirm stays disabled until the rider picks a spot. Tap it where
              // it is drawn (a disabled button takes no click by name), prove the
              // gate holds, then drag the map like a rider.
              const box = await confirm.boundingBox();
              await page.mouse.click(box.x + box.width / 2, box.y + box.height / 2);
              await page.waitForTimeout(2500);
              const gatedOwner = await page.evaluate(() => window.moveraMapOwner || '');
              if (gatedOwner !== 'pickup') {
                throw new Error(`${name}: Confirm accepted the fallback point (map owner ${gatedOwner || 'none'})`);
              }
              gateHeld = true;
              await dragMap(page);
              await page.screenshot({ path: `qa-book-now-${name}-pickup-dragged.png`, fullPage: true });
            }

            await tapNamed(page, 'Confirm and search', `${name}: Confirm pickup`);
            await waitForMapOwner(page, 'finding', name);
            await page.waitForTimeout(1500);
            await page.screenshot({ path: `qa-book-now-${name}-finding.png`, fullPage: true });
            const owner = await page.evaluate(() => window.moveraMapOwner || '');
            if (errors.length) throw new Error(`${name}: page errors: ${errors.join(' | ')}`);
            const result = { name, gps, categoryOwner, onPickup, gateHeld, owner, errors };
            fs.writeFileSync(`qa-book-now-${name}.json`, JSON.stringify(result, null, 2));
            console.log('PASS: ' + name + ' reached ride selection, pickup, then Finding Driver');
            await context.close();
            return result;
          }

          const browser = await chromium.launch({ headless: true });
          const gpsOn = await bookNowPath(browser, { gps: true, name: 'gps-on' });
          const gpsOff = await bookNowPath(browser, { gps: false, name: 'gps-off' });
          if (!gpsOn.onPickup || !gpsOff.onPickup) {
            throw new Error('Both Book now paths must open Confirm pickup');
          }
          await browser.close();
          console.log('PASS: Book now GPS on and GPS off both reached Confirm pickup and Finding');
          JS
          node qa-book-now.mjs

      - name: Upload Book now E2E evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-book-now-two-paths
          path: |
            qa-book-now-*.png
            qa-book-now-*.json
          if-no-files-found: warn
