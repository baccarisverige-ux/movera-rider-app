name: QA live Rider flow

on:
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'web/**'
      - '.github/workflows/qa-live-rider-flow.yml'
  # A change to this robot is proven on its PR against the base branch's
  # deployed Pages build (as qa-critical-rider-flow.yml).
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/qa-live-rider-flow.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-flow:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install --save-dev playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null

      - name: Wait for this exact Pages build
        env:
          TARGET_LIVE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.sha }}
        run: |
          SHORT="${TARGET_LIVE_SHA::8}"
          for i in $(seq 1 48); do
            HTML=$(curl -fsSL -H 'Cache-Control: no-cache' "https://baccarisverige-ux.github.io/movera-rider-app/?qa_wait=$RANDOM" || true)
            if printf '%s' "$HTML" | grep -q "flutter_bootstrap.${SHORT}.js"; then
              BOOT=$(curl -fsSL -H 'Cache-Control: no-cache' "https://baccarisverige-ux.github.io/movera-rider-app/flutter_bootstrap.${SHORT}.js?qa_wait=$RANDOM" || true)
              if printf '%s' "$BOOT" | grep -q "main.${SHORT}.dart.js"; then
                echo "LIVE_BUILD=main.${SHORT}.dart.js" >> "$GITHUB_ENV"
                echo "Exact live build found: main.${SHORT}.dart.js"
                exit 0
              fi
            fi
            sleep 10
          done
          echo "Exact deployed bundle for $SHORT was not found" >&2
          exit 1

      - name: Exercise actual live Rider flow
        run: |
          cat > qa-live.mjs <<'JS'
          import { chromium } from 'playwright';
          import fs from 'fs';

          const base=process.env.QA_BASE||'https://baccarisverige-ux.github.io/movera-rider-app/';
          const browser=await chromium.launch({headless:true});
          // Phase 47: rider addresses and coordinates never go to a public
          // geocoder from the browser; Flutter geocodes via the Movera API.
          const publicGeocoderRequests=[];
          function watchGeocoders(ctx){ctx.on('request',r=>{if(/nominatim\.openstreetmap\.org|GeocodeService|\/maps\/api\/geocode/i.test(r.url()))publicGeocoderRequests.push(r.url());});}
          const context=await browser.newContext({viewport:{width:390,height:844},deviceScaleFactor:1,isMobile:true,hasTouch:true,locale:'en-US',geolocation:{latitude:59.3293,longitude:18.0686},permissions:['geolocation']});
          // Round 4: the app speaks the zone's language (sv in Stockholm); these
          // checks read the English copy, so pin the rider's choice to English.
          await context.addInitScript(() => localStorage.setItem('flutter.movera_app_language', '"en"'));
          watchGeocoders(context);
          const page=await context.newPage();
          const cdp=await context.newCDPSession(page);
          const pageErrors=[]; const consoleErrors=[];
          page.on('pageerror',e=>pageErrors.push({message:String(e),stack:e.stack||''}));
          page.on('console',m=>{if(m.type()==='error')consoleErrors.push(m.text());});
          async function shot(name){return await page.screenshot({path:`qa-${name}.png`,fullPage:true});}
          async function panelCrop(name){return await page.screenshot({path:`qa-${name}-panel.png`,clip:{x:0,y:500,width:390,height:344}});}
          async function touchSwipe(x,fromY,toY,steps=18){
            await cdp.send('Input.dispatchTouchEvent',{type:'touchStart',touchPoints:[{x,y:fromY,radiusX:8,radiusY:8,force:1}]});
            for(let i=1;i<=steps;i++){const y=fromY+(toY-fromY)*(i/steps);await cdp.send('Input.dispatchTouchEvent',{type:'touchMove',touchPoints:[{x,y,radiusX:8,radiusY:8,force:1}]});await page.waitForTimeout(18);}
            await cdp.send('Input.dispatchTouchEvent',{type:'touchEnd',touchPoints:[]}); await page.waitForTimeout(900);
          }
          async function inputs(){return await page.locator('input,textarea').evaluateAll(els=>els.map((el,index)=>{const r=el.getBoundingClientRect();return{index,value:el.value||'',placeholder:el.getAttribute('placeholder')||'',x:r.x,y:r.y,w:r.width,h:r.height,visible:r.width>0&&r.height>0};}));}
          async function dump(name,extra={}){const data={name,url:page.url(),inputs:await inputs(),pageErrors:[...pageErrors],consoleErrors:[...consoleErrors],...extra};fs.writeFileSync(`qa-${name}.json`,JSON.stringify(data,null,2));console.log(`STATE ${name}\n`+JSON.stringify(data,null,2));}
          function fatalErrors(){return[...pageErrors.map(x=>x.message),...consoleErrors].filter(x=>/Null check operator|RangeError|Another exception|Uncaught|TypeError|Assertion failed/i.test(x));}
          function requireChanged(a,b,label){if(Buffer.compare(a,b)===0)throw new Error(`${label} produced no live UI change`);}

          // The map keeps fetching tiles, so the network never goes idle: wait for
          // the page to load, then for Home itself (the Home map and its 'Where to?').
          async function enableA11y(p){
            // Flutter parks 'Enable accessibility' at (-1,-1): click it through the DOM.
            await p.evaluate(()=>document.querySelector('flt-semantics-placeholder')?.click());
            await p.waitForFunction(()=>document.querySelector('flt-semantics'),null,{timeout:5000}).catch(()=>{});
            await p.waitForTimeout(400);
          }
          async function waitOwner(p,expected,label,timeout=15000){
            await p.waitForFunction(o=>window.moveraMapOwner===o,expected,{timeout}).catch(async error=>{
              const actual=await p.evaluate(()=>window.moveraMapOwner||'none');
              throw new Error(`${label}: expected map owner ${expected}, got ${actual}; screen buttons: ${JSON.stringify((await buttonNames(p).catch(()=>[])).filter(Boolean).slice(0,25))}`,{cause:error});
            });
          }
          async function openHome(p,query,label){
            await p.goto(base+`?${query}=${Date.now()}`,{waitUntil:'load',timeout:120000});
            await p.waitForFunction(()=>document.querySelector('flutter-view, flt-glass-pane'),null,{timeout:90000});
            await waitOwner(p,'home',`${label}: Home map`,90000);
            await enableA11y(p);
            await p.getByRole('button',{name:'Where to?',exact:true}).first().waitFor({state:'visible',timeout:30000}).catch(()=>{throw new Error(`${label}: Home 'Where to?' not shown`);});
          }
          // Tap a control by its accessible name (string = exact, RegExp = pattern).
          async function tapNamed(p,name,label,timeout=10000){
            const button=p.getByRole('button',typeof name==='string'?{name,exact:true}:{name});
            await button.first().waitFor({state:'visible',timeout}).catch(()=>{throw new Error(`${label}: button ${name} not found`);});
            await button.first().click();
          }
          async function buttonNames(p){return await p.evaluate(()=>[...document.querySelectorAll('flt-semantics[role=button]')].map(e=>(e.getAttribute('aria-label')||e.textContent||'').trim().replace(/\s+/g,' ')));}
          async function hasButton(p,re){return (await buttonNames(p)).some(n=>re.test(n));}
          // Home 'Where to?' -> type -> pick the suggestion (the planner has no Next
          // button) -> Select ride (the categories).
          async function routeToSelection(p,label){
            await tapNamed(p,'Where to?',`${label}: Home`);
            await p.waitForTimeout(1200);
            const field=p.locator('input:not([type="submit"]):not([type="hidden"]):visible, textarea:visible');
            await field.last().waitFor({state:'visible',timeout:10000}).catch(()=>{throw new Error(`${label}: route planner destination input did not become editable`);});
            await field.last().pressSequentially('Stockholm Central Station',{delay:10});
            await p.waitForTimeout(1500);
            await tapNamed(p,/^Stockholm Central Station\b/,`${label}: destination suggestion`);
            await waitOwner(p,'select_ride',`${label}: Select ride`,20000);
            await p.waitForTimeout(1200);
          }
          await openHome(page,'v','Home'); await page.waitForTimeout(1500); await dump('home'); const home=await shot('home');
          if(fatalErrors().length)throw new Error('Fatal runtime error on Home: '+fatalErrors().join(' | '));

          const headingOnce=await page.evaluate(async()=>await window.moveraStartHeading());
          const headingTwice=await page.evaluate(async()=>await window.moveraStartHeading());
          const headingListeners=await page.evaluate(()=>window.moveraHeadingListenerCount);
          await page.evaluate(async()=>await window.moveraStartHeading());
          const headingListenersAgain=await page.evaluate(()=>window.moveraHeadingListenerCount);
          if(headingListenersAgain!==headingListeners) throw new Error('duplicate heading listeners: '+headingListeners+' -> '+headingListenersAgain);
          const injected350=await page.evaluate(()=>window.moveraInjectHeading(350));
          if(Number(injected350)!==350) throw new Error('inject 350 failed: '+injected350);
          await page.waitForFunction(() => {
            const h = window.moveraPuckHeading;
            return typeof h === 'number' && (h >= 300 || h <= 20);
          }, null, {timeout:8000});
          const puck350=await page.evaluate(()=>window.moveraPuckHeading);
          await page.evaluate(()=>window.moveraInjectHeading(10));
          await page.waitForTimeout(500);
          const puck10=await page.evaluate(()=>window.moveraPuckHeading);
          if(typeof puck10!=='number') throw new Error('puck heading was not reported after inject');
          if(puck10>40 && puck10<300) throw new Error('puck did not take shortest 350\u219210 turn: '+puck10);
          const denied=await page.evaluate(async()=>{
            window.moveraStopHeading();
            window.moveraHeadingPermission='denied';
            const ok=await window.moveraStartHeading();
            const after=window.moveraHeadingListenerCount;
            window.moveraHeadingPermission='auto';
            const restored=await window.moveraStartHeading();
            return {ok, after, restored};
          });
          if(denied.ok!==false) throw new Error('denied heading start should fail');
          if(denied.after!==0) throw new Error('denied start registered listeners');
          if(denied.restored!==true) throw new Error('heading start did not recover after denied');
          fs.writeFileSync('qa-heading.json', JSON.stringify({headingOnce,headingTwice,headingListeners,headingListenersAgain,injected350,puck350,puck10,denied,pageErrors:[...pageErrors],consoleErrors:[...consoleErrors]},null,2));
          if(fatalErrors().length)throw new Error('Fatal runtime error during heading QA: '+fatalErrors().join(' | '));
          console.log('PASS: heading permission granted/denied, inject while GPS fixed, 350\u219210 shortest turn, no duplicate listeners');
          // Public release exposes only a navigation-only Safety bridge. It
          // cannot seed rides, alter matching, or mutate Safety state.
          const safetyOpened=await page.evaluate(()=>{
            if(typeof window.moveraOpenSafety!=='function') return 'missing';
            return window.moveraOpenSafety();
          });
          if(safetyOpened!=='ok') throw new Error('Safe Safety navigation bridge unavailable: '+safetyOpened);
          await page.waitForFunction(()=>{
            try {
              const snap=JSON.parse(window.moveraSafetySnapshotJson||'{}');
              return typeof snap.pinRequired==='boolean';
            } catch (_) {
              return false;
            }
          },null,{timeout:12000});
          const safetySnap=await page.evaluate(()=>{
            try{return JSON.parse(window.moveraSafetySnapshotJson||'{}');}catch(e){return {};}
          });
          const safetyHub=await shot('safety-hub');
          requireChanged(home,safetyHub,'Safety navigation bridge');
          fs.writeFileSync('qa-safety.json', JSON.stringify({safetyOpened,safetySnap,pageErrors:[...pageErrors],consoleErrors:[...consoleErrors]},null,2));
          if(typeof safetySnap.pinRequired!=='boolean') throw new Error('Safety snapshot missing pinRequired');
          if(typeof safetySnap.contacts!=='number') throw new Error('Safety snapshot missing contacts count');
          if(typeof safetySnap.tripShareEnabled!=='boolean') throw new Error('Safety snapshot missing tripShareEnabled');
          if(typeof safetySnap.rideCheckEnabled!=='boolean') throw new Error('Safety snapshot missing rideCheckEnabled');
          if(fatalErrors().length)throw new Error('Fatal runtime error opening Safety: '+fatalErrors().join(' | '));
          console.log('PASS: public Safety navigation bridge opened the real Safety hub and published live Safety state');
          await openHome(page,'v','Route');
          // Phase 47 removed the public browser geocoding bridge; Flutter
          // geocodes through the authenticated Movera API instead.
          const geo=await page.evaluate(()=>({forward:typeof window.moveraGeocodeAddress,reverse:typeof window.moveraReverseGeocode})); await dump('geocoding',{geo});
          if(geo.forward!=='undefined'||geo.reverse!=='undefined')throw new Error('Public browser geocoding bridge is exposed: '+JSON.stringify(geo));
          await routeToSelection(page,'live');await shot('route-filled');await dump('categories');
          const categoriesInitial=await shot('categories');if(fatalErrors().length)throw new Error('Fatal runtime error entering categories: '+fatalErrors().join(' | '));

          // Every category is a button; picking one moves the main button to it
          // ('Select Comfort'), so each tap is checked by what the rider reads.
          const rideTypes=['Comfort','Priority','Movera XL','Van','Movera'];
          const picked=[];
          for(const label of rideTypes){
            await tapNamed(page,new RegExp(`^${label} \\d`),`Category ${label}`);
            await page.waitForTimeout(600);
            if(!(await hasButton(page,new RegExp(`^Select ${label}$`))))throw new Error(`Category ${label}: main button did not become 'Select ${label}'`);
            picked.push(label);
            await shot(`ride-${label.toLowerCase().replace(/\W+/g,'-')}`);
            if(fatalErrors().length)throw new Error(`Fatal runtime error selecting ${label}: `+fatalErrors().join(' | '));
          }
          fs.writeFileSync('qa-ride-categories.json',JSON.stringify({picked},null,2));

          // Payment: the row under the categories opens 'Pay with'; picking a method
          // closes it and the row names the new method.
          const paymentRow=/^(Cash|Card|Apple Pay|Google Pay)\b/;
          for(const method of ['Apple Pay','Cash']){
            await tapNamed(page,paymentRow,'Payment row');await page.waitForTimeout(800);await shot(`payment-open-${method.toLowerCase().replace(' ','-')}`);
            await tapNamed(page,new RegExp(`^${method}\\b`),`Pay with ${method}`);await page.waitForTimeout(800);
            if(!(await hasButton(page,/^Select Movera$/)))throw new Error(`Payment: 'Pay with' sheet did not close after ${method}`);
            if(!(await hasButton(page,new RegExp(`^${method}\\b`))))throw new Error(`Payment: row did not switch to ${method}`);
          }
          const paymentCash=await shot('payment-cash');if(fatalErrors().length)throw new Error('Fatal runtime error changing payment: '+fatalErrors().join(' | '));

          // 'Book now or later': both choices; Book now keeps the categories.
          await tapNamed(page,'Book now or later','Pickup time');await page.waitForTimeout(800);const bookingSheet=await shot('pickup-time-sheet');
          if(!(await hasButton(page,/^Book for later\b/)))throw new Error("Pickup time sheet: 'Book for later' missing");
          await tapNamed(page,/^Book now\b/,'Book now');await page.waitForTimeout(800);const afterBookNow=await shot('after-book-now');
          if(!(await hasButton(page,/^Select Movera$/)))throw new Error("Book now did not return to 'Select Movera'");

          await tapNamed(page,'Select Movera','Select ride');
          await waitOwner(page,'pickup','Pickup');await page.waitForTimeout(1200);await shot('pickup');
          await tapNamed(page,'Confirm and search','Confirm pickup');
          await waitOwner(page,'finding','Finding',15000);await page.waitForTimeout(1500);
          const findingDrivers=await shot('after-final-booking-cta');await dump('after-final-booking-cta');
          if(fatalErrors().length)throw new Error('Fatal runtime error after final booking CTA: '+fatalErrors().join(' | '));

          const matchingHooks=await page.evaluate(()=>typeof window.moveraHoldMatching==='function');
          if(!matchingHooks){
            await shot('search-hooks-skipped');
            fs.writeFileSync('qa-search-delayed.json', JSON.stringify({skipped:true,reason:'public release matching hooks off'},null,2));
            console.log('SKIP: delayed search / assign hooks off on public release (expected)');
          } else try {
            await page.waitForFunction(()=>typeof window.moveraHoldMatching==='function',{timeout:20000});
            const held=await page.evaluate(()=>window.moveraHoldMatching());
            const advanced=await page.evaluate(()=>window.moveraAdvanceSearch(61));
            await page.waitForTimeout(900);
            const searchSnap=await page.evaluate(()=>{try{return JSON.parse(window.moveraSearchSnapshotJson||'{}');}catch(e){return {};}});
            await shot('search-delayed');
            fs.writeFileSync('qa-search-delayed.json', JSON.stringify({held,advanced,searchSnap,pageErrors:[...pageErrors],consoleErrors:[...consoleErrors]},null,2));
            if(searchSnap.delayed!==true) throw new Error('Delayed search snapshot missing: '+JSON.stringify(searchSnap));
            if(searchSnap.bumpVisible!==true) throw new Error('Price bump was not shown after 60s: '+JSON.stringify(searchSnap));
            const assigned=await page.evaluate(()=>window.moveraAssignDriver());
            await page.waitForTimeout(2200);
            await shot('driver-found');
            const foundSnap=await page.evaluate(()=>{try{return JSON.parse(window.moveraSearchSnapshotJson||'{}');}catch(e){return {};}});
            fs.writeFileSync('qa-driver-found.json', JSON.stringify({assigned,foundSnap,pageErrors:[...pageErrors],consoleErrors:[...consoleErrors]},null,2));
            await page.mouse.click(28,56); await page.waitForTimeout(900);
            await shot('cancel-confirm');
            await page.mouse.click(28,52); await page.waitForTimeout(700);
            await shot('cancel-keep');
            if(fatalErrors().length) throw new Error('Fatal runtime error in delayed search QA: '+fatalErrors().join(' | '));
            console.log('PASS: delayed search copy, price bump, driver found card, cancel kept ride');
          } catch (error) {
            await shot('search-qa-failed');
            throw error;
          }

          console.log('PASS: exact live Rider completed route entry, ride types, Cash payment, Book now, pickup and the final booking transition to Finding with no fatal runtime errors');

          async function seedRestore(page, snapshot, shotName, expectedSurface){
            await page.goto(base+`?restore=${Date.now()}`,{waitUntil:'load',timeout:120000});
            await page.waitForFunction(() => typeof window.moveraSeedActiveRide === 'function', null, {timeout:60000});
            const seeded = await page.evaluate(async (raw) => await window.moveraSeedActiveRide(raw), JSON.stringify(snapshot));
            if(seeded !== 'ok') throw new Error('moveraSeedActiveRide failed: '+seeded);
            await page.reload({waitUntil:'load'});
            await page.waitForFunction(() => window.moveraFirstSurface && window.moveraFirstSurface !== 'hold', null, {timeout:60000});
            const first = await page.evaluate(() => window.moveraFirstSurface);
            const homeBuilt = await page.evaluate(() => window.moveraHomeBuilt === true);
            const current = await page.evaluate(() => window.moveraRestoreSurface);
            if(first !== expectedSurface) throw new Error(`first restored surface was ${first}, expected ${expectedSurface}`);
            if(homeBuilt) throw new Error(`Home was constructed during ${expectedSurface} restore`);
            if(current && current !== expectedSurface) throw new Error(`current surface ${current}, expected ${expectedSurface}`);
            await page.waitForTimeout(2500);
            const shot = await page.screenshot({path:`qa-${shotName}.png`,fullPage:true});
            fs.writeFileSync(`qa-${shotName}.json`, JSON.stringify({first, current, homeBuilt, expectedSurface},null,2));
            return shot;
          }
          const findingSnap={
            status:'findingDriver',
            savedAt:new Date().toISOString(),
            pickupAddress:'Current location',
            destinationAddress:'Stockholm Central Station',
            pickupLat:59.3293,pickupLng:18.0686,
            destinationLat:59.3301,destinationLng:18.058,
            rideType:'Movera',price:259,paymentMethod:'Apple Pay',rideId:'qa-restore-1'
          };
          const seedHooks=await page.evaluate(()=>typeof window.moveraSeedActiveRide==='function');
          if(!seedHooks){
            fs.writeFileSync('qa-restore-finding.json', JSON.stringify({skipped:true,reason:'public release seed hooks off'},null,2));
            console.log('SKIP: restore seed hooks off on public release (expected)');
          } else {
          const restorePage=await context.newPage();
          const restoreShot=await seedRestore(restorePage, findingSnap, 'restore-finding', 'finding');
          if(Buffer.compare(restoreShot, home)===0) throw new Error('Restore reload showed Home flash/same Home');
          console.log('PASS: restore finding first surface was Finding, Home never constructed');

          const waitingSnap={...findingSnap, status:'driverAssigned', rideId:'qa-restore-wait'};
          const waitPage=await context.newPage();
          const waitShot=await seedRestore(waitPage, waitingSnap, 'restore-waiting', 'waiting');
          if(Buffer.compare(waitShot, home)===0) throw new Error('Waiting restore showed Home');
          if(Buffer.compare(waitShot, restoreShot)===0) throw new Error('Waiting restore matched Finding restore');
          console.log('PASS: restore waiting first surface was Waiting, Home never constructed');
          }

          function forbidOwner(actual, forbidden, label){
            if(actual && forbidden.includes(actual)) throw new Error(`${label} stale map owner ${actual}`);
          }
          const stressContext=await browser.newContext({viewport:{width:390,height:844},deviceScaleFactor:1,isMobile:true,hasTouch:true,locale:'en-US',geolocation:{latitude:59.3293,longitude:18.0686},permissions:['geolocation']});
          // Round 4: the app speaks the zone's language (sv in Stockholm); these
          // checks read the English copy, so pin the rider's choice to English.
          await stressContext.addInitScript(() => localStorage.setItem('flutter.movera_app_language', '"en"'));
          watchGeocoders(stressContext);
          const stressPage=await stressContext.newPage();
          stressPage.on('pageerror',e=>pageErrors.push({message:String(e),stack:e.stack||''}));
          stressPage.on('console',m=>{if(m.type()==='error')consoleErrors.push(m.text());});
          await openHome(stressPage,'mapstress','Map stress');
          const stressHome=await stressPage.screenshot({path:'qa-map-stress-home.png',fullPage:true});
          // Open the route planner, close it, open it again: Home takes the map back.
          await tapNamed(stressPage,'Where to?','Map stress: Home');await stressPage.waitForTimeout(1200);
          const stressPlanner=await stressPage.screenshot({path:'qa-map-stress-planner.png',fullPage:true});
          if(Buffer.compare(stressHome, stressPlanner)===0) throw new Error('Map stress route planner did not open');
          forbidOwner(await stressPage.evaluate(()=>window.moveraMapOwner), ['select_ride','pickup','finding','waiting'], 'planner');
          await tapNamed(stressPage,'Close','Map stress: planner');
          await waitOwner(stressPage,'home','Map stress: planner closed');
          await stressPage.waitForTimeout(800);
          // Select ride, Back, and again: no stale ride map stays in charge.
          await routeToSelection(stressPage,'Map stress');
          await tapNamed(stressPage,'Back','Map stress: Select ride');await stressPage.waitForTimeout(1500);
          forbidOwner(await stressPage.evaluate(()=>window.moveraMapOwner), ['select_ride','pickup','finding','waiting'], 'select-ride-back');
          await stressPage.screenshot({path:'qa-map-stress-back.png',fullPage:true});
          await openHome(stressPage,'mapflow','Map flow');
          await routeToSelection(stressPage,'Map flow');
          await stressPage.screenshot({path:'qa-map-stress-select.png',fullPage:true});
          const selectOwner=await stressPage.evaluate(()=>window.moveraMapOwner);
          const selectGen=await stressPage.evaluate(()=>window.moveraMapGeneration);
          forbidOwner(selectOwner, ['waiting','finding'], 'select-ride');
          await tapNamed(stressPage,'Select Movera','Map flow: Select ride');
          await waitOwner(stressPage,'pickup','Map flow: pickup');await stressPage.waitForTimeout(1000);
          await tapNamed(stressPage,'Confirm and search','Map flow: Confirm pickup');
          await waitOwner(stressPage,'finding','Map flow: finding');
          await stressPage.screenshot({path:'qa-map-stress-finding.png',fullPage:true});
          const findingOwner=await stressPage.evaluate(()=>window.moveraMapOwner);
          const findingGen=await stressPage.evaluate(()=>window.moveraMapGeneration);
          forbidOwner(findingOwner, ['home','pickup'], 'finding');
          // The demo assigns a driver: Finding becomes Waiting.
          await waitOwner(stressPage,'waiting','Map flow: waiting',45000);
          await stressPage.screenshot({path:'qa-map-stress-waiting.png',fullPage:true});
          const waitingOwner=await stressPage.evaluate(()=>window.moveraMapOwner);
          const waitingGen=await stressPage.evaluate(()=>window.moveraMapGeneration);
          forbidOwner(waitingOwner, ['home','pickup'], 'waiting');
          await stressPage.evaluate(()=>{document.dispatchEvent(new Event('visibilitychange')); window.dispatchEvent(new Event('pageshow'));});
          await stressPage.waitForTimeout(1200);
          await stressPage.screenshot({path:'qa-map-stress-resume.png',fullPage:true});
          const resumeOwner=await stressPage.evaluate(()=>window.moveraMapOwner);
          const resumeGen=await stressPage.evaluate(()=>window.moveraMapGeneration);
          forbidOwner(resumeOwner, ['home','pickup'], 'resume');
          if(resumeGen && waitingGen && Number(resumeGen) < Number(waitingGen)) throw new Error('resume dropped map generation');
          if(fatalErrors().length) throw new Error('Map stress fatal: '+fatalErrors().join(' | '));
          fs.writeFileSync('qa-map-stress.json', JSON.stringify({pageErrors:[...pageErrors],consoleErrors:[...consoleErrors],selectOwner,selectGen,findingOwner,findingGen,waitingOwner,waitingGen,resumeOwner,resumeGen},null,2));
          console.log('PASS: map stress planner and Select ride back out cleanly; Home to Finding to Waiting resume with no fatal runtime errors');
          await stressContext.close();

          // Book for later: date and time, then 'Schedule Movera', then the pickup's
          // 'Confirm and schedule' shows 'Your ride is scheduled' and never Finding.
          const laterContext=await browser.newContext({viewport:{width:390,height:844},deviceScaleFactor:1,isMobile:true,hasTouch:true,locale:'en-US',geolocation:{latitude:59.3293,longitude:18.0686},permissions:['geolocation']});
          await laterContext.addInitScript(() => localStorage.setItem('flutter.movera_app_language', '"en"'));
          watchGeocoders(laterContext);
          const laterPage=await laterContext.newPage();
          laterPage.on('pageerror',e=>pageErrors.push({message:String(e),stack:e.stack||''}));
          laterPage.on('console',m=>{if(m.type()==='error')consoleErrors.push(m.text());});
          const ownersSeen=new Set();
          await openHome(laterPage,'booklater','Book later');
          await routeToSelection(laterPage,'Book later');
          await laterPage.screenshot({path:'qa-book-later-categories.png',fullPage:true});
          await tapNamed(laterPage,'Book now or later','Book later: pickup time');await laterPage.waitForTimeout(800);
          await laterPage.screenshot({path:'qa-book-later-when-sheet.png',fullPage:true});
          await tapNamed(laterPage,/^Book for later\b/,'Book later: sheet');await laterPage.waitForTimeout(1200);
          await laterPage.screenshot({path:'qa-book-later-date.png',fullPage:true});
          if(!(await hasButton(laterPage,/^Date\b/))||!(await hasButton(laterPage,/^Time\b/)))throw new Error('Book later: date and time rows missing');
          await tapNamed(laterPage,/^Time\b/,'Book later: time row');await laterPage.waitForTimeout(900);
          await laterPage.screenshot({path:'qa-book-later-time.png',fullPage:true});
          await tapNamed(laterPage,'Done','Book later: time picker');await laterPage.waitForTimeout(800);
          await tapNamed(laterPage,'Continue','Book later: date and time');
          await waitOwner(laterPage,'select_ride','Book later: categories',20000);await laterPage.waitForTimeout(1000);
          await laterPage.screenshot({path:'qa-book-later-after-picker.png',fullPage:true});
          await tapNamed(laterPage,'Schedule Movera','Book later: Schedule');
          await waitOwner(laterPage,'pickup','Book later: pickup');await laterPage.waitForTimeout(1000);
          ownersSeen.add(await laterPage.evaluate(()=>window.moveraMapOwner||''));
          await tapNamed(laterPage,'Confirm and schedule','Book later: Confirm and schedule');
          await laterPage.getByText('Your ride is scheduled',{exact:true}).first().waitFor({state:'visible',timeout:15000}).catch(()=>{throw new Error("Book later: 'Your ride is scheduled' not shown");});
          for(let i=0;i<6;i++){ownersSeen.add(await laterPage.evaluate(()=>window.moveraMapOwner||''));await laterPage.waitForTimeout(500);}
          await laterPage.screenshot({path:'qa-book-later-after-cta.png',fullPage:true});
          if(ownersSeen.has('finding'))throw new Error('Book later opened Finding Driver');
          await tapNamed(laterPage,'Done','Book later: scheduled');
          await waitOwner(laterPage,'home','Book later: back Home');
          if(!(await hasButton(laterPage,/^Reservation in\b/)))throw new Error("Book later: Home shows no 'Reservation in' chip");
          await laterPage.screenshot({path:'qa-book-later-home.png',fullPage:true});
          fs.writeFileSync('qa-book-later.json', JSON.stringify({ownersSeen:[...ownersSeen],pageErrors:[...pageErrors],consoleErrors:[...consoleErrors]},null,2));
          if(fatalErrors().length) throw new Error('Book later fatal: '+fatalErrors().join(' | '));
          console.log('PASS: Book for later picked a time, scheduled the ride, showed Ride scheduled and the Home reservation chip, never Finding Driver');
          await laterContext.close();

          await browser.close();
          // The demo build (movera-environment.json flavor 'demo') may ask public
          // Nominatim for a street name when its in-process transport has none
          // (AppGeocoding.allowPublicReverseFallback, demo/dev/test only). Any other
          // public geocoding, and any of it from a staging or production build, fails.
          let flavor='unknown';
          try{flavor=(await (await fetch(base+'movera-environment.json',{cache:'no-store'})).json()).flavor||'unknown';}catch(_){}
          const demoReverse=u=>/^https:\/\/nominatim\.openstreetmap\.org\/reverse\?/.test(u);
          const forbiddenGeocoding=[...new Set(publicGeocoderRequests)].filter(u=>!(flavor==='demo'&&demoReverse(u)));
          fs.writeFileSync('qa-geocoding-requests.json',JSON.stringify({flavor,all:[...new Set(publicGeocoderRequests)],forbidden:forbiddenGeocoding},null,2));
          if(forbiddenGeocoding.length)throw new Error(`Rider data sent to a public geocoder (${flavor} build): `+forbiddenGeocoding.join(' | '));
          console.log(`PASS: no forbidden browser-side public geocoding across the live flow (${flavor} build; demo street-name fallback requests: ${publicGeocoderRequests.filter(demoReverse).length})`);
          JS
          node qa-live.mjs

      - name: Upload QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-live-rider-flow
          path: |
            qa-*.png
            qa-*.json
          if-no-files-found: warn
