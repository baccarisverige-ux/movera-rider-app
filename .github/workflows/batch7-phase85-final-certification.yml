# Audit Phase 2: the analyzer, full unit suite, integration UAT and release
# builds that this workflow also ran now run once in ci.yml. What stays is the
# check nothing else does: the demo build in headless Chromium and WebKit at
# phone, tablet and landscape sizes (needs the Maps key secret).
name: Batch 7 Phase 85 browser responsive matrix

# CI cost cut (owner 2026-11-06):
#   - every pull request push (not drafts): one fast browser, Chromium only,
#     at every responsive size;
#   - full run (Chromium + WebKit, and web memory over repeated bookings):
#     only with the label `ready-to-merge` (adding the label starts it; every
#     later push while the label is on runs it again), on pushes to main, and
#     manually (Actions > this workflow > Run workflow).
on:
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'web/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/batch7-phase85-final-certification.yml'
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled]
    paths:
      - 'lib/**'
      - 'test/**'
      - 'integration_test/**'
      - 'web/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Adding some other label does not cancel a running matrix: that event gets
  # its own group and its jobs are skipped.
  group: ${{ github.workflow }}-${{ github.ref }}-${{ (github.event.action == 'labeled' && github.event.label.name != 'ready-to-merge') && github.event.label.name || 'run' }}
  cancel-in-progress: true

jobs:
  responsive-browser:
    name: Local Chromium + WebKit responsive matrix
    # Same check name as before; WebKit only in the full run.
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.draft != true &&
       (github.event.action != 'labeled' || github.event.label.name == 'ready-to-merge'))
    env:
      FULL_MATRIX: ${{ (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ready-to-merge')) }}
    runs-on: ubuntu-24.04  # ubuntu-latest is 26.04: no Playwright Chromium, json.hpp fails to compile
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.7'
          cache: true
      - run: flutter pub get --enforce-lockfile

      - name: Build exact candidate demo web
        run: |
          flutter build web --release \
            -t lib/main_demo.dart \
            --dart-define=MOVERA_FLAVOR=demo
          test -f build/web/main.dart.js

      - name: Configure Google Maps exactly like the live deploy
        env:
          MAPS_WEB_API_KEY: ${{ secrets.MAPS1 || secrets.MAPS || secrets.GOOGLE_MAPS_WEB_API_KEY || secrets.GOOGLE_MAPS_API_KEY || secrets.MAPS_API_KEY }}
        run: |
          if [ -z "$MAPS_WEB_API_KEY" ]; then
            echo "::error::Missing Google Maps API key for Phase 85 browser certification."
            exit 1
          fi
          python3 - <<'PY'
          import os
          from pathlib import Path

          p = Path('build/web/index.html')
          s = p.read_text()
          bootstrap = '  <script src="flutter_bootstrap.js" defer onerror="window.moveraBootFailed && window.moveraBootFailed()"></script>'
          # LT-4 (owner 2026-11-03): as the live deploy, Maps loads when the first map opens.
          maps = (
              '  <script>window.moveraMapsSrc = "https://maps.googleapis.com/maps/api/js?key='
              + os.environ['MAPS_WEB_API_KEY']
              + '";</script>'
          )
          if bootstrap not in s:
              raise SystemExit('Flutter bootstrap tag not found')
          if 'maps.googleapis.com/maps/api/js' not in s:
              s = s.replace(bootstrap, maps + '\n' + bootstrap)
          p.write_text(s)
          PY
          grep -q "maps.googleapis.com/maps/api/js" build/web/index.html

      - name: Install Playwright browsers
        # The system-dependency install inside `playwright install --with-deps`
        # runs apt on the runner image; on 22 Oct it hung twice for 50+ minutes
        # on the image's service-restart prompt (needrestart). Keep apt
        # non-interactive, show the install output, and cap the step.
        timeout-minutes: 12
        env:
          DEBIAN_FRONTEND: noninteractive
          NEEDRESTART_MODE: a
          NEEDRESTART_SUSPEND: "1"
        run: |
          npm init -y >/dev/null 2>&1
          npm install --save-dev playwright@1.55.0 >/dev/null 2>&1
          if [ "$FULL_MATRIX" = true ]; then browsers="chromium webkit"; else browsers="chromium"; fi
          # If the Ubuntu mirrors are unreachable (seen 11 Nov: DNS failures),
          # fall back to the browsers alone; the runner image already has
          # Chromium's system libraries, so only extra fonts are missing.
          if ! npx playwright install --with-deps $browsers; then
            echo "::warning::apt mirrors unreachable; installing browsers without system packages"
            npx playwright install $browsers
          fi

      - name: Serve exact candidate
        run: |
          python3 -m http.server 4173 --directory build/web >/tmp/phase85-http.log 2>&1 &
          echo $! > /tmp/phase85-http.pid
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/phase85-http.log
          exit 1

      - name: Browser + responsive effect matrix
        run: |
          cat > phase85-browser.mjs <<'JS'
          import { chromium, webkit } from 'playwright';
          import fs from 'fs';

          const base = 'http://127.0.0.1:4173/';
          const viewports = [
            [320, 568],
            [375, 667],
            [390, 844],
            [430, 932],
            [768, 1024],
            [1024, 768],
          ];
          const fatalPattern =
            /RenderFlex overflowed|A RenderFlex|Null check operator|RangeError|Another exception|EXCEPTION CAUGHT BY|Uncaught TypeError|Assertion failed/i;
          // 'EXCEPTION CAUGHT BY' keeps Flutter's FIRST full error report (library,
          // widget, message) in the evidence; later ones only say 'Another
          // exception was thrown: Instance of minified:..' (webkit 844x390 flake).
          const evidence = { sha: process.env.GITHUB_SHA, chromium: [], webkit: [] };

          async function inspect(browser, family, width, height) {
            const context = await browser.newContext({
              viewport: { width, height },
              deviceScaleFactor: 1,
              isMobile: width < 768,
              hasTouch: true,
              locale: 'en-US',
              geolocation: { latitude: 59.33258, longitude: 18.0649 },
              permissions: ['geolocation'],
            });
            // Round 4: the app speaks the zone's language (sv in Stockholm); these
            // checks read the English copy, so pin the rider's choice to English.
            await context.addInitScript(() => localStorage.setItem('flutter.movera_app_language', '"en"'));
            const page = await context.newPage();
            const errors = [];
            page.on('pageerror', error => errors.push({
              source: 'pageerror',
              message: String(error),
              stack: error?.stack || '',
            }));
            page.on('console', message => {
              if (message.type() === 'error' && fatalPattern.test(message.text())) {
                errors.push({
                  source: 'console',
                  message: message.text(),
                  stack: '',
                });
              }
            });
            await page.goto(base + '?phase85=' + family + '-' + width + 'x' + height, {
              waitUntil: 'networkidle',
              timeout: 120000,
            });
            await page.waitForTimeout(3500);

            try {
              await page.getByLabel('Enable accessibility').click({ timeout: 1500 });
              await page.waitForTimeout(250);
            } catch (_) {}

            const metrics = await page.evaluate(() => ({
              width: window.innerWidth,
              height: window.innerHeight,
              docWidth: document.documentElement.scrollWidth,
              hasFlutter:
                !!document.querySelector('flutter-view') ||
                !!document.querySelector('flt-glass-pane'),
              hasGoogleMaps:
                typeof window.google !== 'undefined' &&
                !!window.google.maps,
            }));
            if (!metrics.hasFlutter) {
              throw new Error(family + ' ' + width + 'x' + height + ': Flutter surface missing');
            }
            if (!metrics.hasGoogleMaps) {
              throw new Error(
                family + ' ' + width + 'x' + height +
                ': Google Maps runtime missing from exact candidate',
              );
            }
            if (metrics.docWidth > metrics.width + 2) {
              throw new Error(
                family + ' ' + width + 'x' + height +
                ': horizontal overflow ' + metrics.docWidth + ' > ' + metrics.width,
              );
            }
            await page.screenshot({
              path: 'phase85-' + family + '-' + width + 'x' + height + '.png',
              fullPage: true,
            });
            const record = { width, height, metrics, errors };
            evidence[family].push(record);
            fs.writeFileSync(
              'phase85-browser-evidence.json',
              JSON.stringify(evidence, null, 2),
            );
            if (errors.length) {
              const scripts = await page.evaluate(() =>
                Array.from(document.scripts).map(script => script.src).filter(Boolean),
              );
              const mainScript =
                scripts.find(url => /main\.[a-f0-9]+\.dart\.js/.test(url)) ||
                scripts.find(url => /main.*dart\.js/.test(url)) ||
                null;
              const stackText = errors
                .map(error => error.message + '\n' + error.stack)
                .join('\n');
              const snippets = [];
              if (mainScript) {
                const source = await (await fetch(mainScript)).text();
                const sourceLines = source.split('\n');
                const wanted = new Set();
                for (const match of stackText.matchAll(/\.dart\.js:(\d+):(\d+)/g)) {
                  wanted.add(Number(match[1]));
                }
                for (const line of [...wanted].sort((a, b) => a - b)) {
                  const from = Math.max(1, line - 8);
                  const to = Math.min(sourceLines.length, line + 8);
                  snippets.push({
                    line,
                    from,
                    to,
                    text: sourceLines
                      .slice(from - 1, to)
                      .map((text, index) => (from + index) + ': ' + text)
                      .join('\n'),
                  });
                }
              }
              record.mainScript = mainScript;
              record.bundleSnippets = snippets;
              fs.writeFileSync(
                'phase85-browser-evidence.json',
                JSON.stringify(evidence, null, 2),
              );
              console.error(
                'PHASE85_BROWSER_ERRORS ' +
                family + ' ' + width + 'x' + height + ' ' +
                JSON.stringify({ errors, mainScript, snippets }),
              );
              await context.close();
              throw new Error(
                family + ' ' + width + 'x' + height +
                ': fatal runtime error(s): ' +
                errors.map(error => error.message).join(' | '),
              );
            }

            await context.close();
            return record;
          }

          const chrome = await chromium.launch({ headless: true });
          for (const [width, height] of viewports) {
            await inspect(chrome, 'chromium', width, height);
          }
          await chrome.close();

          if (process.env.FULL_MATRIX === 'true') {
            const safari = await webkit.launch({ headless: true });
            for (const [width, height] of [[390, 844], [430, 932], [844, 390]]) {
              await inspect(safari, 'webkit', width, height);
            }
            await safari.close();
          } else {
            console.log('WebKit skipped: fast run. Label ready-to-merge runs the full matrix.');
          }

          fs.writeFileSync('phase85-browser-evidence.json', JSON.stringify(evidence, null, 2));
          console.log('PASS: Phase 85 local browser/responsive matrix on ' + process.env.GITHUB_SHA);
          JS
          node phase85-browser.mjs

      - name: Same candidate SHA guard
        run: test "$GITHUB_SHA" = "$(git rev-parse HEAD)"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase85-browser-evidence
          path: |
            phase85-browser-evidence.json
            phase85-*.png
          if-no-files-found: warn

  web-memory:
    name: Web memory over repeated bookings (audit Phase 7)
    # Copy of the ci.yml job (same steps) for the full run.
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.draft != true &&
       contains(github.event.pull_request.labels.*.name, 'ready-to-merge') &&
       (github.event.action != 'labeled' || github.event.label.name == 'ready-to-merge'))
    runs-on: ubuntu-24.04  # ubuntu-latest is 26.04: no Playwright Chromium, json.hpp fails to compile
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.7'
          cache: true
      - uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-'3.47.7'-${{ hashFiles('pubspec.lock') }}
      - run: flutter pub get --enforce-lockfile
      - name: Demo web build with QA hooks
        run: flutter build web --release --dart-define=MOVERA_QA=true
      - name: Chromium
        run: |
          mkdir -p "$RUNNER_TEMP/pw" && cd "$RUNNER_TEMP/pw"
          npm init -y >/dev/null
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium
      - name: Six bookings in a row (book, search, cancel), heap after GC per booking
        # Normal run about 6.5 min. A frozen headless browser (hang
        # 2026-11-13) now fails fast: each browser call has 60 s, the probe's
        # own watchdog stops it after 13 min (exit 3, partial probe.json with
        # the step it hung in), and the step itself stops at 15 min.
        timeout-minutes: 15
        env:
          PROBE_WATCHDOG_MS: '780000'
        run: |
          NODE_PATH="$RUNNER_TEMP/pw/node_modules" node tool/web_lifecycle_probe.mjs \
            --dir build/web --cycles 6 --mode cancel --multi-surface --raster --out probe.json
          python3 tool/check_memory_budget.py probe.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-memory-probe
          path: probe.json
          if-no-files-found: ignore
