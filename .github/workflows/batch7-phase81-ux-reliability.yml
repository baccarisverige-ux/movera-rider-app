name: Batch 7 Phase 81 UX Reliability Route Cleanup

on:
  pull_request:
    paths:
      - 'lib/features/scheduled_rides/**'
      - 'lib/features/finding_driver/**'
      - 'lib/core/api/safety_mock_api.dart'
      - 'lib/app/router/routes.dart'
      - 'test/reservations/**'
      - 'test/scheduled_rides/**'
      - 'test/ride/**'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phase81:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.7'
          cache: true

      - run: flutter pub get

      - name: Strict analysis
        run: flutter analyze

      - name: Phase 81 behavior certification
        run: |
          flutter test test/scheduled_rides/phase81_schedule_continue_test.dart
          flutter test test/reservations/scheduled_booking_flow_test.dart
          flutter test test/ride/phase81_history_archive_logging_test.dart
          flutter test test/ride/finding_external_terminal_test.dart
          flutter test test/safety/safety_test.dart

      - name: Dead payments route is gone
        run: |
          ! grep -R "AppRoutes.payments" lib
          ! grep -R "static const payments = '/payments';" lib

      - name: No unguarded firstWhere remains in lib
        run: |
          python3 - <<'PY'
          from pathlib import Path

          failures = []
          for path in Path('lib').rglob('*.dart'):
              text = path.read_text()
              cursor = 0
              needle = 'firstWhere('
              while True:
                  start = text.find(needle, cursor)
                  if start < 0:
                      break
                  open_paren = start + len('firstWhere')
                  depth = 0
                  quote = None
                  escaped = False
                  end = None
                  for i in range(open_paren, len(text)):
                      ch = text[i]
                      if quote is not None:
                          if escaped:
                              escaped = False
                          elif ch == '\\':
                              escaped = True
                          elif ch == quote:
                              quote = None
                          continue
                      if ch in ("'", '"'):
                          quote = ch
                          continue
                      if ch == '(':
                          depth += 1
                      elif ch == ')':
                          depth -= 1
                          if depth == 0:
                              end = i + 1
                              break
                  if end is None:
                      failures.append(f'{path}: unterminated firstWhere call')
                      break
                  call = text[start:end]
                  if 'orElse:' not in call:
                      line = text.count('\n', 0, start) + 1
                      failures.append(f'{path}:{line}: firstWhere without orElse')
                  cursor = end

          if failures:
              raise SystemExit('\n'.join(failures))
          PY

      - name: Schedule Continue is a real accessible button
        run: |
          grep -q "ElevatedButton(" lib/features/scheduled_rides/presentation/select_date_time.dart
          grep -q "key: const Key('schedule-continue')" lib/features/scheduled_rides/presentation/select_date_time.dart
          ! grep -q "label: 'Schedule Continue'" lib/features/scheduled_rides/presentation/select_date_time.dart
          ! grep -q "onPointerDown: (_) => _goNext()" lib/features/scheduled_rides/presentation/select_date_time.dart

      - name: History archive failures are observable
        run: |
          grep -q "ride.history.archive_failed" lib/features/finding_driver/application/finding_driver_controller.dart
          grep -q "attempt <= 2" lib/features/finding_driver/application/finding_driver_controller.dart
