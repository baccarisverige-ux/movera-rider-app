name: Batch 7 Phase 82 Saved Places Certification

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'lib/features/home/**'
      - 'lib/features/saved_places/**'
      - 'test/saved_places/**'
      - 'test/ride/batch3_phase49_scheduled_saved_places_test.dart'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A newer push cancels the older run of the same workflow on the same ref
  # (pull request refs and branch refs are different groups).
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  phase82:
    # CI cost cut (owner 2026-11-06): drafts skip this check.
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.7'
          cache: true

      - run: flutter pub get

      - name: Strict analysis
        run: flutter analyze

      - name: Phase 82 Saved Places behavior
        run: |
          flutter test test/saved_places/phase82_saved_places_test.dart
          flutter test test/saved_places/saved_places_honest_state_test.dart
          flutter test test/ride/batch3_phase49_scheduled_saved_places_test.dart

      - name: Single saved-place source guard
        run: |
          test ! -e lib/features/saved_places/data/saved_places_repository.dart
          grep -q "HomeAddressRepository" lib/features/saved_places/application/saved_places_controller.dart
          grep -q "_places.changes.listen" lib/features/home/presentation/home.dart

      - name: Real Save Edit Delete guards
        run: |
          # Round 4: the labels come from l10n; check the code still shows
          # Saving…/Save and an Edit action, and that English reads so.
          # dart format may wrap the Text( argument, so the check reads the
          # file with whitespace collapsed.
          tr -s ' \n' ' ' < lib/features/saved_places/presentation/add_place.dart \
            | grep -qF "child: Text( _saving ? context.l10n.saving : context.l10n.save, )"
          grep -q '"saving": "Saving…"' lib/l10n/app_en.arb
          grep -q '"save": "Save"' lib/l10n/app_en.arb
          grep -q "_places.remove(" lib/features/saved_places/presentation/saved_places.dart
          grep -q "context.l10n.spEditPlace(place.title)" lib/features/saved_places/presentation/saved_places.dart
          grep -q '"spEditPlace": "Edit {place}"' lib/l10n/app_en.arb
