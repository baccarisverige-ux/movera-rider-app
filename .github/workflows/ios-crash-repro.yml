name: TEMP iOS crash repro (rider)
# TEMPORARY (branch only, removed before ready): fetch the TestFlight crash report and reproduce the
# launch crash in an iOS simulator with the same defines as the TestFlight build.
on:
  push:
    branches: [claude/laund-rule-review-j04dj5-ios]
permissions:
  contents: read
  actions: read
env:
  APP_BUNDLE_ID: com.movera.rider
jobs:
  repro:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26
        run: |
          x="$(ls -d /Applications/Xcode_2[6-9]*.app | grep -vi beta | sort -V | tail -1)"; sudo xcode-select -s "$x/Contents/Developer"; xcodebuild -version
      - name: Key
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          id="$(printf '%s' "$ASC_KEY_ID" | tr -d '[:space:]')"; issuer="$(printf '%s' "$ASC_ISSUER_ID" | tr -d '[:space:]')"
          echo "::add-mask::$id"; echo "::add-mask::$issuer"
          key="$RUNNER_TEMP/AuthKey.p8"
          if printf '%s' "$ASC_KEY_P8" | grep -q 'BEGIN PRIVATE KEY'; then printf '%s\n' "$ASC_KEY_P8" > "$key"; else printf '%s' "$ASC_KEY_P8" | base64 --decode > "$key"; fi
          { echo "ASC_KEY_ID=$id"; echo "ASC_ISSUER_ID=$issuer"; echo "ASC_KEY_PATH=$key"; } >> "$GITHUB_ENV"
      - name: Inspect TestFlight build 6 IPA (dylibs, entitlements, plist)
        uses: actions/download-artifact@v4
        with:
          name: ios-ipa-6
          run-id: 45274550887
          github-token: ${{ github.token }}
          path: ipa6
      - name: Check every linked framework is inside the app
        run: |
          set +e
          cd ipa6 && unzip -q -o ./*.ipa && app=Payload/Runner.app
          echo "--- frameworks"; ls "$app/Frameworks"
          echo "--- linked by Runner"; otool -L "$app/Runner" | tail -n +2
          echo "--- missing @rpath dylibs"
          for bin in "$app/Runner" "$app"/Frameworks/*.framework/*; do
            [ -f "$bin" ] && file "$bin" | grep -q Mach-O || continue
            otool -L "$bin" | awk 'NR>1{print $1}' | grep '^@rpath/' | while read -r l; do
              n="${l#@rpath/}"; [ -e "$app/Frameworks/$n" ] || echo "MISSING $n (needed by ${bin#$app/})"
            done
          done
          echo "--- entitlements"; codesign -d --entitlements - --xml "$app" 2>/dev/null | plutil -p - 
          echo "--- plist"; plutil -p "$app/Info.plist" | grep -v GMSApiKey
          echo "--- GMSApiKey length"; /usr/libexec/PlistBuddy -c 'Print :GMSApiKey' "$app/Info.plist" | wc -c
      - name: TestFlight crash reports (App Store Connect API)
        continue-on-error: true
        env:
          APP_APPLE_ID: '6838441599'
        run: |
          command -v fastlane >/dev/null || gem install fastlane --no-document
          ruby -I"$(dirname "$(gem which spaceship)")" ios/ci/asc_crashes.rb || ruby ios/ci/asc_crashes.rb
      - name: iOS Maps key accepts this bundle id (never printed)
        env:
          KEY: ${{ secrets.IOS_MAPS_API_KEY }}
        run: |
          KEY="$(printf '%s' "${KEY:-}" | tr -d '[:space:]')"
          [ -n "$KEY" ] || { echo "::error::Secret IOS_MAPS_API_KEY is missing."; exit 1; }
          echo "::add-mask::$KEY"
          for bid in "$APP_BUNDLE_ID" com.example.notmovera; do
            for api in "geocode/json?address=Stockholm" "place/textsearch/json?query=Stockholm" "directions/json?origin=Stockholm&destination=Uppsala"; do
              r="$(curl -s -H "X-Ios-Bundle-Identifier: $bid" "https://maps.googleapis.com/maps/api/$api&key=$KEY" | python3 -c 'import json,sys;d=json.load(sys.stdin);print(d.get("status"),"|",(d.get("error_message") or "")[:160])')"
              echo "bundle=$bid api=${api%%/*}: $r"
            done
          done
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.7'
          cache: true
      - name: Build for the simulator (same defines as TestFlight)
        env:
          PROD_API: ${{ vars.MOVERA_PROD_API_URL }}
          MAPS_KEY: ${{ secrets.IOS_MAPS_API_KEY }}
        run: |
          set -euo pipefail
          PROD_API="$(printf '%s' "$PROD_API" | tr -d '[:space:][:cntrl:]')"
          MAPS_KEY="$(printf '%s' "${MAPS_KEY:-}" | tr -d '[:space:]')"; echo "::add-mask::$MAPS_KEY"
          printf 'GOOGLE_MAPS_API_KEY = %s\n' "$MAPS_KEY" > ios/Flutter/Secrets.xcconfig
          grep -q Secrets.xcconfig ios/Flutter/Debug.xcconfig || echo '#include? "Secrets.xcconfig"' >> ios/Flutter/Debug.xcconfig
          flutter pub get --enforce-lockfile
          flutter build ios --simulator --debug -t lib/main_staging.dart \
            --dart-define=MOVERA_FLAVOR=staging --dart-define=MOVERA_API_BASE_URL="$PROD_API" \
            --dart-define=MOVERA_AUTH_REQUIRED=true --dart-define=MOVERA_APP_VERSION=1.0.0+0
          rm -f ios/Flutter/Secrets.xcconfig
      - name: Launch in a simulator and collect crash
        run: |
          set -x
          dev="$(xcrun simctl list devices available -j | python3 -c 'import json,sys;d=json.load(sys.stdin)["devices"];print([x["udid"] for k,v in d.items() if "iOS" in k for x in v if x["name"].startswith("iPhone")][-1])')"
          xcrun simctl boot "$dev"; xcrun simctl bootstatus "$dev" -b
          xcrun simctl install "$dev" build/ios/iphonesimulator/Runner.app
          xcrun simctl spawn "$dev" log stream --level debug --predicate 'process == "Runner"' > "$RUNNER_TEMP/runner.log" 2>&1 &
          xcrun simctl launch --console-pty "$dev" com.movera.rider > "$RUNNER_TEMP/console.log" 2>&1 &
          sleep 90
          xcrun simctl io "$dev" screenshot "$RUNNER_TEMP/shot.png" || true
          echo "--- running?"; xcrun simctl spawn "$dev" launchctl list | grep -i movera || echo "NOT RUNNING"
          echo "--- console"; tail -120 "$RUNNER_TEMP/console.log"
          echo "--- log (errors/faults)"; grep -iE "fault|error|exception|terminat|crash|movera\]" "$RUNNER_TEMP/runner.log" | tail -80
          echo "--- maps"; grep -iE "Google Maps|GMS|APIKey|API key|maps_config|maps are disabled" "$RUNNER_TEMP/runner.log" | grep -v "found no value" | tail -30
          echo "--- crash reports"; ls -t ~/Library/Logs/DiagnosticReports/ 2>/dev/null | head; f="$(ls -t ~/Library/Logs/DiagnosticReports/Runner* 2>/dev/null | head -1)"; [ -n "$f" ] && head -150 "$f"
          mkdir -p out; cp "$RUNNER_TEMP"/*.log "$RUNNER_TEMP/shot.png" out/ 2>/dev/null; cp crash-*.txt out/ 2>/dev/null; cp ~/Library/Logs/DiagnosticReports/Runner* out/ 2>/dev/null; true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: crash-repro
          path: out/
          retention-days: 5
      - if: always()
        run: rm -f "$RUNNER_TEMP/AuthKey.p8"
