name: Batch 6 Phase 78 Push Certification

on:
  pull_request:
    paths:
      - 'lib/core/notifications/**'
      - 'lib/core/api/**'
      - 'lib/app/**'
      - 'lib/features/auth/**'
      - 'android/app/src/main/AndroidManifest.xml'
      - 'ios/Runner/**'
      - 'ios/Runner.xcodeproj/**'
      - 'backend/src/**'
      - 'test/notifications/**'
      - 'test/architecture/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  push:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.7'
          cache: true

      - run: flutter pub get

      - name: Strict analysis
        run: flutter analyze

      - name: Push transport and composition tests
        run: |
          flutter test test/notifications/phase78_push_transport_test.dart
          flutter test test/architecture/phase72_actual_release_composition_test.dart
          flutter test test/architecture/transport_composition_test.dart

      - name: Native push capability guards
        run: |
          grep -q "android.permission.POST_NOTIFICATIONS" android/app/src/main/AndroidManifest.xml
          grep -q "aps-environment" ios/Runner/Runner.entitlements
          grep -q "remote-notification" ios/Runner/Info.plist
          grep -q "CODE_SIGN_ENTITLEMENTS = Runner/Runner.entitlements" ios/Runner.xcodeproj/project.pbxproj
          ! grep -A4 "push = environment.allowsMockTransport" lib/app/di.dart | grep -q "UnavailablePushService"

      - name: Backend push device smoke
        run: |
          node --check backend/src/index.js
          node backend/src/index.js >/tmp/movera-backend.log 2>&1 &
          BACKEND_PID=$!
          trap 'kill $BACKEND_PID' EXIT
          sleep 1
          node <<'NODE'
          (async () => {
            const base = 'http://127.0.0.1:8787';
            const headers = { 'content-type': 'application/json' };
            const register = await fetch(base + '/api/v1/push/devices', {
              method: 'POST',
              headers,
              body: JSON.stringify({
                token: 'phase78-token',
                provider: 'fcm',
                platform: 'android',
              }),
            });
            if (!register.ok) throw new Error('push registration failed');
            const registered = await register.json();
            if (registered.code !== 'OK' || registered.status !== 'registered') {
              throw new Error('push registration was not acknowledged');
            }

            const remove = await fetch(base + '/api/v1/push/devices/unregister', {
              method: 'POST',
              headers,
              body: JSON.stringify({ token: 'phase78-token' }),
            });
            if (!remove.ok) throw new Error('push unregister failed');
            const removed = await remove.json();
            if (removed.code !== 'OK' || removed.status !== 'unregistered') {
              throw new Error('push unregister was not acknowledged');
            }
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Production web build with explicit Firebase config
        run: |
          flutter build web --release             -t lib/main_production.dart             --dart-define=MOVERA_FLAVOR=production             --dart-define=MOVERA_API_BASE_URL=https://api.movera.example             --dart-define=MOVERA_FIREBASE_API_KEY=ci-api-key             --dart-define=MOVERA_FIREBASE_APP_ID=ci-app-id             --dart-define=MOVERA_FIREBASE_MESSAGING_SENDER_ID=ci-sender             --dart-define=MOVERA_FIREBASE_PROJECT_ID=ci-project             --dart-define=MOVERA_FIREBASE_VAPID_KEY=ci-vapid
          test -f build/web/main.dart.js
