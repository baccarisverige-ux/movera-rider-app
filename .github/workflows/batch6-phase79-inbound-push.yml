name: Batch 6 Phase 79 Inbound Push Certification

on:
  pull_request:
    paths:
      - 'lib/core/notifications/**'
      - 'lib/features/notifications/**'
      - 'lib/app/bootstrap.dart'
      - 'lib/app/router/routes.dart'
      - 'android/app/src/main/AndroidManifest.xml'
      - 'test/notifications/**'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inbound-push:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.7'
          cache: true

      - run: flutter pub get

      - name: Strict analysis
        run: flutter analyze

      - name: Phase 78 and 79 push regression suite
        run: |
          flutter test test/notifications/phase78_push_transport_test.dart
          flutter test test/notifications/phase79_inbound_push_test.dart
          flutter test test/notifications/notifications_empty_state_test.dart

      - name: Push navigation safety guards
        run: |
          grep -q "openRide: openRideFromNotification" lib/app/bootstrap.dart
          grep -q "reconnectAndResync(expected)" lib/features/notifications/application/notification_navigation.dart
          grep -q "PushDestination.ride" lib/features/notifications/application/push_coordinator.dart
          ! grep -q "Navigator.*deepLink" lib/features/notifications/application/push_coordinator.dart
          ! grep -q "Navigator.*deepLink" lib/features/notifications/presentation/notifications.dart

      - name: Android manifest is valid XML
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          ET.parse('android/app/src/main/AndroidManifest.xml')
          PY
          grep -q "android.permission.POST_NOTIFICATIONS" android/app/src/main/AndroidManifest.xml
          ! grep -Fq '\\n' android/app/src/main/AndroidManifest.xml

      - name: Android debug build
        run: |
          flutter build apk --debug -t lib/main_demo.dart
          test -f build/app/outputs/flutter-apk/app-debug.apk
