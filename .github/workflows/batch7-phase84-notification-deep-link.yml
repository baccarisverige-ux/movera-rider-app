name: Batch 7 Phase 84 Notification Deep Link Certification

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'lib/features/notifications/**'
      - 'lib/app/bootstrap.dart'
      - 'test/notifications/**'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A newer push cancels the older run of the same workflow on the same ref
  # (pull request refs and branch refs are different groups).
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  phase84:
    # CI cost cut (owner 2026-11-06): drafts skip this check.
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.7'
          cache: true

      - run: flutter pub get

      - name: Strict analysis
        run: flutter analyze

      - name: Phase 84 notification behavior
        run: |
          flutter test test/notifications/phase84_notification_tap_test.dart
          flutter test test/notifications/phase79_inbound_push_test.dart
          flutter test test/notifications/notifications_empty_state_test.dart

      - name: Notification target safety
        run: |
          grep -q "notificationRideTarget" lib/features/notifications/presentation/notifications.dart
          grep -q "openRideFromNotification" lib/app/bootstrap.dart
          ! grep -q "Navigator.*deepLink" lib/features/notifications/presentation/notifications.dart
