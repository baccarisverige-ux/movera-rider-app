name: Batch 6 Phase 73 Auth Certification

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'lib/features/auth/**'
      - 'lib/core/auth/**'
      - 'lib/core/api/**'
      - 'lib/features/ride_booking/application/ride_restore_coordinator.dart'
      - 'lib/app/config/env.dart'
      - 'test/auth/**'
      - 'test/ride/restore_test.dart'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A newer push cancels the older run of the same workflow on the same ref
  # (pull request refs and branch refs are different groups).
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  auth-certification:
    # CI cost cut (owner 2026-11-06): drafts skip this check.
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.7'
          cache: true

      - run: flutter pub get

      - name: Strict auth analysis
        run: flutter analyze

      - name: OTP and token contracts
        run: |
          flutter test test/auth/phase73_auth_contract_test.dart
          flutter test test/auth/phase73_auth_ui_test.dart
          flutter test test/auth/phone_verification_copy_test.dart
          flutter test test/auth/token_store_test.dart

      - name: Active ride restore remains stronger than auth gate
        run: |
          flutter test test/ride/restore_test.dart
          flutter test test/ride/restore_surface_matrix_test.dart
          flutter test test/journeys/resume_mid_ride_test.dart

      - name: Build production with auth gate enabled
        run: |
          flutter build web --release \
            -t lib/main_production.dart \
            --dart-define=MOVERA_FLAVOR=production \
            --dart-define=MOVERA_API_BASE_URL=https://api.movera.example \
            --dart-define=MOVERA_AUTH_REQUIRED=true
          test -f build/web/main.dart.js
