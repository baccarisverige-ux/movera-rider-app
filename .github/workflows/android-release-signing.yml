name: Android release signing check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  signed-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.7'
          cache: true
      - name: Prepare release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.MOVERA_RELEASE_KEYSTORE_BASE64 }}
          MOVERA_RELEASE_STORE_PASSWORD: ${{ secrets.MOVERA_RELEASE_STORE_PASSWORD }}
          MOVERA_RELEASE_KEY_ALIAS: ${{ secrets.MOVERA_RELEASE_KEY_ALIAS }}
          MOVERA_RELEASE_KEY_PASSWORD: ${{ secrets.MOVERA_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64"
          test -n "$MOVERA_RELEASE_STORE_PASSWORD"
          test -n "$MOVERA_RELEASE_KEY_ALIAS"
          test -n "$MOVERA_RELEASE_KEY_PASSWORD"
          install -m 700 -d "$RUNNER_TEMP/release-signing"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release-signing/keystore.jks"
          chmod 600 "$RUNNER_TEMP/release-signing/keystore.jks"
          echo "MOVERA_RELEASE_KEYSTORE_PATH=$RUNNER_TEMP/release-signing/keystore.jks" >> "$GITHUB_ENV"
      - name: Build and inspect signed production release APK
        env:
          MOVERA_RELEASE_STORE_PASSWORD: ${{ secrets.MOVERA_RELEASE_STORE_PASSWORD }}
          MOVERA_RELEASE_KEY_ALIAS: ${{ secrets.MOVERA_RELEASE_KEY_ALIAS }}
          MOVERA_RELEASE_KEY_PASSWORD: ${{ secrets.MOVERA_RELEASE_KEY_PASSWORD }}
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY || secrets.GOOGLE_MAPS_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${MAPS_API_KEY:-}" ]; then
            echo '::error::Missing Google Maps key. Add the MAPS_API_KEY repository secret; a release APK without it shows a blank map (Gradle refuses to build it).'
            exit 1
          fi
          flutter pub get
          # D-027: sign the production composition (PinComposition and the
          # transport guards are only enforced there), not the demo app.
          # rider-u18: telemetry reports the pubspec version, not 'dev'.
          app_version="$(sed -n 's/^version: *//p' pubspec.yaml)"
          test -n "$app_version"
          flutter build apk --release \
            -t lib/main_production.dart \
            --dart-define=MOVERA_FLAVOR=production \
            --dart-define=MOVERA_API_BASE_URL=https://api.movera.example \
            --dart-define=MOVERA_APP_VERSION="$app_version"
          apk=build/app/outputs/flutter-apk/app-release.apk
          test -f "$apk"
          apksigner="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)"
          test -n "$apksigner"
          "$apksigner" verify --print-certs "$apk" > "$RUNNER_TEMP/apk-certificate.txt"
          if grep -qi 'Android Debug\|CN=Android Debug' "$RUNNER_TEMP/apk-certificate.txt"; then
            echo '::error::Release APK is debug-signed'
            exit 1
          fi
          keytool -list -v -keystore "$MOVERA_RELEASE_KEYSTORE_PATH" \
            -storepass "$MOVERA_RELEASE_STORE_PASSWORD" \
            -alias "$MOVERA_RELEASE_KEY_ALIAS" > "$RUNNER_TEMP/keystore-certificate.txt"
          if grep -qi 'CN=Android Debug' "$RUNNER_TEMP/keystore-certificate.txt"; then
            echo '::error::Release keystore contains an Android debug certificate'
            exit 1
          fi
