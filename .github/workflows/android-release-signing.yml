name: Android release signing check

on:
  workflow_dispatch:
    inputs:
      app_bundle:
        # Store prep (Rules plan/stores/STORE-READINESS.md 2a): Google Play needs an App Bundle (.aab), not an APK.
        # Off by default: a run without ticking it does exactly what it did before (APK check only, no upload).
        description: 'Also build a signed App Bundle (.aab) for Google Play with the same release key, and keep it as a run artifact'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  signed-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      # Owner 2026-11-23: real "Sign in with Google / Apple". The client ids (not secrets) come from the
      # repository variables below; an empty one keeps that button on "coming soon" (lib: ProviderSignInConfig).
      # A pasted space or line break is stripped, like MOVERA_PROD_API_URL.
      - name: Sign-in client ids
        env:
          V_GOOGLE_CLIENT_ID_WEB: ${{ vars.GOOGLE_CLIENT_ID_WEB }}
          V_GOOGLE_CLIENT_ID_IOS: ${{ vars.GOOGLE_CLIENT_ID_IOS }}
          V_GOOGLE_SERVER_CLIENT_ID: ${{ vars.GOOGLE_SERVER_CLIENT_ID }}
          V_APPLE_SERVICE_ID: ${{ vars.APPLE_SERVICE_ID }}
          V_APPLE_REDIRECT_URI: ${{ vars.APPLE_REDIRECT_URI }}
        run: |
          set -euo pipefail
          for n in GOOGLE_CLIENT_ID_WEB GOOGLE_CLIENT_ID_IOS GOOGLE_SERVER_CLIENT_ID APPLE_SERVICE_ID APPLE_REDIRECT_URI; do
            v="V_$n"
            clean="$(printf '%s' "${!v:-}" | tr -d '[:space:][:cntrl:]')"
            echo "$n=$clean" >> "$GITHUB_ENV"
            export "$n=$clean"
          done
          case "$APPLE_REDIRECT_URI" in ''|https://*) ;; *) echo "::error::APPLE_REDIRECT_URI must start with https://"; exit 1 ;; esac
          # iOS: the reversed iOS client id is the app's URL scheme (ios/Flutter/GoogleSignIn.xcconfig, untracked).
          case "$GOOGLE_CLIENT_ID_IOS" in
            *.apps.googleusercontent.com)
              printf 'GOOGLE_REVERSED_CLIENT_ID = com.googleusercontent.apps.%s\n' "${GOOGLE_CLIENT_ID_IOS%.apps.googleusercontent.com}" > ios/Flutter/GoogleSignIn.xcconfig ;;
            '') ;;
            *) echo "::error::GOOGLE_CLIENT_ID_IOS must end with .apps.googleusercontent.com"; exit 1 ;;
          esac

      # Gradle 8.14 cannot run on the runner's default Java 25 (run 45163948389); same JDK as android-test-apk.yml.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.7'
          cache: true
      - name: Prepare release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.MOVERA_RELEASE_KEYSTORE_BASE64 }}
          MOVERA_RELEASE_STORE_PASSWORD: ${{ secrets.MOVERA_RELEASE_STORE_PASSWORD }}
          MOVERA_RELEASE_KEY_ALIAS: ${{ secrets.MOVERA_RELEASE_KEY_ALIAS }}
          MOVERA_RELEASE_KEY_PASSWORD: ${{ secrets.MOVERA_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64"
          test -n "$MOVERA_RELEASE_STORE_PASSWORD"
          test -n "$MOVERA_RELEASE_KEY_ALIAS"
          test -n "$MOVERA_RELEASE_KEY_PASSWORD"
          install -m 700 -d "$RUNNER_TEMP/release-signing"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release-signing/keystore.jks"
          chmod 600 "$RUNNER_TEMP/release-signing/keystore.jks"
          echo "MOVERA_RELEASE_KEYSTORE_PATH=$RUNNER_TEMP/release-signing/keystore.jks" >> "$GITHUB_ENV"
      - name: Build and inspect signed production release APK
        env:
          MOVERA_RELEASE_STORE_PASSWORD: ${{ secrets.MOVERA_RELEASE_STORE_PASSWORD }}
          MOVERA_RELEASE_KEY_ALIAS: ${{ secrets.MOVERA_RELEASE_KEY_ALIAS }}
          MOVERA_RELEASE_KEY_PASSWORD: ${{ secrets.MOVERA_RELEASE_KEY_PASSWORD }}
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY || secrets.GOOGLE_MAPS_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${MAPS_API_KEY:-}" ]; then
            echo '::error::Missing Google Maps key. Add the MAPS_API_KEY repository secret; a release APK without it shows a blank map (Gradle refuses to build it).'
            exit 1
          fi
          flutter pub get
          # D-027: sign the production composition (PinComposition and the
          # transport guards are only enforced there), not the demo app.
          # rider-u18: telemetry reports the pubspec version, not 'dev'.
          app_version="$(sed -n 's/^version: *//p' pubspec.yaml)"
          test -n "$app_version"
          flutter build apk --release \
            -t lib/main_production.dart \
            --dart-define=MOVERA_FLAVOR=production \
            --dart-define=MOVERA_API_BASE_URL=https://api.movera.example \
            --dart-define=MOVERA_APP_VERSION="$app_version" \
            --dart-define=GOOGLE_CLIENT_ID_WEB="${GOOGLE_CLIENT_ID_WEB:-}" \
            --dart-define=GOOGLE_CLIENT_ID_IOS="${GOOGLE_CLIENT_ID_IOS:-}" \
            --dart-define=GOOGLE_SERVER_CLIENT_ID="${GOOGLE_SERVER_CLIENT_ID:-}" \
            --dart-define=APPLE_SERVICE_ID="${APPLE_SERVICE_ID:-}" \
            --dart-define=APPLE_REDIRECT_URI="${APPLE_REDIRECT_URI:-}"
          apk=build/app/outputs/flutter-apk/app-release.apk
          test -f "$apk"
          apksigner="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)"
          test -n "$apksigner"
          "$apksigner" verify --print-certs "$apk" > "$RUNNER_TEMP/apk-certificate.txt"
          if grep -qi 'Android Debug\|CN=Android Debug' "$RUNNER_TEMP/apk-certificate.txt"; then
            echo '::error::Release APK is debug-signed'
            exit 1
          fi
          keytool -list -v -keystore "$MOVERA_RELEASE_KEYSTORE_PATH" \
            -storepass "$MOVERA_RELEASE_STORE_PASSWORD" \
            -alias "$MOVERA_RELEASE_KEY_ALIAS" > "$RUNNER_TEMP/keystore-certificate.txt"
          if grep -qi 'CN=Android Debug' "$RUNNER_TEMP/keystore-certificate.txt"; then
            echo '::error::Release keystore contains an Android debug certificate'
            exit 1
          fi
      # Only when the app_bundle box is ticked. Same entry file, dart-defines and release key (Gradle reads the same
      # MOVERA_RELEASE_* values) as the APK above; nothing is uploaded to any store.
      - name: Build and inspect signed production App Bundle (only when asked)
        if: ${{ inputs.app_bundle }}
        env:
          MOVERA_RELEASE_STORE_PASSWORD: ${{ secrets.MOVERA_RELEASE_STORE_PASSWORD }}
          MOVERA_RELEASE_KEY_ALIAS: ${{ secrets.MOVERA_RELEASE_KEY_ALIAS }}
          MOVERA_RELEASE_KEY_PASSWORD: ${{ secrets.MOVERA_RELEASE_KEY_PASSWORD }}
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY || secrets.GOOGLE_MAPS_API_KEY }}
        run: |
          set -euo pipefail
          app_version="$(sed -n 's/^version: *//p' pubspec.yaml)"
          test -n "$app_version"
          flutter build appbundle --release \
            -t lib/main_production.dart \
            --dart-define=MOVERA_FLAVOR=production \
            --dart-define=MOVERA_API_BASE_URL=https://api.movera.example \
            --dart-define=MOVERA_APP_VERSION="$app_version" \
            --dart-define=GOOGLE_CLIENT_ID_WEB="${GOOGLE_CLIENT_ID_WEB:-}" \
            --dart-define=GOOGLE_CLIENT_ID_IOS="${GOOGLE_CLIENT_ID_IOS:-}" \
            --dart-define=GOOGLE_SERVER_CLIENT_ID="${GOOGLE_SERVER_CLIENT_ID:-}" \
            --dart-define=APPLE_SERVICE_ID="${APPLE_SERVICE_ID:-}" \
            --dart-define=APPLE_REDIRECT_URI="${APPLE_REDIRECT_URI:-}"
          aab=build/app/outputs/bundle/release/app-release.aab
          test -f "$aab"
          jarsigner -verify -certs "$aab" > "$RUNNER_TEMP/aab-verify.txt" || { echo '::error::App Bundle signature check failed'; exit 1; }
          grep -q 'jar verified' "$RUNNER_TEMP/aab-verify.txt" || { echo '::error::App Bundle is not signed'; exit 1; }
          if grep -qi 'CN=Android Debug' "$RUNNER_TEMP/aab-verify.txt"; then
            echo '::error::App Bundle is debug-signed'
            exit 1
          fi
          mkdir -p out-aab
          cp "$aab" "out-aab/movera-rider-${app_version}.aab"
          ls -la out-aab
      - uses: actions/upload-artifact@v4
        if: ${{ inputs.app_bundle }}
        with:
          name: rider-app-bundle
          path: out-aab/*.aab
          retention-days: 7
          if-no-files-found: error
