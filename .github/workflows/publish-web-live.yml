name: Publish Rider Web Live

# Step 43 / plan U8 (owner Q52 "Yes", 2026-11-10): the live rider web is
# published only after the "CI gate" workflow (.github/workflows/ci.yml) has
# succeeded on the same commit, the way the driver's deploy-pages.yml and the
# admin's pages.yml do. A docs-only push to main does not start the CI gate
# (its paths-ignore), so nothing is republished for it; a docs-only pull
# request merge that does start it ends green with the heavy jobs skipped and
# republishes an unchanged app, which is harmless.
on:
  workflow_run:
    workflows: ["CI gate"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Only a successful CI gate of a push to main in this repository (or a manual
  # run) joins the shared group; a skipped run (pull request, fork, failure)
  # gets its own group so it cannot cancel a real deployment in progress.
  group: movera-rider-pages-${{ (github.event_name == 'workflow_dispatch' || (github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository && github.event.workflow_run.head_branch == 'main')) && 'main' || github.run_id }}
  cancel-in-progress: true

jobs:
  publish:
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        (
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_repository.full_name == github.repository &&
          github.event.workflow_run.head_branch == 'main'
        )
      }}
    permissions:
      contents: write # Only the generated web-live branch needs a repository write.
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          # The exact commit the CI gate tested (empty on workflow_dispatch:
          # then the default branch head).
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.7'
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      # The live rider (the test week's server), once the repository variable
      # MOVERA_LIVE_API_URL names the server (e.g. https://movera-server-xxxx.onrender.com).
      # The only public build (the demo is no longer published).
      - name: Build the live rider web
        if: ${{ vars.MOVERA_LIVE_API_URL != '' }}
        env:
          LIVE_API: ${{ vars.MOVERA_LIVE_API_URL }}
          RIDER_MAP_ID: ${{ vars.RIDER_MAP_ID || '9fdc5d9e56d4a0916c77a424' }}
          MAPS_WEB_API_KEY: ${{ secrets.MAPS1 || secrets.MAPS || secrets.GOOGLE_MAPS_WEB_API_KEY || secrets.GOOGLE_MAPS_API_KEY || secrets.MAPS_API_KEY }}
        run: |
          case "$LIVE_API" in https://*) ;; *) echo "::error::MOVERA_LIVE_API_URL must start with https://"; exit 1 ;; esac
          if ! printf '%s' "$RIDER_MAP_ID" | grep -Eq '^[A-Za-z0-9]+$'; then
            echo "::error::Invalid RIDER_MAP_ID (letters and digits only)."
            exit 1
          fi
          app_version="$(sed -n 's/^version: *//p' pubspec.yaml)"
          # No service worker: web/flutter_bootstrap.js loads the app without
          # serviceWorkerSettings, index.html unregisters old workers, and the
          # flutter_service_worker.js this Flutter still writes is a stub that
          # unregisters itself (--pwa-strategy is deprecated and only changes
          # the default bootstrap, which this project does not use). Keep it
          # that way: an installed iPhone web app running one build's
          # main.dart.js against another deploy's files looks exactly like
          # "crash, blank, back on Home". The remaining cache is GitHub
          # Pages' own (about 10 minutes on index.html): a phone that opens a
          # just-replaced index.html gets 404s for the old fingerprinted
          # main.<sha>.dart.js until it expires; the boot screen then clears
          # after 20 s to an empty page, not to Home.
          flutter build web --release \
            -t lib/main_staging.dart \
            --dart-define=MOVERA_FLAVOR=staging \
            --dart-define=MOVERA_API_BASE_URL="$LIVE_API" \
            --dart-define=MOVERA_AUTH_REQUIRED=true \
            --dart-define=MOVERA_APP_VERSION="$app_version" \
            --dart-define=MOVERA_GOOGLE_MAP_ID="$RIDER_MAP_ID"
          printf '%s\n' '{"flavor":"staging","production":false}' > build/web/movera-environment.json
          # D12 (R10 #14): the same size budget as ci.yml's production build.
          python3 tool/check_web_budget.py build/web --main-raw 6500000 --main-gzip 1850000
          python3 - <<'PY'
          import os
          from pathlib import Path

          p = Path('build/web/index.html')
          s = p.read_text()
          bootstrap = '  <script src="flutter_bootstrap.js" defer onerror="window.moveraBootFailed && window.moveraBootFailed()"></script>'
          key = os.environ.get('MAPS_WEB_API_KEY', '')
          if key and bootstrap in s and 'maps.googleapis.com/maps/api/js' not in s:
              # LT-4 (owner 2026-11-03): only the address; index.html loads Maps when the first map opens.
              s = s.replace(bootstrap, f'  <script>window.moveraMapsSrc = "https://maps.googleapis.com/maps/api/js?key={key}";</script>\n' + bootstrap)
          s = s.replace('<base href="/">', '<base href="/movera-rider-app/live/">')
          p.write_text(s)
          PY
          rm -rf /tmp/movera-live
          cp -a build/web /tmp/movera-live
          git checkout -- .

      # Owner 2026-11-05 ("Archive + send to live"): the public demo is no longer
      # published. The site root and any non-/live/ path open the live rider, the
      # same way the driver's deploy-pages.yml and the admin's pages.yml do.
      # The old demo steps are archived in the Rules repo
      # (archive/public-demo-pages-2026-11-05/). lib/main_demo.dart stays for tests.
      - name: Assemble the site
        run: |
          if [ ! -d /tmp/movera-live ]; then
            echo "::error::No live build: set the repository variable MOVERA_LIVE_API_URL."
            exit 1
          fi
          rm -rf /tmp/movera-pages
          mkdir -p /tmp/movera-pages
          cp -a /tmp/movera-live /tmp/movera-pages/live
          for page in index.html 404.html; do
            printf '%s\n' '<!doctype html><meta http-equiv="refresh" content="0;url=/movera-rider-app/live/"><link rel="canonical" href="/movera-rider-app/live/"><script>location.replace("/movera-rider-app/live/")</script>' > "/tmp/movera-pages/$page"
          done
          touch /tmp/movera-pages/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload GitHub Pages site
        uses: actions/upload-pages-artifact@v3
        with:
          path: /tmp/movera-pages

      - name: Deploy GitHub Pages
        id: pages
        uses: actions/deploy-pages@v4
