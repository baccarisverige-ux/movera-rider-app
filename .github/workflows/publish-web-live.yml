name: Publish Rider Web Demo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: movera-rider-pages
  cancel-in-progress: true

jobs:
  publish:
    permissions:
      contents: write # Only the generated web-live branch needs a repository write.
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      # The live rider (the test week's server) next to the demo, once the repository variable
      # MOVERA_LIVE_API_URL names the server (e.g. https://movera-server-xxxx.onrender.com).
      # Built first: the demo build below reuses build/web.
      - name: Build the live rider web
        if: ${{ vars.MOVERA_LIVE_API_URL != '' }}
        env:
          LIVE_API: ${{ vars.MOVERA_LIVE_API_URL }}
          RIDER_MAP_ID: ${{ vars.RIDER_MAP_ID || '9fdc5d9e56d4a0916c77a424' }}
          MAPS_WEB_API_KEY: ${{ secrets.MAPS1 || secrets.MAPS || secrets.GOOGLE_MAPS_WEB_API_KEY || secrets.GOOGLE_MAPS_API_KEY || secrets.MAPS_API_KEY }}
        run: |
          case "$LIVE_API" in https://*) ;; *) echo "::error::MOVERA_LIVE_API_URL must start with https://"; exit 1 ;; esac
          if ! printf '%s' "$RIDER_MAP_ID" | grep -Eq '^[A-Za-z0-9]+$'; then
            echo "::error::Invalid RIDER_MAP_ID (letters and digits only)."
            exit 1
          fi
          app_version="$(sed -n 's/^version: *//p' pubspec.yaml)"
          # No service worker: web/flutter_bootstrap.js loads the app without
          # serviceWorkerSettings, index.html unregisters old workers, and the
          # flutter_service_worker.js this Flutter still writes is a stub that
          # unregisters itself (--pwa-strategy is deprecated and only changes
          # the default bootstrap, which this project does not use). Keep it
          # that way: an installed iPhone web app running one build's
          # main.dart.js against another deploy's files looks exactly like
          # "crash, blank, back on Home". The remaining cache is GitHub
          # Pages' own (about 10 minutes on index.html): a phone that opens a
          # just-replaced index.html gets 404s for the old fingerprinted
          # main.<sha>.dart.js until it expires; the boot screen then clears
          # after 20 s to an empty page, not to Home.
          flutter build web --release \
            -t lib/main_staging.dart \
            --dart-define=MOVERA_FLAVOR=staging \
            --dart-define=MOVERA_API_BASE_URL="$LIVE_API" \
            --dart-define=MOVERA_AUTH_REQUIRED=true \
            --dart-define=MOVERA_APP_VERSION="$app_version" \
            --dart-define=MOVERA_GOOGLE_MAP_ID="$RIDER_MAP_ID"
          printf '%s\n' '{"flavor":"staging","production":false}' > build/web/movera-environment.json
          python3 - <<'PY'
          import os
          from pathlib import Path

          p = Path('build/web/index.html')
          s = p.read_text()
          bootstrap = '  <script src="flutter_bootstrap.js" defer onerror="window.moveraBootFailed && window.moveraBootFailed()"></script>'
          key = os.environ.get('MAPS_WEB_API_KEY', '')
          if key and bootstrap in s and 'maps.googleapis.com/maps/api/js' not in s:
              s = s.replace(bootstrap, f'  <script src="https://maps.googleapis.com/maps/api/js?key={key}" async defer></script>\n' + bootstrap)
          s = s.replace('<base href="/">', '<base href="/movera-rider-app/live/">')
          p.write_text(s)
          PY
          rm -rf /tmp/movera-live
          cp -a build/web /tmp/movera-live
          git checkout -- .

      - name: Build explicit demo Flutter web
        env:
          # Same Google Cloud Map ID (cloud-based styling) as the driver app.
          RIDER_MAP_ID: ${{ vars.RIDER_MAP_ID || '9fdc5d9e56d4a0916c77a424' }}
        run: |
          if ! printf '%s' "$RIDER_MAP_ID" | grep -Eq '^[A-Za-z0-9]+$'; then
            echo "::error::Invalid RIDER_MAP_ID (letters and digits only)."
            exit 1
          fi
          # rider-u18: telemetry reports the pubspec version, not 'dev'.
          app_version="$(sed -n 's/^version: *//p' pubspec.yaml)"
          test -n "$app_version"
          flutter build web --release \
            -t lib/main_demo.dart \
            --dart-define=MOVERA_FLAVOR=demo \
            --dart-define=MOVERA_API_BASE_URL=https://api.demo.movera.invalid \
            --dart-define=MOVERA_APP_VERSION="$app_version" \
            --dart-define=MOVERA_GOOGLE_MAP_ID=${{ vars.RIDER_MAP_ID || '9fdc5d9e56d4a0916c77a424' }}
          printf '%s\n' '{"flavor":"demo","production":false}' > build/web/movera-environment.json

      - name: Configure Google Maps for web
        env:
          MAPS_WEB_API_KEY: ${{ secrets.MAPS1 || secrets.MAPS || secrets.GOOGLE_MAPS_WEB_API_KEY || secrets.GOOGLE_MAPS_API_KEY || secrets.MAPS_API_KEY }}
        run: |
          if [ -z "$MAPS_WEB_API_KEY" ]; then
            echo "::error::Missing Google Maps API key. Add the MAPS1 repository secret."
            exit 1
          fi
          python3 - <<'PY'
          import os
          from pathlib import Path

          p = Path('build/web/index.html')
          s = p.read_text()
          bootstrap = '  <script src="flutter_bootstrap.js" defer onerror="window.moveraBootFailed && window.moveraBootFailed()"></script>'
          # async matters: without it this is a render-blocking script sitting
          # ahead of the app, and the parser stops for ~0.9s of Maps JS before
          # Flutter even starts loading. Nothing reads google.maps until a map
          # widget is built, long after boot, so it does not need to block —
          # measured at 713ms, against a first frame at 2.3s.
          maps = f'  <script src="https://maps.googleapis.com/maps/api/js?key={os.environ["MAPS_WEB_API_KEY"]}" async defer></script>'
          if bootstrap not in s:
              raise SystemExit('Flutter bootstrap tag not found')
          if 'maps.googleapis.com/maps/api/js' not in s:
              s = s.replace(bootstrap, maps + '\n' + bootstrap)
          p.write_text(s)
          PY

      - name: Fingerprint compiled Flutter bundle
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          build = Path('build/web')
          version = os.environ['GITHUB_SHA'][:8]
          main = build / 'main.dart.js'
          bootstrap = build / 'flutter_bootstrap.js'
          index = build / 'index.html'

          versioned_main = f'main.{version}.dart.js'
          versioned_bootstrap = f'flutter_bootstrap.{version}.js'

          bootstrap_text = bootstrap.read_text()
          bootstrap_text = bootstrap_text.replace('main.dart.js', versioned_main)
          bootstrap.write_text(bootstrap_text)
          main.rename(build / versioned_main)
          bootstrap.rename(build / versioned_bootstrap)

          index_text = index.read_text()
          index_text = index_text.replace(
              'flutter_bootstrap.js',
              versioned_bootstrap,
          )
          # Pages caches plain names: version the map gesture layer too.
          index_text = index_text.replace(
              'src="rider_map_camera.js"',
              f'src="rider_map_camera.js?v={version}"',
          )
          index.write_text(index_text)
          PY

      - name: Prepare GitHub Pages build
        run: |
          rm -rf /tmp/movera-pages
          mkdir -p /tmp/movera-pages
          cp -a build/web/. /tmp/movera-pages/
          python3 - <<'PY'
          from pathlib import Path
          p = Path('/tmp/movera-pages/index.html')
          s = p.read_text()
          s = s.replace('<base href="/">', '<base href="/movera-rider-app/">')
          p.write_text(s)
          PY
          if [ -d /tmp/movera-live ]; then cp -a /tmp/movera-live /tmp/movera-pages/live; fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload GitHub Pages site
        uses: actions/upload-pages-artifact@v3
        with:
          path: /tmp/movera-pages

      - name: Deploy GitHub Pages
        id: pages
        uses: actions/deploy-pages@v4

      - name: Point compiled app assets to public CDN
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('build/web/index.html')
          s = p.read_text()
          s = s.replace('<base href="/">', '<base href="https://cdn.jsdelivr.net/gh/baccarisverige-ux/movera-rider-app@web-live/">')
          p.write_text(s)
          PY

      - name: Publish compiled output to web-live branch
        run: |
          rm -rf /tmp/movera-web
          mkdir -p /tmp/movera-web
          cp -a build/web/. /tmp/movera-web/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # flutter build regenerates tracked files (plugin registrants, pubspec.lock)
          # as a side effect; the built output is already copied to /tmp/movera-web
          # above, so discard those before switching branches or checkout aborts.
          git checkout -- .
          git fetch origin web-live:web-live
          git checkout web-live
          git rm -rf . || true
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/movera-web/. .
          touch .nojekyll
          git add -A
          git commit -m "Publish Movera Rider web build"
          git push origin HEAD:web-live
