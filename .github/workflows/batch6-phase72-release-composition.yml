name: Batch 6 Phase 72 Release Composition

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'lib/app/**'
      - 'lib/core/**'
      - 'lib/main*.dart'
      - 'test/architecture/**'
      - '.github/workflows/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A newer push cancels the older run of the same workflow on the same ref
  # (pull request refs and branch refs are different groups).
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-composition:
    # CI cost cut (owner 2026-11-06): drafts skip this check.
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.7'
          cache: true

      - run: flutter pub get

      - name: Actual AppScope production smoke
        run: |
          flutter test test/architecture/phase72_actual_release_composition_test.dart
          flutter test test/architecture/transport_composition_test.dart
          flutter test test/architecture/release_observability_test.dart

      - name: Build staging artifact
        run: |
          flutter build web --release \
            -t lib/main_staging.dart \
            --dart-define=MOVERA_FLAVOR=staging \
            --dart-define=MOVERA_API_BASE_URL=https://api.staging.movera.example
          test -f build/web/main.dart.js

      - name: Build production artifact
        run: |
          rm -rf build/web
          flutter build web --release \
            -t lib/main_production.dart \
            --dart-define=MOVERA_FLAVOR=production \
            --dart-define=MOVERA_API_BASE_URL=https://api.movera.example
          test -f build/web/main.dart.js
