name: Audit live Rider in Chromium

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/live-rider-browser-audit.yml'
      - '.github/live-audit-trigger.txt'
  push:
    branches: [main]
    paths:
      - '.github/workflows/live-rider-browser-audit.yml'
      - '.github/live-audit-trigger.txt'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Playwright Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install --save-dev playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium

      - name: Audit actual live Rider
        run: |
          cat > live-audit.mjs <<'JS'
          import { chromium } from 'playwright';
          import fs from 'fs';

          const baseUrl = 'https://baccarisverige-ux.github.io/movera-rider-app/';
          const browser = await chromium.launch({headless:true});
          const context = await browser.newContext({
            viewport: {width:390, height:844},
            deviceScaleFactor: 1,
            isMobile: true,
            hasTouch: true,
            locale: 'en-US',
          });
          // Round 4: the app speaks the zone's language (sv in Stockholm); these
          // checks read the English copy, so pin the rider's choice to English.
          await context.addInitScript(() => localStorage.setItem('flutter.movera_app_language', '"en"'));
          const page = await context.newPage();
          const pageErrors = [];
          const consoleErrors = [];
          page.on('pageerror', e => pageErrors.push({message:String(e), stack:e.stack || ''}));
          page.on('console', m => { if (m.type() === 'error') consoleErrors.push(m.text()); });

          const url = baseUrl + '?v=live-trace-' + Date.now();
          await page.goto(url, {waitUntil:'networkidle', timeout:120000});
          await page.waitForTimeout(5000);

          const placeholder = page.locator('flt-semantics-placeholder');
          if (await placeholder.count()) {
            await placeholder.first().click({force:true}).catch(()=>{});
            await page.waitForTimeout(1200);
          }

          const semantics = await page.evaluate(() => Array.from(document.querySelectorAll('flt-semantics')).map((el, index) => {
            const r = el.getBoundingClientRect();
            return {
              index,
              text: (el.textContent || '').trim(),
              ariaLabel: el.getAttribute('aria-label'),
              role: el.getAttribute('role'),
              rect: {x:r.x,y:r.y,width:r.width,height:r.height},
            };
          }).filter(x => x.text || x.ariaLabel || x.role));

          const scriptUrls = await page.evaluate(() => Array.from(document.scripts).map(s => s.src).filter(Boolean));
          const mainScript = scriptUrls.find(u => /main\.[a-f0-9]+\.dart\.js/.test(u)) || scriptUrls.find(u => /main.*dart\.js/.test(u)) || null;
          let bundleSnippets = [];
          if (mainScript) {
            const js = await (await fetch(mainScript)).text();
            const lines = js.split('\n');
            const wanted = new Set();
            const stackText = [
              ...pageErrors.map(e => `${e.message}\n${e.stack}`),
              ...consoleErrors,
            ].join('\n');
            for (const match of stackText.matchAll(/\.dart\.js:(\d+):(\d+)/g)) wanted.add(Number(match[1]));
            bundleSnippets = [...wanted].sort((a,b)=>a-b).map(line => ({
              line,
              from: Math.max(1, line - 8),
              to: Math.min(lines.length, line + 8),
              text: lines.slice(Math.max(0, line - 9), Math.min(lines.length, line + 8)).map((t,i)=>`${Math.max(1,line-8)+i}: ${t}`).join('\n'),
            }));
          }

          await page.screenshot({path:'live-trace.png', fullPage:true});
          const html = await page.content();
          const report = {
            url: page.url(),
            title: await page.title(),
            pageErrors,
            consoleErrors,
            mainScript,
            bundleSnippets,
            semantics,
            hasFlutterView: html.includes('flutter-view') || html.includes('flt-glass-pane'),
          };
          fs.writeFileSync('live-trace.json', JSON.stringify(report, null, 2));
          console.log(JSON.stringify(report, null, 2));
          await browser.close();
          JS
          node live-audit.mjs

      - name: Upload live audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-rider-browser-audit
          path: |
            live-trace.png
            live-trace.json
          if-no-files-found: error
