name: Architecture gates

on:
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'test/**'
      - 'pubspec.yaml'
      - '.github/workflows/architecture-gates.yml'
  pull_request:
    paths:
      - 'lib/**'
      - 'test/**'
      - 'pubspec.yaml'
      - '.github/workflows/architecture-gates.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      # The arrive-by DST case only exists in a zone with daylight saving.
      - run: TZ=Europe/Stockholm flutter test test/scheduled_rides/audit_fix_arrive_by_dst_test.dart
      - run: TZ=America/New_York flutter test test/scheduled_rides/audit_fix_arrive_by_dst_test.dart
      # Audit round 4: times shown in the device zone.
      - run: TZ=Europe/Stockholm flutter test test/core/audit_fix_r4_device_zone_test.dart
      - run: TZ=America/New_York flutter test test/core/audit_fix_r4_device_zone_test.dart
      # Owner decision 9: pickup times on the pickup zone's clock, whatever the phone's.
      - run: TZ=Europe/Stockholm flutter test test/audit/owner9_zone_pickup_time_test.dart test/scheduled_rides
      - run: TZ=America/New_York flutter test test/audit/owner9_zone_pickup_time_test.dart test/scheduled_rides
