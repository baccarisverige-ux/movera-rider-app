name: Contract copy

on:
  pull_request:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: contract-copy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract-copy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      # Fails when contracts/ differs from movera-contracts main at the version
      # it claims (or from its own CHECKSUMS). The message says how to sync.
      - run: bash tool/check_contract_copy.sh
        env:
          CONTRACTS_TOKEN: ${{ secrets.CONTRACTS_TOKEN }}
