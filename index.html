<!DOCTYPE html>
<html>
<head>
  <!-- base href set by flutter build -->
  <base href="https://cdn.jsdelivr.net/gh/baccarisverige-ux/movera-rider-app@web-live/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Movera — premium rides in Sweden.">
  <!-- No viewport-fit=cover: it lays the page out edge to edge, underneath the
       status and gesture bars. In a browser tab that is harmless because the
       browser's own UI already occupies that space, but installed from the home
       screen there is no browser UI, so the app drew under the status bar while
       taps landed in the visible area below it — every control was offset by the
       status bar's height, and tapping "Where to?" hit the bottom nav instead.
       Covering that area is only safe for a layout that pays it back with
       env(safe-area-inset-*) padding, and this one does not. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#eef1e8">
  <meta name="color-scheme" content="light">
  <meta http-equiv="Cache-Control" content="no-store">

  <!-- iOS full-screen home screen app -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Movera">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Movera</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body, flt-glass-pane, flt-scene-host {
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      overscroll-behavior: none;
      background: #eef1e8;
      -webkit-tap-highlight-color: transparent;
      -webkit-text-size-adjust: 100%;
    }
    body.movera-overlay-open iframe,
    body.movera-overlay-open flt-platform-view,
    body.movera-overlay-open .gm-style {
      pointer-events: none !important;
    }

    /* Boot screen. Plain HTML and CSS so it paints in milliseconds, while the
       app bundle is still downloading and compiling. Without it the rider
       stares at an empty page for several seconds and assumes the app is
       broken rather than loading. Dart clears it on its first frame. */
    #movera-boot {
      position: fixed;
      inset: 0;
      z-index: 2147483647;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 28px;
      background: #eef1e8;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      opacity: 1;
      transition: opacity 240ms ease-out;
    }
    #movera-boot.movera-boot-done {
      opacity: 0;
      pointer-events: none;
    }
    #movera-boot .movera-boot-mark {
      font-size: 34px;
      font-weight: 600;
      letter-spacing: 0.14em;
      color: #1d252c;
      text-transform: uppercase;
    }
    #movera-boot .movera-boot-track {
      width: 132px;
      height: 3px;
      border-radius: 999px;
      background: rgba(29, 37, 44, 0.12);
      overflow: hidden;
    }
    #movera-boot .movera-boot-fill {
      display: block;
      width: 40%;
      height: 100%;
      border-radius: 999px;
      background: #1d252c;
      animation: movera-boot-slide 1150ms ease-in-out infinite;
    }
    @keyframes movera-boot-slide {
      0%   { transform: translateX(-110%); }
      100% { transform: translateX(360%); }
    }
    @media (prefers-reduced-motion: reduce) {
      #movera-boot .movera-boot-fill { animation: none; width: 100%; }
      #movera-boot { transition: none; }
    }
  </style>
</head>
<body>
  <div id="movera-boot" role="status" aria-live="polite" aria-label="Loading Movera">
    <div class="movera-boot-mark">Movera</div>
    <div class="movera-boot-track"><span class="movera-boot-fill"></span></div>
  </div>
  <script>
    // iOS home-screen icons saved before the manifest change can reopen the
    // original URL without its query string. Set the demo preview flag before
    // Flutter reads Uri.base, while preserving the current app path and ride.
    (function() {
      var installed = navigator.standalone === true ||
        (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);
      if (!installed || location.hostname !== 'baccarisverige-ux.github.io' ||
          !location.pathname.startsWith('/movera-rider-app/')) return;
      var url = new URL(location.href);
      if (url.searchParams.has('auth_preview') || url.searchParams.has('qa_wait')) return;
      url.searchParams.set('auth_preview', '1');
      history.replaceState(history.state, '', url);
    })();
  </script>
  <script>
    // Dart calls this from its first post-frame callback. The timer is only a
    // fallback: if the app fails to boot the rider should see whatever Flutter
    // did render (or the empty page and its own reload button) rather than a
    // loading screen that never ends.
    (function() {
      var cleared = false;
      function clear() {
        if (cleared) return;
        cleared = true;
        var boot = document.getElementById('movera-boot');
        if (!boot) return;
        boot.classList.add('movera-boot-done');
        setTimeout(function() {
          if (boot.parentNode) boot.parentNode.removeChild(boot);
        }, 280);
      }
      window.moveraAppReady = clear;
      setTimeout(clear, 20000);
    })();
  </script>
  <script src="movera_ride_snapshot_wipe.js"></script>
  <!-- Map gestures: tilt follows zoom live during a pinch (like the driver app). -->
  <script src="rider_map_camera.js?v=3f0f0123"></script>
  <script>
    // A page restored from the back-forward cache already retains its live
    // Flutter state. Do not reload it: installed PWAs use this path when they
    // are backgrounded and a reload would discard an active ride search.

    // Old Flutter builds used a service worker (flutter_service_worker.js) on
    // this same GitHub Pages scope. Remove any surviving one and its caches
    // before booting the current non-PWA app. Every worker is still removed
    // except firebase-messaging-sw.js: Firebase web push registers that one
    // when a build has Firebase configured, and removing it on every boot
    // would silently break push after the next reload.
    (function() {
      var tasks = [];

      function scriptOf(registration) {
        var worker = registration.active || registration.waiting || registration.installing;
        return worker && worker.scriptURL ? String(worker.scriptURL) : '';
      }

      if ('serviceWorker' in navigator) {
        tasks.push(
          navigator.serviceWorker.getRegistrations().then(function(registrations) {
            return Promise.all(registrations.filter(function(registration) {
              return scriptOf(registration).indexOf('firebase-messaging-sw.js') === -1;
            }).map(function(registration) {
              return registration.unregister();
            }));
          })
        );
      }

      if ('caches' in window) {
        tasks.push(
          caches.keys().then(function(keys) {
            return Promise.all(keys.map(function(key) {
              return caches.delete(key);
            }));
          })
        );
      }

      // Cleanup is deliberately fire-and-forget. Flutter bootstrap below is
      // deferred and must never wait for cache APIs or be interrupted by a
      // reload after the engine has already started.
      Promise.allSettled(tasks).catch(function() {});
    })();

    // Keep browser fetches fresh. Geocoding itself is performed by Flutter
    // through the authenticated Movera API; this helper remains for non-sensitive
    // web transport and preserves the established no-stale-cache contract.
    window.moveraFetchJson = async function(url) {
      var controller = new AbortController();
      var timer = setTimeout(function() { controller.abort(); }, 8000);
      try {
        var response = await fetch(url, {
          method: 'GET',
          mode: 'cors',
          cache: 'no-store',
          signal: controller.signal,
          headers: { 'Accept': 'application/json' }
        });
        if (!response.ok) return null;
        return await response.json();
      } catch (_) {
        return null;
      } finally {
        clearTimeout(timer);
      }
    };

    // Geocoding is performed by Flutter through the authenticated Movera API.
    // Do not expose rider addresses or coordinates to public browser-side
    // geocoding services from this shell.

    window.moveraDeviceHeading = null;
    window.moveraHeadingStarted = false;
    window.moveraHeadingStartPromise = null;
    window.moveraHeadingListenerCount = 0;
    window.moveraHeadingPermission = 'auto';
    window._moveraSawAbsoluteHeading = false;
    window._moveraHeadingArmed = false;
    window._moveraGestureAsked = false;
    window._moveraLastAskAt = 0;

    window.moveraBrowserInfo = function() {
      var ua = navigator.userAgent || '';
      var ios = /iPad|iPhone|iPod/.test(ua) ||
        (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
      var standalone = navigator.standalone === true;
      var knownInApp = /CriOS|FxiOS|EdgiOS|OPiOS|DuckDuckGo|Instagram|FBAN|FBAV|Line\/|LinkedIn|Twitter|GSA\/|MicroMessenger|Snapchat|Pinterest|Reddit|Discord|Telegram|Slack|WhatsApp|\bGrok\b|GitHub/.test(ua);
      var hasSafariToken = /Safari\//.test(ua);
      var hasVersionToken = /Version\//.test(ua);
      var safari = ios && hasSafariToken && hasVersionToken &&
        !/CriOS|FxiOS|EdgiOS|OPiOS|GSA\//.test(ua);
      var inApp = ios && !safari;
      var kind = safari ? 'safari' : (inApp ? 'in-app' : (ios ? 'ios-other' : 'other'));
      return {
        ua: ua,
        ios: ios,
        standalone: standalone,
        safari: safari,
        inApp: inApp,
        knownInApp: knownInApp,
        kind: kind,
        secure: !!window.isSecureContext
      };
    };

    window.moveraHeadingDebug = {
      ua: navigator.userAgent || '',
      browserKind: 'other',
      isIOS: false,
      inAppBrowser: false,
      safari: false,
      standalone: false,
      secure: !!window.isSecureContext,
      hasDeviceOrientationEvent: typeof DeviceOrientationEvent !== 'undefined',
      hasRequestPermission: false,
      permission: 'auto',
      permissionRequestRan: false,
      permissionResult: null,
      permissionError: null,
      gestureAttempts: 0,
      started: false,
      listenerCount: 0,
      orientationEvents: 0,
      absoluteEvents: 0,
      lastAlpha: null,
      lastWebkitCompassHeading: null,
      lastEventType: null,
      lastEventAbsolute: null,
      calculatedHeading: null,
      dartHeading: null,
      dartCompassActive: false,
      dartStartResult: null,
      dartStartError: null,
      puckHeading: null,
      brokenStage: 'permission: waiting for user gesture',
      note: ''
    };

    window.moveraBrokenStage = function() {
      var d = window.moveraHeadingDebug;
      if (!d.hasDeviceOrientationEvent) {
        return 'events: DeviceOrientationEvent missing';
      }
      if (d.hasRequestPermission && d.permission !== 'granted') {
        if (d.permissionError && /NotAllowedError|user gesture|permission/i.test(String(d.permissionError))) {
          return 'permission: request was not a trusted browser gesture';
        }
        if (d.permission === 'denied' && d.inAppBrowser) {
          return 'permission: in-app WKWebView silent deny (open in Safari)';
        }
        if (d.permission === 'denied') {
          return 'permission: Safari/user denied motion access';
        }
        if (!d.permissionRequestRan) {
          return 'permission: request never ran — waiting for a real tap';
        }
        return 'permission: waiting for grant (tap again to retry)';
      }
      if (d.orientationEvents === 0 && d.absoluteEvents === 0) {
        if (d.permission === 'granted' || !d.hasRequestPermission) {
          return 'events: no deviceorientation after start';
        }
        return 'events: none yet';
      }
      if (d.calculatedHeading == null) {
        return 'calculated heading: events have no webkitCompassHeading/alpha';
      }
      if (d.dartHeading == null) {
        return 'Dart: JS heading not received by poller';
      }
      return 'puck: dart has heading — bitmap should rotate';
    };

    window.moveraRefreshHeadingDebug = function() {
      var info = window.moveraBrowserInfo();
      var d = window.moveraHeadingDebug;
      d.ua = info.ua;
      d.browserKind = info.kind;
      d.isIOS = info.ios;
      d.inAppBrowser = info.inApp;
      d.safari = info.safari;
      d.standalone = info.standalone;
      d.secure = info.secure;
      d.hasDeviceOrientationEvent = typeof DeviceOrientationEvent !== 'undefined';
      d.hasRequestPermission = window.moveraNeedsOrientationPermission();
      d.permission = window.moveraHeadingPermission;
      d.started = !!window.moveraHeadingStarted;
      d.listenerCount = window.moveraHeadingListenerCount || 0;
      d.calculatedHeading = window.moveraDeviceHeading;
      if (typeof window.moveraPuckHeading === 'number') d.puckHeading = window.moveraPuckHeading;
      if (typeof window.moveraDartStartResult === 'boolean') d.dartStartResult = window.moveraDartStartResult;
      if (window.moveraDartStartError) d.dartStartError = String(window.moveraDartStartError);
      d.brokenStage = window.moveraBrokenStage();
      if (info.inApp && d.hasRequestPermission && d.permission === 'denied') {
        d.note = 'This in-app browser cannot grant motion permission. Open the same URL in Safari.';
      } else if (info.safari && d.permission === 'denied') {
        d.note = 'Safari denied motion. Settings → Safari → Motion & Orientation Access, then reload.';
      } else if (info.safari && d.permission !== 'granted') {
        d.note = 'Waiting for a real tap so iOS can prompt for motion.';
      } else {
        d.note = '';
      }
      return d;
    };

    window.moveraHeadingSnapshot = function() {
      return JSON.parse(JSON.stringify(window.moveraRefreshHeadingDebug()));
    };

    window.moveraWrapHeading = function(value) {
      var heading = Number(value) % 360;
      if (heading < 0) heading += 360;
      return heading;
    };

    window.moveraScreenAngle = function() {
      if (screen.orientation && typeof screen.orientation.angle === 'number') {
        return screen.orientation.angle;
      }
      if (typeof window.orientation === 'number') return window.orientation;
      return 0;
    };

    window.moveraHeadingFromEvent = function(event) {
      var heading = null;
      if (typeof event.webkitCompassHeading === 'number' && isFinite(event.webkitCompassHeading)) {
        heading = event.webkitCompassHeading;
      } else if (typeof event.alpha === 'number' && isFinite(event.alpha)) {
        heading = 360 - event.alpha;
      }
      if (heading == null || !isFinite(heading)) return null;
      return window.moveraWrapHeading(heading + window.moveraScreenAngle());
    };

    window._moveraOnOrientation = function(event) {
      if (!event) return;
      var isAbsolute = event.type === 'deviceorientationabsolute';
      if (isAbsolute) {
        window.moveraHeadingDebug.absoluteEvents += 1;
      } else {
        window.moveraHeadingDebug.orientationEvents += 1;
      }
      window.moveraHeadingDebug.lastEventType = event.type;
      window.moveraHeadingDebug.lastEventAbsolute = !!event.absolute;
      window.moveraHeadingDebug.lastAlpha =
        (typeof event.alpha === 'number' && isFinite(event.alpha)) ? event.alpha : null;
      window.moveraHeadingDebug.lastWebkitCompassHeading =
        (typeof event.webkitCompassHeading === 'number' && isFinite(event.webkitCompassHeading))
          ? event.webkitCompassHeading
          : null;
      var heading = window.moveraHeadingFromEvent(event);
      if (heading == null) return;
      var fromWebkit = typeof event.webkitCompassHeading === 'number' &&
        isFinite(event.webkitCompassHeading);
      if (!isAbsolute && window._moveraSawAbsoluteHeading && !fromWebkit) {
        return;
      }
      if (isAbsolute) window._moveraSawAbsoluteHeading = true;
      window.moveraDeviceHeading = heading;
      window.moveraHeadingDebug.calculatedHeading = heading;
    };

    window.moveraAttachHeadingListeners = function() {
      window.removeEventListener('deviceorientationabsolute', window._moveraOnOrientation, true);
      window.removeEventListener('deviceorientation', window._moveraOnOrientation, true);
      window.addEventListener('deviceorientationabsolute', window._moveraOnOrientation, true);
      window.addEventListener('deviceorientation', window._moveraOnOrientation, true);
      window.moveraHeadingListenerCount = 2;
    };

    window.moveraStopHeading = function() {
      if (window._moveraOnOrientation) {
        window.removeEventListener('deviceorientationabsolute', window._moveraOnOrientation, true);
        window.removeEventListener('deviceorientation', window._moveraOnOrientation, true);
      }
      window.moveraHeadingStarted = false;
      window.moveraHeadingStartPromise = null;
      window.moveraHeadingListenerCount = 0;
      window._moveraSawAbsoluteHeading = false;
      // Do not freeze permission/retry state. A later real gesture may start again.
    };

    window.moveraInjectHeading = function(deg) {
      var value = Number(deg);
      if (!Number.isFinite(value)) return null;
      window.moveraDeviceHeading = window.moveraWrapHeading(value);
      window.moveraHeadingDebug.calculatedHeading = window.moveraDeviceHeading;
      return window.moveraDeviceHeading;
    };

    // Public releases intentionally do not install the Dart QA opener or the
    // RideCheck simulator. With a debug build or MOVERA_QA, Flutter installs
    // window.moveraSimulateRideCheck (it queues a Safety event, so it must
    // never exist in a public release).
    window.moveraSafetySnapshot = function() {
      try { return JSON.parse(window.moveraSafetySnapshotJson || '{}'); } catch (e) { return {}; }
    };

    window.moveraNeedsOrientationPermission = function() {
      return typeof DeviceOrientationEvent !== 'undefined' &&
        typeof DeviceOrientationEvent.requestPermission === 'function';
    };

    // iOS requires requestPermission() on the same stack as a real browser
    // gesture. Flutter canvas taps are not trusted. Capture-phase window
    // listeners are. Failed/rejected attempts must NOT lock later retries.
    window.moveraRequestHeadingFromGesture = function() {
      window._moveraGestureAsked = true;
      window.moveraHeadingDebug.gestureAttempts += 1;
      if (window.moveraHeadingStarted && window.moveraHeadingPermission === 'granted') {
        return;
      }
      try {
        if (window.moveraNeedsOrientationPermission()) {
          window.moveraHeadingDebug.permissionRequestRan = true;
          DeviceOrientationEvent.requestPermission().then(function(permission) {
            window.moveraHeadingDebug.permissionResult = String(permission);
            window.moveraHeadingDebug.permissionError = null;
            if (permission === 'granted') {
              window.moveraHeadingPermission = 'granted';
              window.moveraAttachHeadingListeners();
              window.moveraHeadingStarted = true;
            } else {
              window.moveraHeadingPermission = 'denied';
              // Still attach: some WKWebViews fire events after a silent deny.
              window.moveraAttachHeadingListeners();
            }
            window.moveraRefreshHeadingDebug();
          }).catch(function(err) {
            window.moveraHeadingDebug.permissionError =
              String(err && err.message ? err.message : err);
            // NotAllowedError means this tap was not trusted. Keep retrying.
            window.moveraRefreshHeadingDebug();
          });
          try {
            if (typeof DeviceMotionEvent !== 'undefined' &&
                typeof DeviceMotionEvent.requestPermission === 'function') {
              DeviceMotionEvent.requestPermission().then(function() {}).catch(function() {});
            }
          } catch (_) {}
          return;
        }
      } catch (err) {
        window.moveraHeadingDebug.permissionError = String(err && err.message ? err.message : err);
      }
      window.moveraStartHeading({fromGesture: true});
    };

    window.moveraStartHeading = async function(opts) {
      var fromGesture = !!(opts && opts.fromGesture);
      if (window.moveraHeadingStarted) return true;
      if (window.moveraHeadingPermission === 'denied' && !fromGesture) return false;
      if (window.moveraNeedsOrientationPermission() &&
          !fromGesture &&
          window.moveraHeadingPermission !== 'granted') {
        // Do not call requestPermission outside a user gesture. Dart/Home
        // startup would steal the iPhone prompt and fail.
        return false;
      }
      if (window.moveraHeadingStartPromise) return window.moveraHeadingStartPromise;
      window.moveraHeadingStartPromise = (async function() {
        try {
          if (typeof DeviceOrientationEvent === 'undefined' &&
              window.moveraHeadingPermission !== 'granted') {
            return false;
          }
          if (window.moveraNeedsOrientationPermission() &&
              window.moveraHeadingPermission !== 'granted') {
            window.moveraHeadingDebug.permissionRequestRan = true;
            var permission = await DeviceOrientationEvent.requestPermission();
            window.moveraHeadingDebug.permissionResult = String(permission);
            if (permission !== 'granted') {
              window.moveraHeadingPermission = 'denied';
              window.moveraAttachHeadingListeners();
              return false;
            }
            window.moveraHeadingPermission = 'granted';
          }
          window.moveraAttachHeadingListeners();
          window.moveraHeadingStarted = true;
          return true;
        } catch (err) {
          window.moveraHeadingDebug.permissionError =
            String(err && err.message ? err.message : err);
          return false;
        }
      })();
      var started = await window.moveraHeadingStartPromise;
      if (!started) window.moveraHeadingStartPromise = null;
      window.moveraRefreshHeadingDebug();
      return started;
    };

    window.moveraArmHeadingFromGesture = function() {
      if (window._moveraHeadingArmed) return;
      window._moveraHeadingArmed = true;
      var arm = function() {
        var now = Date.now();
        if (now - window._moveraLastAskAt < 350) return;
        window._moveraLastAskAt = now;
        window.moveraRequestHeadingFromGesture();
        if (window.moveraHeadingStarted && window.moveraHeadingPermission === 'granted') {
          window.removeEventListener('pointerdown', arm, true);
          window.removeEventListener('touchstart', arm, true);
          window.removeEventListener('touchend', arm, true);
          window.removeEventListener('click', arm, true);
        }
      };
      window.addEventListener('pointerdown', arm, true);
      window.addEventListener('touchstart', arm, true);
      window.addEventListener('touchend', arm, true);
      window.addEventListener('click', arm, true);
    };
    window.moveraArmHeadingFromGesture();
    // Do not stop heading on pagehide — iOS fires it for the motion prompt
    // and for backgrounding, which previously killed listeners after grant.
  </script>
  <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyBJ_3q856NuoUBtnddNnIUC_-zs6ZJDml8" async defer></script>
  <script src="flutter_bootstrap.3f0f0123.js" defer></script>
</body>
</html>
